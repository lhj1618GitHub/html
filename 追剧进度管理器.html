<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>追剧进度管理器</title>
<style>
    :root{
        --bg:#12141a;
        --surface:#1a1d24;
        --surface-2:#22262f;
        --surface-3:#2b303a;
        --text:#eef1f6;
        --text-dim:#98a1b0;
        --accent:#4a9cff;
        --accent-hover:#66aeff;
        --danger:#ff5568;
        --danger-hover:#e6475a;
        --success:#2ed573;
        --border:#2f3540;
        --radius:14px;
        --fs:16px;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    html{-webkit-text-size-adjust:100%;}

    body{
        font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        background:var(--bg);
        background-image:radial-gradient(900px 480px at 50% -8%,#1d2634 0%,transparent 70%);
        background-repeat:no-repeat;
        color:var(--text);
        font-size:var(--fs);
        line-height:1.5;
        padding:20px 16px 40px;
        max-width:1180px;
        margin:0 auto;
        min-height:100vh;
    }

    /* ---------- 头部 ---------- */
    .app-header{text-align:center;padding:6px 0 22px;}

    .app-header h1{
        font-size:1.7em;
        font-weight:700;
        letter-spacing:.02em;
        background:linear-gradient(135deg,#7cbcff,#4a9cff 45%,#9b8cff);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        margin-bottom:6px;
    }

    .app-header p{color:var(--text-dim);font-size:.85em;}

    /* ---------- 工具栏 ---------- */
    .toolbar{
        display:flex;
        flex-wrap:wrap;
        gap:10px;
        align-items:center;
        justify-content:space-between;
        margin-bottom:14px;
    }

    .search-box{position:relative;flex:1 1 260px;min-width:0;}

    .search-box input{
        width:100%;
        padding:11px 40px 11px 14px;
        border:1px solid var(--border);
        border-radius:12px;
        background:var(--surface);
        color:var(--text);
        font-size:.95em;
        font-family:inherit;
        transition:border-color .2s,box-shadow .2s;
    }

    .search-box input::placeholder{color:var(--text-dim);}

    .search-box input:focus{
        outline:none;
        border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(74,156,255,.15);
    }

    .clear-btn{
        position:absolute;
        right:8px;
        top:50%;
        transform:translateY(-50%);
        width:26px;height:26px;
        display:flex;align-items:center;justify-content:center;
        border:none;border-radius:50%;
        background:transparent;
        color:var(--text-dim);
        font-size:1.15em;
        line-height:1;
        cursor:pointer;
        transition:.2s;
    }

    .clear-btn:hover{background:var(--surface-3);color:var(--text);}

    .toolbar-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

    /* ---------- 按钮 ---------- */
    .btn{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:6px;
        padding:10px 15px;
        border:1px solid var(--border);
        border-radius:12px;
        background:var(--surface-2);
        color:var(--text);
        font-size:.92em;
        font-family:inherit;
        font-weight:500;
        line-height:1.2;
        white-space:nowrap;
        cursor:pointer;
        transition:background .18s,border-color .18s,color .18s,transform .1s;
        user-select:none;
    }

    .btn:hover{background:var(--surface-3);border-color:#3d4450;}
    .btn:active{transform:scale(.97);}
    .btn:disabled{opacity:.38;cursor:not-allowed;transform:none;}

    .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
    .btn-accent:hover{background:var(--accent-hover);border-color:var(--accent-hover);}

    .btn-danger{background:transparent;border-color:rgba(255,85,104,.35);color:var(--danger);}
    .btn-danger:hover{background:rgba(255,85,104,.12);border-color:var(--danger);}

    .btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff;}
    .btn-danger-solid:hover{background:var(--danger-hover);border-color:var(--danger-hover);}

    .btn-sm{padding:7px 13px;font-size:.85em;border-radius:9px;}

    .file-label{cursor:pointer;}

    /* ---------- 字号控件 ---------- */
    .font-controls{
        display:inline-flex;
        align-items:center;
        gap:2px;
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:12px;
        padding:2px;
    }

    .fs-btn{
        width:32px;height:30px;
        border:none;border-radius:9px;
        background:transparent;
        color:var(--text);
        font-family:inherit;
        font-size:.78em;
        font-weight:700;
        cursor:pointer;
        transition:.18s;
    }

    .fs-btn:hover:not(:disabled){background:var(--surface-3);}
    .fs-btn:disabled{opacity:.3;cursor:not-allowed;}

    .fs-label{
        min-width:36px;
        text-align:center;
        font-size:.78em;
        color:var(--text-dim);
    }

    /* ---------- 搜索结果提示 ---------- */
    .search-results{
        font-size:.82em;
        color:var(--text-dim);
        min-height:1.4em;
        margin-bottom:8px;
        padding-left:2px;
    }

    /* ---------- 列表 ---------- */
    .list{
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:var(--radius);
        overflow:hidden;
    }

    .list-head,
    .row{
        display:grid;
        grid-template-columns:minmax(0,2.2fr) minmax(0,1.1fr) minmax(0,1.4fr) 200px;
        gap:16px;
        align-items:center;
    }

    .list-head{
        padding:12px 18px;
        background:var(--surface-2);
        color:var(--text-dim);
        font-size:.8em;
        letter-spacing:.04em;
    }

    .list-head > div:last-child{text-align:right;}

    .row{
        padding:15px 18px;
        border-top:1px solid var(--border);
        transition:background .15s;
    }

    .row:hover{background:rgba(255,255,255,.025);}

    .cell-name{
        display:flex;
        align-items:center;
        gap:8px;
        min-width:0;
        flex-wrap:wrap;
    }

    .show-name{
        font-size:1.02em;
        font-weight:600;
        color:var(--text);
        text-decoration:none;
        overflow-wrap:anywhere;
    }

    a.show-name{color:var(--accent);}
    a.show-name:hover{text-decoration:underline;}

    .badge{
        flex:none;
        font-size:.68em;
        font-weight:600;
        padding:2px 8px;
        border-radius:999px;
        color:var(--success);
        background:rgba(46,213,115,.12);
        border:1px solid rgba(46,213,115,.3);
        letter-spacing:.02em;
    }

    .cell-days{
        font-size:.88em;
        color:var(--text-dim);
        overflow-wrap:anywhere;
    }

    .cell-progress{
        display:flex;
        flex-direction:column;
        gap:6px;
        min-width:0;
    }

    .progress-track{
        height:7px;
        border-radius:99px;
        background:var(--surface-3);
        overflow:hidden;
    }

    .progress-fill{
        height:100%;
        border-radius:99px;
        background:linear-gradient(90deg,var(--accent),#7d8cff);
        transition:width .35s ease;
    }

    .progress-fill.done{background:linear-gradient(90deg,var(--success),#26c06a);}

    .progress-text{
        font-size:.78em;
        color:var(--text-dim);
        font-variant-numeric:tabular-nums;
    }

    .cell-actions{
        display:flex;
        gap:6px;
        justify-content:flex-end;
    }

    /* ---------- 空状态 ---------- */
    .empty{
        padding:60px 24px;
        text-align:center;
        color:var(--text-dim);
    }

    .empty-emoji{font-size:2.6em;line-height:1;margin-bottom:14px;opacity:.65;}
    .empty p{font-size:.92em;}

    /* ---------- 模态框 ---------- */
    .modal{
        position:fixed;
        inset:0;
        z-index:100;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:16px;
        background:rgba(6,8,12,.72);
        backdrop-filter:blur(3px);
        -webkit-backdrop-filter:blur(3px);
        opacity:0;
        visibility:hidden;
        transition:opacity .2s ease,visibility .2s;
    }

    .modal.active{opacity:1;visibility:visible;}

    .modal-content{
        width:100%;
        max-width:520px;
        max-height:88vh;
        overflow-y:auto;
        padding:22px;
        background:var(--surface-2);
        border:1px solid var(--border);
        border-radius:18px;
        box-shadow:0 24px 60px rgba(0,0,0,.55);
        transform:translateY(14px) scale(.985);
        transition:transform .22s ease;
    }

    .modal.active .modal-content{transform:none;}

    .modal-sm{max-width:410px;}

    .modal-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        margin-bottom:18px;
    }

    .modal-head h2{font-size:1.12em;font-weight:600;}

    .icon-btn{
        flex:none;
        width:32px;height:32px;
        display:flex;align-items:center;justify-content:center;
        border:none;border-radius:9px;
        background:transparent;
        color:var(--text-dim);
        font-size:1.35em;
        line-height:1;
        cursor:pointer;
        transition:.18s;
    }

    .icon-btn:hover{background:var(--surface-3);color:var(--text);}

    .modal-text{
        color:var(--text-dim);
        font-size:.92em;
        line-height:1.75;
        overflow-wrap:anywhere;
    }

    /* ---------- 表单 ---------- */
    .field{margin-bottom:15px;}

    .field > label{
        display:block;
        margin-bottom:7px;
        font-size:.85em;
        color:var(--text-dim);
    }

    .req{color:var(--danger);font-size:.9em;}
    .opt{color:#6f7885;font-size:.9em;}

    .field input[type="text"],
    .field input[type="number"],
    .field input[type="url"]{
        width:100%;
        padding:11px 13px;
        border:1px solid var(--border);
        border-radius:11px;
        background:var(--surface);
        color:var(--text);
        font-size:.95em;
        font-family:inherit;
        transition:border-color .2s,box-shadow .2s;
    }

    .field input::placeholder{color:#5f6875;}

    .field input:focus{
        outline:none;
        border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(74,156,255,.15);
    }

    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

    /* 更新日 chips */
    .chips{display:flex;flex-wrap:wrap;gap:8px;}

    .chip{position:relative;display:inline-flex;cursor:pointer;}

    .chip input{
        position:absolute;
        opacity:0;
        width:0;height:0;
        pointer-events:none;
    }

    .chip span{
        display:inline-block;
        padding:7px 14px;
        border:1px solid var(--border);
        border-radius:999px;
        background:var(--surface);
        color:var(--text-dim);
        font-size:.85em;
        transition:.18s;
        user-select:none;
    }

    .chip:hover span{border-color:#3d4450;color:var(--text);}

    .chip input:checked + span{
        background:rgba(74,156,255,.16);
        border-color:var(--accent);
        color:var(--accent);
        font-weight:600;
    }

    .chip input:focus-visible + span{box-shadow:0 0 0 3px rgba(74,156,255,.25);}

    .modal-foot{
        display:flex;
        justify-content:flex-end;
        gap:10px;
        margin-top:22px;
    }

    /* 导入选项 */
    .radio-item{
        display:flex;
        gap:11px;
        align-items:flex-start;
        padding:13px;
        margin-bottom:10px;
        border:1px solid var(--border);
        border-radius:12px;
        background:var(--surface);
        cursor:pointer;
        transition:.18s;
    }

    .radio-item:hover{border-color:#3d4450;}

    .radio-item input{
        flex:none;
        margin-top:4px;
        accent-color:var(--accent);
        width:16px;height:16px;
        cursor:pointer;
    }

    .radio-item strong{display:block;font-size:.92em;font-weight:600;}
    .radio-item small{display:block;color:var(--text-dim);font-size:.8em;margin-top:2px;line-height:1.5;}

    .radio-item:has(input:checked){
        border-color:var(--accent);
        background:rgba(74,156,255,.08);
    }

    /* ---------- Toast ---------- */
    .toast-wrap{
        position:fixed;
        left:50%;
        bottom:28px;
        transform:translateX(-50%);
        z-index:300;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:8px;
        pointer-events:none;
        width:max-content;
        max-width:calc(100vw - 32px);
    }

    .toast{
        padding:11px 20px;
        border-radius:999px;
        background:var(--surface-3);
        border:1px solid var(--border);
        color:var(--text);
        font-size:.86em;
        box-shadow:0 10px 30px rgba(0,0,0,.45);
        animation:toastIn .25s ease;
        transition:opacity .25s,transform .25s;
        max-width:100%;
        text-align:center;
    }

    .toast.success{border-color:rgba(46,213,115,.5);}
    .toast.error{border-color:rgba(255,85,104,.5);}

    @keyframes toastIn{
        from{opacity:0;transform:translateY(10px);}
        to{opacity:1;transform:none;}
    }

    /* ---------- 平板 / 手机 ---------- */
    @media (max-width:780px){
        body{padding:14px 12px 32px;}

        .app-header{padding-bottom:18px;}
        .app-header h1{font-size:1.4em;}
        .app-header p{font-size:.8em;}

        .search-box{flex:1 1 100%;}

        .toolbar-actions{
            width:100%;
            justify-content:space-between;
        }

        .list-head{display:none;}

        .row{
            grid-template-columns:1fr;
            gap:10px;
            padding:15px 14px;
            align-items:start;
        }

        .cell-actions{justify-content:stretch;}
        .cell-actions .btn{flex:1;padding:9px 8px;}

        .field-row{grid-template-columns:1fr;gap:0;}

        .modal-content{padding:20px;}
    }

    @media (max-width:560px){
        .modal{
            align-items:flex-end;
            padding:0;
        }

        .modal-content{
            max-width:100%;
            max-height:92vh;
            border-radius:20px 20px 0 0;
            border-bottom:none;
            padding:20px 18px calc(20px + env(safe-area-inset-bottom));
        }

        .modal-foot .btn{flex:1;}

        .toolbar-actions{gap:7px;}
        .btn{padding:9px 13px;font-size:.88em;}
    }

    @media (prefers-reduced-motion:reduce){
        *{transition:none !important;animation:none !important;}
    }
</style>
</head>
<body>

<header class="app-header">
    <h1>追剧进度管理器</h1>
    <p>记录你的追剧进度 · 数据保存在本地 · 随时备份</p>
</header>

<div class="toolbar">
    <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索剧集…" autocomplete="off" aria-label="搜索剧集">
        <button class="clear-btn" id="clear-search" hidden aria-label="清除搜索">×</button>
    </div>

    <div class="toolbar-actions">
        <button class="btn btn-accent" id="add-show-btn">＋ 添加剧集</button>
        <button class="btn" id="export-btn">导出</button>
        <label class="btn file-label" for="import-file">导入</label>
        <input type="file" id="import-file" accept=".json,application/json" hidden>

        <div class="font-controls" role="group" aria-label="字体大小">
            <button class="fs-btn" id="font-decrease" title="减小字体">A−</button>
            <span class="fs-label" id="font-size-display">中</span>
            <button class="fs-btn" id="font-increase" title="增大字体">A+</button>
        </div>
    </div>
</div>

<div class="search-results" id="search-results"></div>

<div class="list">
    <div class="list-head">
        <div>剧集名称</div>
        <div>更新日</div>
        <div>进度</div>
        <div>操作</div>
    </div>
    <div id="shows-list"></div>
</div>

<!-- ========== 添加 / 编辑 ========== -->
<div class="modal" id="show-modal">
    <div class="modal-content">
        <div class="modal-head">
            <h2 id="modal-title">添加剧集</h2>
            <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
        </div>

        <form id="show-form" novalidate>
            <input type="hidden" id="edit-index" value="-1">

            <div class="field">
                <label for="f-name">剧集名称 <span class="req">必填</span></label>
                <input type="text" id="f-name" maxlength="80" placeholder="例如：某某某 第一季">
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="f-current">当前进度（集）</label>
                    <input type="number" id="f-current" min="0" step="1" value="0" inputmode="numeric">
                </div>
                <div class="field">
                    <label for="f-total">总集数 <span class="opt">选填</span></label>
                    <input type="number" id="f-total" min="1" step="1" inputmode="numeric" placeholder="未知可留空">
                </div>
            </div>

            <div class="field">
                <label>更新日 <span class="opt">可多选</span></label>
                <div class="chips" id="day-chips">
                    <label class="chip"><input type="checkbox" value="周一"><span>周一</span></label>
                    <label class="chip"><input type="checkbox" value="周二"><span>周二</span></label>
                    <label class="chip"><input type="checkbox" value="周三"><span>周三</span></label>
                    <label class="chip"><input type="checkbox" value="周四"><span>周四</span></label>
                    <label class="chip"><input type="checkbox" value="周五"><span>周五</span></label>
                    <label class="chip"><input type="checkbox" value="周六"><span>周六</span></label>
                    <label class="chip"><input type="checkbox" value="周日"><span>周日</span></label>
                </div>
            </div>

            <div class="field">
                <label for="f-link">链接地址 <span class="opt">选填</span></label>
                <input type="text" id="f-link" inputmode="url" placeholder="https://">
            </div>

            <div class="modal-foot">
                <button type="button" class="btn" data-close>取消</button>
                <button type="submit" class="btn btn-accent">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- ========== 通用确认框 ========== -->
<div class="modal" id="confirm-modal">
    <div class="modal-content modal-sm">
        <div class="modal-head">
            <h2 id="confirm-title">提示</h2>
        </div>
        <p class="modal-text" id="confirm-message"></p>
        <div class="modal-foot">
            <button type="button" class="btn" id="confirm-cancel">取消</button>
            <button type="button" class="btn btn-danger-solid" id="confirm-ok">确定</button>
        </div>
    </div>
</div>

<!-- ========== 导入选项 ========== -->
<div class="modal" id="import-modal">
    <div class="modal-content modal-sm">
        <div class="modal-head">
            <h2>导入选项</h2>
            <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
        </div>

        <p class="modal-text" style="margin-bottom:14px;">请选择导入方式：</p>

        <label class="radio-item">
            <input type="radio" name="import-mode" value="overwrite" checked>
            <span>
                <strong>覆盖导入</strong>
                <small>清空现有数据，完全使用导入文件中的记录</small>
            </span>
        </label>

        <label class="radio-item">
            <input type="radio" name="import-mode" value="merge">
            <span>
                <strong>合并导入</strong>
                <small>保留进度较多的记录，并合并新的剧集</small>
            </span>
        </label>

        <div class="modal-foot">
            <button type="button" class="btn" data-close>取消</button>
            <button type="button" class="btn btn-accent" id="import-confirm">确认导入</button>
        </div>
    </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
(function () {
    'use strict';

    /* ==================== 常量与状态 ==================== */

    const STORAGE_KEY = 'tvShows';
    const FONT_KEY = 'fontSize';
    const DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

    const FONT_LEVELS = [
        { key: 'small',  label: '小',   value: '14px' },
        { key: 'medium', label: '中',   value: '16px' },
        { key: 'large',  label: '大',   value: '18px' },
        { key: 'xlarge', label: '特大', value: '20px' }
    ];

    let shows = [];            // 剧集数据
    let searchTerm = '';       // 当前搜索词
    let pendingImport = null;  // 待确认导入的数据
    let confirmResolver = null;
    let fontIndex = 1;

    const el = {};

    /* ==================== 工具函数 ==================== */

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function toInt(value, fallback) {
        const n = parseInt(value, 10);
        return Number.isFinite(n) ? n : fallback;
    }

    function toast(message, type) {
        const node = document.createElement('div');
        node.className = 'toast' + (type ? ' ' + type : '');
        node.textContent = message;
        el.toastWrap.appendChild(node);

        setTimeout(function () {
            node.style.opacity = '0';
            node.style.transform = 'translateY(8px)';
            setTimeout(function () { node.remove(); }, 260);
        }, 2200);
    }

    /* ==================== 数据层 ==================== */

    function normalize(raw) {
        const total = Number(raw.totalEpisodes);
        let current = Math.max(0, toInt(raw.currentEpisode, 0));
        let totalEpisodes = Number.isFinite(total) && total > 0 ? Math.floor(total) : null;

        if (totalEpisodes !== null && current > totalEpisodes) current = totalEpisodes;

        let updateDays = [];
        if (Array.isArray(raw.updateDays)) {
            updateDays = raw.updateDays.filter(function (d) { return DAYS.indexOf(d) !== -1; });
        } else if (typeof raw.updateDay === 'string' && DAYS.indexOf(raw.updateDay) !== -1) {
            updateDays = [raw.updateDay];   // 兼容旧版本单值格式
        }

        return {
            name: String(raw.name || '').trim(),
            currentEpisode: current,
            totalEpisodes: totalEpisodes,
            updateDays: updateDays,
            link: typeof raw.link === 'string' ? raw.link.trim() : ''
        };
    }

    function loadShows() {
        try {
            const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (!Array.isArray(raw)) return [];
            return raw
                .filter(function (item) {
                    return item && typeof item === 'object' &&
                           typeof item.name === 'string' && item.name.trim() !== '';
                })
                .map(normalize);
        } catch (e) {
            return [];
        }
    }

    function persist() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(shows));
        } catch (e) {
            toast('保存失败，本地存储可能已满', 'error');
        }
    }

    /* ==================== 渲染 ==================== */

    function rowHtml(show, index) {
        const total = show.totalEpisodes || 0;
        const current = total > 0 ? Math.min(show.currentEpisode, total) : show.currentEpisode;
        const percent = total > 0 ? Math.min(100, Math.round((current / total) * 100)) : 0;
        const finished = total > 0 && current >= total;

        const progressText = total > 0
            ? current + ' / ' + total + ' 集'
            : '已看 ' + current + ' 集';

        const days = show.updateDays.length ? show.updateDays.join('、') : '不固定';

        const nameHtml = show.link
            ? '<a class="show-name" href="' + escapeHtml(show.link) + '" target="_blank" rel="noopener noreferrer">' +
              escapeHtml(show.name) + '</a>'
            : '<span class="show-name">' + escapeHtml(show.name) + '</span>';

        const badge = finished ? '<span class="badge">已完结</span>' : '';

        return '' +
            '<div class="row">' +
                '<div class="cell-name">' + nameHtml + badge + '</div>' +
                '<div class="cell-days">' + escapeHtml(days) + '</div>' +
                '<div class="cell-progress">' +
                    '<div class="progress-track">' +
                        '<div class="progress-fill' + (finished ? ' done' : '') + '" style="width:' + percent + '%"></div>' +
                    '</div>' +
                    '<div class="progress-text">' + progressText + '</div>' +
                '</div>' +
                '<div class="cell-actions">' +
                    '<button type="button" class="btn btn-sm" data-action="edit" data-index="' + index + '">编辑</button>' +
                    '<button type="button" class="btn btn-sm btn-accent" data-action="inc" data-index="' + index + '"' +
                        (finished ? ' disabled' : '') + '>+1</button>' +
                    '<button type="button" class="btn btn-sm btn-danger" data-action="del" data-index="' + index + '">删除</button>' +
                '</div>' +
            '</div>';
    }

    function render() {
        const term = searchTerm.trim().toLowerCase();
        const items = [];

        shows.forEach(function (show, index) {
            if (!term || show.name.toLowerCase().indexOf(term) !== -1) {
                items.push({ show: show, index: index });
            }
        });

        // 顶部统计提示
        if (term) {
            el.searchResults.textContent = items.length
                ? '找到 ' + items.length + ' 部匹配「' + searchTerm.trim() + '」的剧集'
                : '没有找到包含「' + searchTerm.trim() + '」的剧集';
        } else {
            el.searchResults.textContent = shows.length ? '共 ' + shows.length + ' 部剧集' : '';
        }

        // 空状态
        if (!items.length) {
            el.list.innerHTML =
                '<div class="empty">' +
                    '<div class="empty-emoji">' + (term ? '🔍' : '📺') + '</div>' +
                    '<p>' + (term
                        ? '没有找到匹配的剧集，换个关键词试试'
                        : '还没有追剧记录，点击「添加剧集」开始记录吧') + '</p>' +
                '</div>';
            return;
        }

        el.list.innerHTML = items.map(function (item) {
            return rowHtml(item.show, item.index);
        }).join('');
    }

    /* ==================== 字号控制 ==================== */

    function applyFont() {
        const level = FONT_LEVELS[fontIndex];
        document.documentElement.style.setProperty('--fs', level.value);
        el.fontDisplay.textContent = level.label;
        el.fontDec.disabled = fontIndex === 0;
        el.fontInc.disabled = fontIndex === FONT_LEVELS.length - 1;
        try { localStorage.setItem(FONT_KEY, level.key); } catch (e) { /* 忽略 */ }
    }

    function initFont() {
        const saved = localStorage.getItem(FONT_KEY);
        const idx = FONT_LEVELS.findIndex(function (l) { return l.key === saved; });
        fontIndex = idx === -1 ? 1 : idx;
        applyFont();
    }

    function changeFont(delta) {
        const next = Math.min(FONT_LEVELS.length - 1, Math.max(0, fontIndex + delta));
        if (next === fontIndex) return;
        fontIndex = next;
        applyFont();
    }

    /* ==================== 模态框 ==================== */

    function closeModals() {
        document.querySelectorAll('.modal.active').forEach(function (m) {
            m.classList.remove('active');
        });
    }

    function confirmDialog(options) {
        el.confirmTitle.textContent = options.title || '提示';
        el.confirmMsg.textContent = options.message || '';
        el.confirmOk.textContent = options.okText || '确定';
        el.confirmOk.className = 'btn ' + (options.danger === false ? 'btn-accent' : 'btn-danger-solid');
        el.confirmModal.classList.add('active');

        return new Promise(function (resolve) {
            confirmResolver = resolve;
        });
    }

    function settleConfirm(value) {
        el.confirmModal.classList.remove('active');
        const resolver = confirmResolver;
        confirmResolver = null;
        if (resolver) resolver(value);
    }

    /* ==================== 添加 / 编辑 ==================== */

    function setCheckedDays(days) {
        document.querySelectorAll('#day-chips input[type="checkbox"]').forEach(function (cb) {
            cb.checked = Array.isArray(days) && days.indexOf(cb.value) !== -1;
        });
    }

    function getCheckedDays() {
        return Array.prototype.map.call(
            document.querySelectorAll('#day-chips input[type="checkbox"]:checked'),
            function (cb) { return cb.value; }
        );
    }

    function openShowModal(index) {
        el.showForm.reset();
        el.editIndex.value = String(index);

        if (index === -1) {
            el.modalTitle.textContent = '添加剧集';
            el.fName.value = '';
            el.fCurrent.value = '0';
            el.fTotal.value = '';
            el.fLink.value = '';
            setCheckedDays([]);
        } else {
            const show = shows[index];
            if (!show) return;
            el.modalTitle.textContent = '编辑剧集';
            el.fName.value = show.name;
            el.fCurrent.value = show.currentEpisode;
            el.fTotal.value = show.totalEpisodes || '';
            el.fLink.value = show.link || '';
            setCheckedDays(show.updateDays);
        }

        el.showModal.classList.add('active');
        setTimeout(function () { el.fName.focus(); }, 60);
    }

    async function handleSubmit(e) {
        e.preventDefault();

        const editIndex = toInt(el.editIndex.value, -1);
        const name = el.fName.value.trim();

        if (!name) {
            toast('请输入剧集名称', 'error');
            el.fName.focus();
            return;
        }

        const current = Math.max(0, toInt(el.fCurrent.value, 0));
        const totalRaw = el.fTotal.value.trim();
        let total = totalRaw === '' ? null : Math.floor(Number(totalRaw));

        if (total !== null && (!Number.isFinite(total) || total <= 0)) total = null;

        if (total !== null && current > total) {
            toast('当前进度不能超过总集数', 'error');
            el.fCurrent.focus();
            return;
        }

        let link = el.fLink.value.trim();
        if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;

        // 同名检测（编辑时排除自身）
        const dupIndex = shows.findIndex(function (s, i) {
            return i !== editIndex && s.name.toLowerCase() === name.toLowerCase();
        });

        if (dupIndex !== -1) {
            if (editIndex === -1) {
                const goEdit = await confirmDialog({
                    title: '剧集已存在',
                    message: '已存在同名剧集「' + shows[dupIndex].name + '」，是否直接编辑该剧集？',
                    okText: '编辑该剧集',
                    danger: false
                });
                if (goEdit) openShowModal(dupIndex);
            } else {
                toast('已存在同名剧集', 'error');
            }
            return;
        }

        const record = {
            name: name,
            currentEpisode: current,
            totalEpisodes: total,
            updateDays: getCheckedDays(),
            link: link
        };

        if (editIndex === -1) {
            shows.push(record);
        } else {
            shows[editIndex] = record;
        }

        persist();
        render();
        closeModals();
        toast(editIndex === -1 ? '已添加「' + name + '」' : '已保存修改', 'success');
    }

    /* ==================== 行内操作 ==================== */

    function increment(index) {
        const show = shows[index];
        if (!show) return;

        if (show.totalEpisodes && show.currentEpisode >= show.totalEpisodes) {
            toast('已经追完啦 🎉');
            return;
        }

        show.currentEpisode += 1;
        persist();
        render();

        if (show.totalEpisodes && show.currentEpisode >= show.totalEpisodes) {
            toast('「' + show.name + '」已完结 🎉', 'success');
        }
    }

    async function removeShow(index) {
        const show = shows[index];
        if (!show) return;

        const ok = await confirmDialog({
            title: '删除剧集',
            message: '确定要删除「' + show.name + '」吗？该操作无法撤销。',
            okText: '删除'
        });
        if (!ok) return;

        shows.splice(index, 1);
        persist();
        render();
        toast('已删除', 'success');
    }

    function handleListClick(e) {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;

        const index = toInt(btn.dataset.index, -1);
        if (index < 0) return;

        switch (btn.dataset.action) {
            case 'edit': openShowModal(index); break;
            case 'inc':  increment(index); break;
            case 'del':  removeShow(index); break;
        }
    }

    /* ==================== 导出 / 导入 ==================== */

    function exportData() {
        if (!shows.length) {
            toast('还没有可导出的数据', 'error');
            return;
        }

        const blob = new Blob([JSON.stringify(shows, null, 2)], { type: 'application/json' });
        const d = new Date();
        const pad = function (n) { return String(n).padStart(2, '0'); };
        const filename = '追剧备份' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
                         pad(d.getHours()) + pad(d.getMinutes()) + '.json';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);

        toast('已导出备份文件', 'success');
    }

    function isValidRecord(item) {
        return item && typeof item === 'object' &&
               typeof item.name === 'string' && item.name.trim() !== '';
    }

    function handleImportFile(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (ev) {
            let data;
            try {
                data = JSON.parse(ev.target.result);
            } catch (err) {
                toast('无法解析该文件，请检查是否为 JSON 格式', 'error');
                return;
            }

            if (!Array.isArray(data) || !data.length || !data.every(isValidRecord)) {
                toast('文件内容不是有效的追剧备份数据', 'error');
                return;
            }

            pendingImport = data.map(normalize).filter(function (s) { return s.name; });
            el.importModal.classList.add('active');
        };

        reader.onerror = function () { toast('读取文件失败', 'error'); };
        reader.readAsText(file);
    }

    function applyImport() {
        if (!pendingImport || !pendingImport.length) {
            closeModals();
            return;
        }

        const modeEl = document.querySelector('input[name="import-mode"]:checked');
        const mode = modeEl ? modeEl.value : 'overwrite';

        if (mode === 'overwrite') {
            shows = pendingImport.slice();
        } else {
            pendingImport.forEach(function (item) {
                const idx = shows.findIndex(function (s) {
                    return s.name.toLowerCase() === item.name.toLowerCase();
                });

                if (idx === -1) {
                    shows.push(item);
                } else if (item.currentEpisode > shows[idx].currentEpisode) {
                    shows[idx] = item;
                }
            });
        }

        pendingImport = null;
        persist();
        render();
        closeModals();
        toast('数据导入成功', 'success');
    }

    /* ==================== 初始化 ==================== */

    function cacheElements() {
        el.list          = document.getElementById('shows-list');
        el.searchResults = document.getElementById('search-results');
        el.search        = document.getElementById('search-input');
        el.clearSearch   = document.getElementById('clear-search');
        el.addBtn        = document.getElementById('add-show-btn');
        el.exportBtn     = document.getElementById('export-btn');
        el.importFile    = document.getElementById('import-file');

        el.fontDec       = document.getElementById('font-decrease');
        el.fontInc       = document.getElementById('font-increase');
        el.fontDisplay   = document.getElementById('font-size-display');

        el.showModal     = document.getElementById('show-modal');
        el.showForm      = document.getElementById('show-form');
        el.modalTitle    = document.getElementById('modal-title');
        el.editIndex     = document.getElementById('edit-index');
        el.fName         = document.getElementById('f-name');
        el.fCurrent      = document.getElementById('f-current');
        el.fTotal        = document.getElementById('f-total');
        el.fLink         = document.getElementById('f-link');

        el.confirmModal  = document.getElementById('confirm-modal');
        el.confirmTitle  = document.getElementById('confirm-title');
        el.confirmMsg    = document.getElementById('confirm-message');
        el.confirmOk     = document.getElementById('confirm-ok');
        el.confirmCancel = document.getElementById('confirm-cancel');

        el.importModal   = document.getElementById('import-modal');
        el.importConfirm = document.getElementById('import-confirm');

        el.toastWrap     = document.getElementById('toast-wrap');
    }

    function bindEvents() {
        // 搜索
        el.search.addEventListener('input', function () {
            searchTerm = el.search.value;
            el.clearSearch.hidden = searchTerm === '';
            render();
        });

        el.clearSearch.addEventListener('click', function () {
            el.search.value = '';
            searchTerm = '';
            el.clearSearch.hidden = true;
            render();
            el.search.focus();
        });

        // 顶部操作
        el.addBtn.addEventListener('click', function () { openShowModal(-1); });
        el.exportBtn.addEventListener('click', exportData);
        el.importFile.addEventListener('change', handleImportFile);

        // 字号
        el.fontDec.addEventListener('click', function () { changeFont(-1); });
        el.fontInc.addEventListener('click', function () { changeFont(1); });

        // 列表事件委托
        el.list.addEventListener('click', handleListClick);

        // 表单
        el.showForm.addEventListener('submit', handleSubmit);

        // 关闭按钮
        document.querySelectorAll('[data-close]').forEach(function (btn) {
            btn.addEventListener('click', closeModals);
        });

        // 遮罩点击关闭
        el.showModal.addEventListener('click', function (e) {
            if (e.target === el.showModal) closeModals();
        });
        el.importModal.addEventListener('click', function (e) {
            if (e.target === el.importModal) closeModals();
        });
        el.confirmModal.addEventListener('click', function (e) {
            if (e.target === el.confirmModal) settleConfirm(false);
        });

        // 确认框
        el.confirmOk.addEventListener('click', function () { settleConfirm(true); });
        el.confirmCancel.addEventListener('click', function () { settleConfirm(false); });

        // 导入确认
        el.importConfirm.addEventListener('click', applyImport);

        // 键盘
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;

            if (el.confirmModal.classList.contains('active')) {
                settleConfirm(false);
            } else if (document.querySelector('.modal.active')) {
                closeModals();
            } else if (searchTerm) {
                el.search.value = '';
                searchTerm = '';
                el.clearSearch.hidden = true;
                render();
            }
        });
    }

    function init() {
        cacheElements();
        initFont();
        bindEvents();
        shows = loadShows();
        render();
    }

    init();
})();
</script>
</body>
</html>
