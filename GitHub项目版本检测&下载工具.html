<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1115">
<title>GitHub 版本检测 &amp; 下载</title>
<style>
    :root{
        --bg:#0f1115;
        --surface:#171a21;
        --surface-2:#1e232c;
        --surface-3:#262c37;
        --text:#e8ecf3;
        --text-dim:#8f99a8;
        --accent:#4a9cff;
        --accent-hover:#6aafff;
        --success:#2ed573;
        --warning:#f5b83d;
        --danger:#ff5568;
        --purple:#8b5cf6;
        --border:#2a303b;
        --radius:14px;
        --fs:15px;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    html{-webkit-text-size-adjust:100%;color-scheme:dark;}

    body{
        font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        background:var(--bg);
        background-image:radial-gradient(900px 480px at 50% -10%,#1a2331 0%,transparent 70%);
        background-repeat:no-repeat;
        color:var(--text);
        font-size:var(--fs);
        line-height:1.5;
        padding:20px 16px 44px;
        max-width:1180px;
        margin:0 auto;
        min-height:100vh;
    }

    button,input{font:inherit;}
    button{cursor:pointer;}

    /* ---------- 头部 ---------- */
    .app-header{text-align:center;padding:6px 0 20px;}

    .app-header h1{
        font-size:1.55em;
        font-weight:700;
        letter-spacing:.02em;
        background:linear-gradient(135deg,#7cbcff,#4a9cff 45%,#9b8cff);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        margin-bottom:5px;
    }

    .app-header p{color:var(--text-dim);font-size:.8em;}

    /* ---------- 工具栏：单行、不换行 ---------- */
    .toolbar{
        display:flex;
        flex-wrap:nowrap;
        gap:8px;
        align-items:center;
        justify-content:center;
        margin-bottom:12px;
    }

    .toolbar-group{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;}

    /* ---------- 按钮 ---------- */
    .btn{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:5px;
        padding:8px 13px;
        border:1px solid var(--border);
        border-radius:10px;
        background:var(--surface-2);
        color:var(--text);
        font-size:.85em;
        font-weight:500;
        line-height:1.2;
        white-space:nowrap;
        cursor:pointer;
        transition:background .18s,border-color .18s,color .18s,transform .1s;
        user-select:none;
        text-decoration:none;
    }

    .btn:hover:not(:disabled){background:var(--surface-3);border-color:#3a424f;}
    .btn:active:not(:disabled){transform:scale(.97);}
    .btn:disabled{opacity:.38;cursor:not-allowed;}

    .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
    .btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);}

    .btn-danger{background:transparent;border-color:rgba(255,85,104,.35);color:var(--danger);}
    .btn-danger:hover:not(:disabled){background:rgba(255,85,104,.12);border-color:var(--danger);}

    .btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff;}
    .btn-danger-solid:hover:not(:disabled){background:#e6475a;border-color:#e6475a;}

    .btn-ghost{background:transparent;border-color:var(--border);color:var(--text-dim);}
    .btn-ghost:hover:not(:disabled){background:var(--surface-3);color:var(--text);}

    .btn-sync{background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.4);color:#b9a5ff;}
    .btn-sync:hover:not(:disabled){background:rgba(139,92,246,.25);}

    .btn-sm{padding:5px 9px;font-size:.78em;border-radius:8px;}

    .file-label{cursor:pointer;}

    /* ---------- 紧凑图标按钮（添加、设置） ---------- */
    .btn-icon{
        position:relative;
        padding:7px 11px;
        gap:5px;
        font-size:.82em;
    }

    .btn-icon .ico{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        flex:none;
        width:15px;
        height:15px;
    }

    .btn-icon .ico svg{
        width:100%;
        height:100%;
        display:block;
        fill:none;
        stroke:currentColor;
        stroke-width:2.2;
        stroke-linecap:round;
        stroke-linejoin:round;
    }

    .btn-icon .txt{line-height:1;}

    .btn-icon .dot{
        position:absolute;
        top:4px;
        right:4px;
        width:5px;
        height:5px;
        border-radius:50%;
        background:var(--success);
        box-shadow:0 0 0 3px rgba(46,213,115,.15);
    }

    .btn-icon .dot[hidden]{display:none;}

    /* ---------- 添加面板 ---------- */
    .add-panel{
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:var(--radius);
        padding:14px;
        margin-bottom:12px;
    }

    .add-panel[hidden]{display:none;}

    .add-panel form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

    .add-panel input{
        flex:1 1 220px;
        min-width:0;
        padding:10px 12px;
        border:1px solid var(--border);
        border-radius:10px;
        background:var(--surface-2);
        color:var(--text);
        font-size:.9em;
        transition:border-color .2s,box-shadow .2s;
    }

    .add-panel input::placeholder{color:#5f6875;}

    .add-panel input:focus{
        outline:none;
        border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(74,156,255,.15);
    }

    .add-actions{display:flex;gap:7px;margin-left:auto;}

    /* ---------- 列表元信息 ---------- */
    .list-meta{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        min-height:1.4em;
        margin:0 2px 8px;
        font-size:.76em;
        color:var(--text-dim);
    }

    .limit-hint{
        display:inline-flex;
        align-items:center;
        gap:5px;
        color:var(--text-dim);
        white-space:nowrap;
    }

    .limit-hint b{color:var(--text);font-weight:600;}

    /* ---------- 列表 ---------- */
    .list-card{
        background:var(--surface);
        border:1px solid var(--border);
        border-radius:var(--radius);
        overflow:hidden;
    }

    .list-head,
    .repo-row{
        display:grid;
        grid-template-columns:minmax(0,1.7fr) minmax(0,.9fr) minmax(0,1.1fr) minmax(0,.9fr) 200px;
        gap:14px;
        align-items:center;
    }

    .list-head{
        padding:10px 16px;
        background:var(--surface-2);
        color:var(--text-dim);
        font-size:.74em;
        letter-spacing:.05em;
    }

    .list-head > div:last-child{text-align:right;}

    .repo-row{
        padding:11px 16px;
        border-top:1px solid var(--border);
        transition:background .15s;
    }

    .repo-row:hover{background:rgba(255,255,255,.025);}

    .cell{min-width:0;}

    .cell-name{display:flex;align-items:center;min-width:0;}

    .repo-main{display:flex;align-items:center;gap:6px;min-width:0;flex:1;}

    .repo-link{
        color:var(--text);
        font-weight:600;
        font-size:.94em;
        text-decoration:none;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        min-width:0;
    }

    .repo-link:hover{color:var(--accent);text-decoration:underline;}

    .copy-btn{
        flex:none;
        padding:2px 7px;
        font-size:.66em;
        border-radius:6px;
        background:transparent;
        border:1px solid var(--border);
        color:var(--text-dim);
    }

    .copy-btn:hover:not(:disabled){background:var(--surface-3);color:var(--text);}

    .local-ver{
        background:none;
        border:none;
        padding:0;
        color:var(--accent);
        font-size:.88em;
        font-family:inherit;
        line-height:1.4;
        cursor:pointer;
        border-bottom:1px dashed rgba(74,156,255,.5);
        white-space:nowrap;
    }

    .local-ver:hover:not(:disabled){color:var(--accent-hover);}
    .local-ver:disabled{color:var(--text-dim);border-color:transparent;cursor:not-allowed;}

    .latest-main{display:flex;flex-direction:column;gap:1px;min-width:0;}

    .version-tag{
        font-weight:600;
        font-size:.88em;
        color:var(--text);
        font-variant-numeric:tabular-nums;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }

    .date{font-size:.68em;color:var(--text-dim);}

    .status-badge{
        display:inline-flex;
        align-items:center;
        padding:2px 9px;
        border-radius:999px;
        font-size:.74em;
        font-weight:600;
        white-space:nowrap;
        border:1px solid transparent;
    }

    .status-badge.pending{color:var(--text-dim);background:rgba(255,255,255,.05);border-color:var(--border);}
    .status-badge.new{color:#ff8a95;background:rgba(255,85,104,.12);border-color:rgba(255,85,104,.3);}
    .status-badge.latest{color:var(--success);background:rgba(46,213,115,.1);border-color:rgba(46,213,115,.3);}
    .status-badge.error{color:var(--warning);background:rgba(245,184,61,.1);border-color:rgba(245,184,61,.3);}
    .status-badge.checking{color:var(--accent);background:rgba(74,156,255,.1);border-color:rgba(74,156,255,.3);}

    .status-badge.checking::before{
        content:'';
        display:inline-block;
        width:7px;height:7px;
        border-radius:50%;
        border:2px solid currentColor;
        border-top-color:transparent;
        margin-right:5px;
        animation:spin .8s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg);}}

    .cell-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:nowrap;}

    /* ---------- 空状态 ---------- */
    .empty{padding:56px 24px;text-align:center;color:var(--text-dim);}
    .empty-emoji{font-size:2.2em;line-height:1;margin-bottom:12px;opacity:.65;}
    .empty p{font-size:.88em;}

    /* ---------- 模态框 ---------- */
    .modal{
        position:fixed;
        inset:0;
        z-index:100;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:16px;
        background:rgba(5,7,11,.75);
        backdrop-filter:blur(3px);
        -webkit-backdrop-filter:blur(3px);
        opacity:0;
        visibility:hidden;
        transition:opacity .2s ease,visibility .2s;
    }

    .modal.active{opacity:1;visibility:visible;}

    .modal-content{
        width:100%;
        max-width:520px;
        max-height:88vh;
        overflow-y:auto;
        padding:20px;
        background:var(--surface-2);
        border:1px solid var(--border);
        border-radius:18px;
        box-shadow:0 24px 60px rgba(0,0,0,.55);
        transform:translateY(14px) scale(.985);
        transition:transform .22s ease;
    }

    .modal.active .modal-content{transform:none;}

    .modal-content.wide{max-width:580px;}
    .modal-content.modal-sm{max-width:400px;}

    .modal-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        margin-bottom:14px;
    }

    .modal-head h2{font-size:1.05em;font-weight:600;}

    .icon-btn{
        flex:none;
        width:30px;height:30px;
        display:flex;align-items:center;justify-content:center;
        border:none;border-radius:8px;
        background:transparent;
        color:var(--text-dim);
        font-size:1.25em;
        line-height:1;
        cursor:pointer;
        transition:.18s;
    }

    .icon-btn:hover{background:var(--surface-3);color:var(--text);}

    .modal-text{color:var(--text-dim);font-size:.88em;line-height:1.7;overflow-wrap:anywhere;}

    .modal-sub{
        color:var(--text-dim);
        font-size:.78em;
        margin-bottom:6px;
        overflow-wrap:anywhere;
    }

    .modal-foot{
        display:flex;
        justify-content:flex-end;
        align-items:center;
        gap:9px;
        margin-top:18px;
    }

    .modal-foot .grow{margin-right:auto;}

    /* ---------- 表单 ---------- */
    .field{margin-bottom:13px;}

    .field > label{
        display:block;
        margin-bottom:5px;
        font-size:.8em;
        color:var(--text-dim);
    }

    .field input{
        width:100%;
        padding:10px 12px;
        border:1px solid var(--border);
        border-radius:10px;
        background:var(--surface);
        color:var(--text);
        font-size:.93em;
        transition:border-color .2s,box-shadow .2s;
    }

    .field input::placeholder{color:#5f6875;}

    .field input:focus{
        outline:none;
        border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(74,156,255,.15);
    }

    .opt{color:#6f7885;font-weight:400;font-size:.9em;}

    .hint{
        margin-top:8px;
        font-size:.74em;
        line-height:1.65;
        color:var(--text-dim);
        padding:9px 11px;
        background:rgba(74,156,255,.06);
        border:1px solid rgba(74,156,255,.18);
        border-radius:9px;
    }

    .hint b{color:var(--text);font-weight:600;}

    .token-wrap{position:relative;}

    .token-wrap input{padding-right:44px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84em;}

    .token-toggle{
        position:absolute;
        right:4px;
        top:50%;
        transform:translateY(-50%);
        width:32px;
        height:32px;
        font-size:.95em;
    }

    /* ---------- 数据管理（设置面板内） ---------- */
    .data-actions{display:flex;gap:8px;margin-top:2px;}

    .data-actions .btn{flex:1;padding:9px 10px;font-size:.85em;}

    /* ---------- 文件列表 ---------- */
    .select-all{
        display:flex;
        align-items:center;
        gap:8px;
        padding:7px 0;
        font-size:.82em;
        color:var(--text-dim);
        cursor:pointer;
        user-select:none;
    }

    .select-all input{width:15px;height:15px;accent-color:var(--accent);flex:none;}

    .file-list{
        max-height:44vh;
        overflow-y:auto;
        margin:6px 0 4px;
        border-top:1px solid var(--border);
        border-bottom:1px solid var(--border);
    }

    .file-item{
        display:flex;
        align-items:center;
        gap:9px;
        padding:9px 2px;
        border-bottom:1px solid var(--border);
    }

    .file-item:last-child{border-bottom:none;}

    .file-check-label{
        display:flex;
        align-items:center;
        gap:9px;
        flex:1;
        min-width:0;
        cursor:pointer;
    }

    .file-check{width:15px;height:15px;accent-color:var(--accent);flex:none;}

    .file-name{
        flex:1;
        min-width:0;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
        font-size:.84em;
        color:var(--text);
        direction:rtl;
        text-align:left;
    }

    .file-name bdi{direction:ltr;}

    /* ---------- Toast ---------- */
    .toast-wrap{
        position:fixed;
        left:50%;
        bottom:28px;
        transform:translateX(-50%);
        z-index:300;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:8px;
        pointer-events:none;
        width:max-content;
        max-width:calc(100vw - 32px);
    }

    .toast{
        padding:10px 18px;
        border-radius:999px;
        background:var(--surface-3);
        border:1px solid var(--border);
        color:var(--text);
        font-size:.83em;
        box-shadow:0 10px 30px rgba(0,0,0,.45);
        animation:toastIn .25s ease;
        transition:opacity .25s,transform .25s;
        max-width:100%;
        text-align:center;
    }

    .toast.success{border-color:rgba(46,213,115,.5);}
    .toast.error{border-color:rgba(255,85,104,.5);}

    @keyframes toastIn{
        from{opacity:0;transform:translateY(10px);}
        to{opacity:1;transform:none;}
    }

    /* ---------- 滚动条 ---------- */
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-thumb{background:#333a46;border-radius:99px;}
    ::-webkit-scrollbar-track{background:transparent;}

    /* ---------- 响应式 ---------- */
    @media (max-width:900px){
        .list-head,
        .repo-row{
            grid-template-columns:minmax(0,1.6fr) minmax(0,.85fr) minmax(0,1fr) minmax(0,.85fr) 180px;
            gap:12px;
        }
    }

    @media (max-width:860px){
        .list-head{display:none;}

        .repo-row{
            display:grid;
            grid-template-columns:minmax(0,1fr) auto;
            grid-template-areas:
                "name status"
                "local latest"
                "actions actions";
            gap:8px 10px;
            align-items:center;
            padding:12px 14px;
        }

        .cell-name{grid-area:name;min-width:0;}

        .cell-status{
            grid-area:status;
            justify-self:end;
            align-self:center;
        }

        .cell-local{
            grid-area:local;
            display:flex;
            align-items:center;
            gap:6px;
            min-width:0;
        }

        .cell-latest{
            grid-area:latest;
            display:flex;
            align-items:center;
            gap:6px;
            min-width:0;
            justify-self:end;
        }

        .cell-actions{
            grid-area:actions;
            display:flex;
            gap:6px;
            justify-content:stretch;
            padding-top:7px;
            margin-top:1px;
            border-top:1px dashed var(--border);
        }

        .cell-actions .btn{
            flex:1;
            padding:8px 6px;
            font-size:.8em;
            border-radius:9px;
        }

        .cell .mobile-label{
            display:inline-block;
            flex:none;
            font-size:.7em;
            color:var(--text-dim);
            letter-spacing:.02em;
            white-space:nowrap;
        }

        .cell-name .mobile-label{display:none;}

        .repo-link{font-size:.97em;}

        .local-ver{font-size:.86em;}

        .latest-main{
            flex-direction:row;
            align-items:baseline;
            gap:6px;
            flex-wrap:nowrap;
            min-width:0;
        }

        .version-tag{font-size:.86em;}

        .date{
            font-size:.66em;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

        .list-meta{margin-bottom:10px;}
    }

    @media (max-width:600px){
        body{padding:14px 12px 32px;}

        .app-header{padding-bottom:16px;}
        .app-header h1{font-size:1.3em;}
        .app-header p{font-size:.76em;}

        /* 工具栏保持单行并居中 */
        .toolbar{justify-content:center;gap:8px;}
        .toolbar-group{width:auto;justify-content:center;gap:8px;}

        /* 添加、设置保持图标按钮，44×40 */
        .btn-icon{
            width:44px;
            height:40px;
            padding:0;
            gap:0;
            border-radius:11px;
        }
        .btn-icon .ico{width:17px;height:17px;}
        .btn-icon .txt{display:none;}
        .btn-icon .dot{top:6px;right:6px;}

        /* 检测文字按钮，高度与图标按钮对齐 */
        #check-all{
            padding:9px 14px;
            font-size:.84em;
            min-height:40px;
            border-radius:11px;
        }

        .add-panel{padding:13px;}
        .add-panel input{flex-basis:100%;}
        .add-actions{width:100%;margin-left:0;}
        .add-actions .btn{flex:1;}

        .modal{align-items:flex-end;padding:0;}

        .modal-content{
            max-width:100%;
            max-height:92vh;
            border-radius:20px 20px 0 0;
            border-bottom:none;
            padding:18px 16px calc(18px + env(safe-area-inset-bottom));
        }

        .modal-foot{flex-wrap:wrap;}
        .modal-foot .btn{flex:1;}

        .file-list{max-height:40vh;}

        .list-meta{flex-wrap:wrap;gap:5px;}

        .cell-actions .btn{padding:8px 4px;}
    }

    @media (max-width:380px){
        .repo-row{
            grid-template-columns:minmax(0,1fr) auto;
            gap:7px 8px;
            padding:11px 12px;
        }

        .cell .mobile-label{font-size:.66em;}

        .date{display:none;}

        .cell-actions .btn{font-size:.76em;}

        .btn-icon{width:40px;height:38px;}

        #check-all{padding:8px 12px;font-size:.8em;min-height:38px;}

        .data-actions{flex-direction:column;}
    }

    @media (prefers-reduced-motion:reduce){
        *{transition:none !important;animation:none !important;}
    }

    /* 移动端标签，默认隐藏，由媒体查询控制显示 */
    .mobile-label{display:none;}

    body.modal-open{overflow:hidden;}
</style>
</head>
<body>

<header class="app-header">
    <h1>GitHub 版本检测 &amp; 下载</h1>
    <p>追踪仓库 Release 版本 · 一键对比与下载</p>
</header>

<!-- 工具栏：仅保留 添加 / 检测 / 设置，单行 -->
<div class="toolbar">
    <div class="toolbar-group">
        <button type="button" class="btn btn-primary btn-icon" id="toggle-add" title="添加项目" aria-label="添加项目">
            <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
            <span class="txt">添加</span>
        </button>

        <button type="button" class="btn" id="check-all">检测版本</button>

        <button type="button" class="btn btn-icon" id="open-settings" title="设置与数据管理" aria-label="设置">
            <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
(function () {
    'use strict';

    /* ==================== 常量 ==================== */

    var STORAGE_KEY = 'github_version_list';
    var TOKEN_KEY = 'github_api_token';

    var STATUS_META = {
        '待检测':   { cls: 'pending',  label: '待检测' },
        '检测中':   { cls: 'checking', label: '检测中…' },
        '有新版本': { cls: 'new',      label: '有新版本' },
        '已是最新': { cls: 'latest',   label: '已是最新' },
        '检测失败': { cls: 'error',    label: '检测失败' }
    };

    /* ==================== 状态 ==================== */

    var repoList = [];
    var apiToken = '';
    var currentEditIndex = -1;
    var currentDownloadIndex = -1;
    var isChecking = false;
    var confirmResolver = null;
    var el = {};

    /* ==================== 工具函数 ==================== */

    function escapeHtml(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function normalizeUrl(input) {
        var s = String(input == null ? '' : input).trim();
        if (!s) return '';
        if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
        return s;
    }

    function parseRepo(input) {
        if (!input || typeof input !== 'string') return null;

        var str = input.trim();
        if (!str) return null;
        if (!/^https?:\/\//i.test(str)) str = 'https://' + str;

        try {
            var u = new URL(str);
            if (!/(^|\.)github\.com$/i.test(u.hostname)) return null;

            var parts = u.pathname.split('/').filter(Boolean);
            if (parts.length < 2) return null;

            var owner = decodeURIComponent(parts[0]);
            var repo = decodeURIComponent(parts[1]).replace(/\.git$/i, '');

            if (!owner || !repo) return null;
            return { owner: owner, repo: repo };
        } catch (e) {
            return null;
        }
    }

    function repoKey(url) {
        var p = parseRepo(url);
        return p ? (p.owner.toLowerCase() + '/' + p.repo.toLowerCase()) : '';
    }

    function repoFullName(url) {
        var p = parseRepo(url);
        return p ? (p.owner + '/' + p.repo) : '未知项目';
    }

    function releasesHref(url) {
        var p = parseRepo(url);
        if (!p) return '';
        return 'https://github.com/' + encodeURIComponent(p.owner) + '/' +
               encodeURIComponent(p.repo) + '/releases';
    }

    function formatDate(iso) {
        return (typeof iso === 'string' && iso.length >= 10) ? iso.slice(0, 10) : '';
    }

    function sleep(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    function toast(message, type) {
        var node = document.createElement('div');
        node.className = 'toast' + (type ? ' ' + type : '');
        node.textContent = message;
        el.toastWrap.appendChild(node);

        setTimeout(function () {
            node.style.opacity = '0';
            node.style.transform = 'translateY(8px)';
            setTimeout(function () { node.remove(); }, 260);
        }, 2600);
    }

    function copyText(text) {
        return new Promise(function (resolve) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(function () {
                    resolve(true);
                }).catch(function () {
                    resolve(fallbackCopy(text));
                });
            } else {
                resolve(fallbackCopy(text));
            }
        });
    }

    function fallbackCopy(text) {
        try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = document.execCommand('copy');
            ta.remove();
            return ok;
        } catch (e) {
            return false;
        }
    }

    /* ==================== Token 管理 ==================== */

    function loadToken() {
        try {
            apiToken = localStorage.getItem(TOKEN_KEY) || '';
        } catch (e) {
            apiToken = '';
        }
        updateTokenIndicators();
    }

    function saveToken(token) {
        apiToken = token;
        try {
            if (token) {
                localStorage.setItem(TOKEN_KEY, token);
            } else {
                localStorage.removeItem(TOKEN_KEY);
            }
        } catch (e) {
            toast('Token 保存失败', 'error');
        }
        updateTokenIndicators();
    }

    function updateTokenIndicators() {
        if (el.tokenDot) {
            el.tokenDot.hidden = !apiToken;
        }
        if (el.limitHint) {
            el.limitHint.innerHTML = apiToken
                ? 'API 限额：<b>5000</b> 次/时（已认证）'
                : 'API 限额：<b>60</b> 次/时（未配置 Token）';
        }
    }

    function openSettings() {
        if (isChecking) return;

        el.tokenInput.value = apiToken;
        el.tokenInput.type = 'password';
        el.tokenToggle.textContent = '👁';
        el.settingsModal.classList.add('active');
        updateBodyLock();

        setTimeout(function () { el.tokenInput.focus(); }, 60);
    }

    function handleTokenSave() {
        var token = el.tokenInput.value.trim();

        if (token && !/^[\x21-\x7e]+$/.test(token)) {
            toast('Token 含有非法字符，请检查', 'error');
            el.tokenInput.focus();
            return;
        }

        var before = apiToken;
        saveToken(token);
        closeModal(el.settingsModal);

        if (!token && before) {
            toast('已清除 Token', 'success');
        } else if (token && before !== token) {
            toast('Token 已保存，检测限额提升', 'success');
        } else if (token) {
            toast('Token 未变化');
        } else {
            toast('已关闭设置');
        }
    }

    function handleTokenClear() {
        if (!apiToken) {
            toast('当前未配置 Token');
            return;
        }

        confirmDialog({
            title: '清除 Token',
            message: '清除后将恢复为未认证状态（每小时 60 次 API 请求），确定继续吗？',
            okText: '清除'
        }).then(function (ok) {
            if (!ok) return;
            el.tokenInput.value = '';
            saveToken('');
            closeModal(el.settingsModal);
            toast('已清除 Token', 'success');
        });
    }

    function toggleTokenVisibility() {
        var isPassword = el.tokenInput.type === 'password';
        el.tokenInput.type = isPassword ? 'text' : 'password';
        el.tokenToggle.textContent = isPassword ? '🙈' : '👁';
    }

    /* ==================== 数据层 ==================== */

    function normalizeRecord(raw) {
        var assets = Array.isArray(raw.assets)
            ? raw.assets
                .filter(function (a) {
                    return a && typeof a.name === 'string' && typeof a.url === 'string';
                })
                .map(function (a) { return { name: a.name, url: a.url }; })
            : [];

        var status = '待检测';
        if (raw.status === '有新版本') {
            status = '有新版本';
        } else if (raw.status === '已是最新') {
            status = '已是最新';
        } else if (typeof raw.status === 'string' && raw.status.indexOf('失败') !== -1) {
            status = '检测失败';
        }

        return {
            url: normalizeUrl(raw.url),
            localVersion: typeof raw.localVersion === 'string' ? raw.localVersion.trim() : '',
            latestVersion: typeof raw.latestVersion === 'string' ? raw.latestVersion : '',
            publishTime: typeof raw.publishTime === 'string' ? raw.publishTime : '',
            status: status,
            error: typeof raw.error === 'string' ? raw.error : '',
            assets: assets
        };
    }

    function loadData() {
        try {
            var raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (!Array.isArray(raw)) return [];

            return raw
                .filter(function (item) {
                    return item && typeof item === 'object' &&
                           typeof item.url === 'string' && parseRepo(item.url);
                })
                .map(normalizeRecord);
        } catch (e) {
            return [];
        }
    }

    function saveData() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(repoList));
        } catch (e) {
            toast('保存失败，本地存储可能已满', 'error');
        }
    }

    function refreshStatus(item) {
        if (!item.latestVersion) {
            item.status = '待检测';
            return;
        }
        item.status = (item.localVersion && item.localVersion === item.latestVersion)
            ? '已是最新'
            : '有新版本';
    }

    /* ==================== 渲染 ==================== */

    function rowHtml(item, index) {
        var p = parseRepo(item.url);
        var fullName = p ? (p.owner + '/' + p.repo) : '未知项目';
        var href = releasesHref(item.url) || '#';

        var meta = STATUS_META[item.status] || STATUS_META['待检测'];
        var localText = item.localVersion ? escapeHtml(item.localVersion) : '未填写';
        var latestText = item.latestVersion ? escapeHtml(item.latestVersion) : '—';
        var dateHtml = item.publishTime
            ? '<span class="date">' + escapeHtml(item.publishTime) + '</span>'
            : '';

        var disabledAttr = isChecking ? ' disabled' : '';
        var syncDisabled = (isChecking || !item.latestVersion) ? ' disabled' : '';
        var errorTitle = item.error
            ? ' title="' + escapeHtml(item.error) + '"'
            : '';

        var downloadLabel = item.assets.length
            ? '下载 (' + item.assets.length + ')'
            : '下载';

        return '' +
            '<div class="repo-row" data-index="' + index + '">' +
                '<div class="cell cell-name">' +
                    '<div class="repo-main">' +
                        '<a class="repo-link" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer" title="打开 Releases 页面">' +
                            escapeHtml(fullName) +
                        '</a>' +
                        '<button type="button" class="btn copy-btn" data-action="copy" data-index="' + index + '" title="复制仓库链接">复制</button>' +
                    '</div>' +
                '</div>' +
                '<div class="cell cell-local">' +
                    '<span class="mobile-label">本地</span>' +
                    '<button type="button" class="local-ver" data-action="edit" data-index="' + index + '" title="点击编辑本地版本"' + disabledAttr + '>' +
                        localText +
                    '</button>' +
                '</div>' +
                '<div class="cell cell-latest">' +
                    '<span class="mobile-label">最新</span>' +
                    '<div class="latest-main">' +
                        '<span class="version-tag">' + latestText + '</span>' +
                        dateHtml +
                    '</div>' +
                '</div>' +
                '<div class="cell cell-status">' +
                    '<span class="status-badge ' + meta.cls + '"' + errorTitle + '>' + meta.label + '</span>' +
                '</div>' +
                '<div class="cell cell-actions">' +
                    '<button type="button" class="btn btn-sm btn-primary" data-action="download" data-index="' + index + '"' + disabledAttr + '>' +
                        downloadLabel +
                    '</button>' +
                    '<button type="button" class="btn btn-sm btn-sync" data-action="sync" data-index="' + index + '"' + syncDisabled + ' title="将最新版本设为本地版本">同步</button>' +
                    '<button type="button" class="btn btn-sm btn-danger" data-action="delete" data-index="' + index + '"' + disabledAttr + '>删除</button>' +
                '</div>' +
            '</div>';
    }

    function render() {
        if (!repoList.length) {
            el.repoList.innerHTML =
                '<div class="empty">' +
                    '<div class="empty-emoji">📦</div>' +
                    '<p>还没有项目，点击「添加项目」开始追踪</p>' +
                '</div>';
            el.stats.textContent = '';
            return;
        }

        el.repoList.innerHTML = repoList.map(function (item, index) {
            return rowHtml(item, index);
        }).join('');

        el.stats.textContent = '共 ' + repoList.length + ' 个项目';
    }

    /* ==================== 模态框 ==================== */

    function updateBodyLock() {
        document.body.classList.toggle('modal-open', !!document.querySelector('.modal.active'));
    }

    function closeModal(modal) {
        if (!modal) return;
        modal.classList.remove('active');

        if (modal === el.editModal) currentEditIndex = -1;
        if (modal === el.downloadModal) {
            currentDownloadIndex = -1;
            el.fileList.innerHTML = '';
            el.selectAll.checked = false;
        }
        if (modal === el.settingsModal) {
            el.tokenInput.value = '';
            el.tokenInput.type = 'password';
            el.tokenToggle.textContent = '👁';
        }

        updateBodyLock();
    }

    function confirmDialog(options) {
        el.confirmTitle.textContent = options.title || '确认';
        el.confirmMsg.textContent = options.message || '';
        el.confirmOk.textContent = options.okText || '确定';
        el.confirmModal.classList.add('active');
        updateBodyLock();

        return new Promise(function (resolve) {
            confirmResolver = resolve;
        });
    }

    function settleConfirm(value) {
        var resolver = confirmResolver;
        confirmResolver = null;
        el.confirmModal.classList.remove('active');
        updateBodyLock();
        if (resolver) resolver(value);
    }

    /* ==================== 添加 / 编辑 ==================== */

    function toggleAddPanel(force) {
        var show = typeof force === 'boolean' ? force : el.addPanel.hidden;
        el.addPanel.hidden = !show;

        if (show) {
            el.addUrl.focus();
        } else {
            el.addForm.reset();
        }
    }

    function closeAddPanel() {
        el.addPanel.hidden = true;
        el.addForm.reset();
    }

    function handleAddSubmit(e) {
        e.preventDefault();

        var url = normalizeUrl(el.addUrl.value);
        if (!parseRepo(url)) {
            toast('请输入有效的 GitHub 仓库链接', 'error');
            el.addUrl.focus();
            return;
        }

        var key = repoKey(url);
        var exists = repoList.some(function (item) {
            return repoKey(item.url) === key;
        });

        if (exists) {
            toast('该项目已在列表中', 'error');
            return;
        }

        repoList.push({
            url: url,
            localVersion: el.addVer.value.trim(),
            latestVersion: '',
            publishTime: '',
            status: '待检测',
            error: '',
            assets: []
        });

        saveData();
        render();
        closeAddPanel();
        toast('已添加项目', 'success');
    }

    function openEdit(index) {
        if (isChecking) return;
        var item = repoList[index];
        if (!item) return;

        currentEditIndex = index;
        el.editUrl.value = item.url;
        el.editVer.value = item.localVersion;
        el.editModal.classList.add('active');
        updateBodyLock();

        setTimeout(function () { el.editUrl.focus(); }, 60);
    }

    function handleEditSubmit(e) {
        e.preventDefault();

        if (currentEditIndex < 0 || currentEditIndex >= repoList.length) {
            closeModal(el.editModal);
            return;
        }

        var newUrl = normalizeUrl(el.editUrl.value);
        if (!parseRepo(newUrl)) {
            toast('请输入有效的 GitHub 仓库链接', 'error');
            el.editUrl.focus();
            return;
        }

        var newKey = repoKey(newUrl);
        var duplicate = repoList.some(function (item, idx) {
            return idx !== currentEditIndex && repoKey(item.url) === newKey;
        });

        if (duplicate) {
            toast('该链接已存在于其他项目中', 'error');
            return;
        }

        var item = repoList[currentEditIndex];
        var keyChanged = repoKey(item.url) !== newKey;

        item.url = newUrl;
        item.localVersion = el.editVer.value.trim();

        if (keyChanged) {
            item.latestVersion = '';
            item.publishTime = '';
            item.assets = [];
            item.error = '';
            item.status = '待检测';
        } else {
            refreshStatus(item);
        }

        saveData();
        render();
        closeModal(el.editModal);
        toast('已保存', 'success');
    }

    /* ==================== 列表操作 ==================== */

    function handleListClick(e) {
        if (isChecking) return;

        var btn = e.target.closest('button[data-action]');
        if (!btn) return;

        var index = parseInt(btn.dataset.index, 10);
        if (!isFinite(index) || index < 0 || index >= repoList.length) return;

        switch (btn.dataset.action) {
            case 'copy':
                copyRepoUrl(index);
                break;
            case 'edit':
                openEdit(index);
                break;
            case 'download':
                openDownload(index);
                break;
            case 'sync':
                syncVersion(index);
                break;
            case 'delete':
                deleteItem(index);
                break;
        }
    }

    function copyRepoUrl(index) {
        var item = repoList[index];
        if (!item) return;

        copyText(item.url).then(function (ok) {
            toast(ok ? '仓库链接已复制' : '复制失败，请手动复制', ok ? 'success' : 'error');
        });
    }

    function syncVersion(index) {
        if (isChecking) return;

        var item = repoList[index];
        if (!item) return;

        if (!item.latestVersion) {
            toast('请先检测版本', 'error');
            return;
        }

        if (item.localVersion === item.latestVersion) {
            toast('当前已是最新版本');
            return;
        }

        item.localVersion = item.latestVersion;
        refreshStatus(item);
        saveData();
        render();
        toast('已同步为最新版本', 'success');
    }

    function deleteItem(index) {
        if (isChecking) return;

        var item = repoList[index];
        if (!item) return;

        confirmDialog({
            title: '删除项目',
            message: '确定删除「' + repoFullName(item.url) + '」吗？该操作无法撤销。',
            okText: '删除'
        }).then(function (ok) {
            if (!ok) return;

            repoList.splice(index, 1);
            saveData();
            render();
            toast('已删除', 'success');
        });
    }

    /* ==================== 版本检测 ==================== */

    function buildHeaders() {
        var headers = { 'Accept': 'application/vnd.github+json' };
        if (apiToken) {
            headers['Authorization'] = 'Bearer ' + apiToken;
        }
        return headers;
    }

    async function checkAll() {
        if (isChecking) return;

        if (!repoList.length) {
            toast('暂无需要检测的项目', 'error');
            return;
        }

        closeAddPanel();

        isChecking = true;
        el.checkAllBtn.disabled = true;

        var items = repoList.slice();
        var total = items.length;
        var done = 0;
        var failed = 0;
        var rateLimited = false;

        el.checkAllBtn.textContent = '检测中 0/' + total;
        render();

        try {
            for (var i = 0; i < total; i++) {
                var item = items[i];

                item.status = '检测中';
                item.error = '';
                render();

                try {
                    var p = parseRepo(item.url);
                    if (!p) throw new Error('链接解析失败');

                    var apiUrl = 'https://api.github.com/repos/' +
                        encodeURIComponent(p.owner) + '/' +
                        encodeURIComponent(p.repo) + '/releases/latest';

                    var res = await fetch(apiUrl, { headers: buildHeaders() });

                    if (!res.ok) {
                        if (res.status === 401) {
                            throw new Error('Token 无效或已过期，请在设置中检查');
                        }
                        if (res.status === 404) {
                            throw new Error('未找到 Release');
                        }
                        if (res.status === 403 || res.status === 429) {
                            rateLimited = true;
                            throw new Error(apiToken
                                ? 'API 限流，请稍后再试'
                                : 'API 限流（未配置 Token，每小时仅 60 次）');
                        }
                        throw new Error('请求失败（HTTP ' + res.status + '）');
                    }

                    var data = await res.json();

                    item.latestVersion = data.tag_name || '';
                    item.publishTime = formatDate(data.published_at);
                    item.assets = Array.isArray(data.assets)
                        ? data.assets.map(function (a) {
                            return {
                                name: a && a.name ? a.name : '',
                                url: a && a.browser_download_url ? a.browser_download_url : ''
                            };
                        }).filter(function (a) { return a.name && a.url; })
                        : [];
                    item.error = '';
                    refreshStatus(item);
                } catch (err) {
                    item.status = '检测失败';
                    item.error = (err && err.message) ? err.message : '未知错误';
                    failed++;
                }

                done++;
                saveData();
                render();

                el.checkAllBtn.textContent = '检测中 ' + done + '/' + total;

                if (i < total - 1) {
                    await sleep(800);
                }
            }

            if (rateLimited && !apiToken) {
                toast('部分项目因 API 限流失败，可在「设置」中配置 Token 提升限额', 'error');
            } else if (failed) {
                toast('检测完成，' + failed + ' 个失败', 'error');
            } else {
                toast('版本检测完成', 'success');
            }
        } finally {
            isChecking = false;
            el.checkAllBtn.disabled = false;
            el.checkAllBtn.textContent = '检测版本';
            render();
        }
    }

    /* ==================== 下载 ==================== */

    function openDownload(index) {
        if (isChecking) return;

        var item = repoList[index];
        if (!item) return;

        if (!item.assets || !item.assets.length) {
            toast('暂无可下载文件，请先检测版本', 'error');
            return;
        }

        currentDownloadIndex = index;
        el.downloadSub.textContent = repoFullName(item.url) +
            (item.latestVersion ? ' · ' + item.latestVersion : '');

        el.fileList.innerHTML = item.assets.map(function (file, idx) {
            return '' +
                '<div class="file-item">' +
                    '<label class="file-check-label">' +
                        '<input type="checkbox" class="file-check" value="' + idx + '">' +
                        '<span class="file-name" title="' + escapeHtml(file.name) + '">' +
                            '<bdi>' + escapeHtml(file.name) + '</bdi>' +
                        '</span>' +
                    '</label>' +
                    '<button type="button" class="btn btn-sm btn-ghost copy-file" data-idx="' + idx + '">复制</button>' +
                '</div>';
        }).join('');

        el.selectAll.checked = false;
        el.downloadModal.classList.add('active');
        updateBodyLock();
    }

    function copyAssetLink(idx) {
        var item = repoList[currentDownloadIndex];
        if (!item) return;

        var file = item.assets[idx];
        if (!file) return;

        copyText(file.url).then(function (ok) {
            toast(ok ? '下载链接已复制' : '复制失败，请手动复制', ok ? 'success' : 'error');
        });
    }

    function batchDownload() {
        var item = repoList[currentDownloadIndex];
        if (!item || !item.assets.length) {
            toast('没有可下载的文件', 'error');
            return;
        }

        var checked = el.fileList.querySelectorAll('.file-check:checked');
        if (!checked.length) {
            toast('请至少选择一个文件', 'error');
            return;
        }

        var files = Array.prototype.map.call(checked, function (cb) {
            return item.assets[parseInt(cb.value, 10)];
        }).filter(Boolean);

        files.forEach(function (file) {
            var a = document.createElement('a');
            a.href = file.url;
            a.download = file.name || '';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            a.remove();
        });

        toast('已开始下载 ' + files.length + ' 个文件');
    }

    /* ==================== 导入 / 导出 ==================== */

    function exportData() {
        if (!repoList.length) {
            toast('暂无数据可导出', 'error');
            return;
        }

        var data = repoList.map(function (item) {
            return {
                url: item.url,
                localVersion: item.localVersion || ''
            };
        });

        var blob = new Blob([JSON.stringify(data, null, 2)], {
            type: 'application/json;charset=utf-8'
        });

        var d = new Date();
        var pad = function (n) { return String(n).padStart(2, '0'); };
        var filename = 'github_repos_' +
            d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' +
            pad(d.getHours()) + pad(d.getMinutes()) + '.json';

        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);

        toast('已导出 ' + data.length + ' 个项目', 'success');
    }

    function handleImportFile(e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;

        var reader = new FileReader();

        reader.onload = function (ev) {
            var data;
            try {
                data = JSON.parse(ev.target.result);
            } catch (err) {
                toast('文件格式错误，无法解析 JSON', 'error');
                return;
            }

            if (!Array.isArray(data)) {
                toast('文件内容不是有效的项目数组', 'error');
                return;
            }

            var added = 0;
            var skipped = 0;
            var invalid = 0;

            data.forEach(function (raw) {
                if (!raw || typeof raw.url !== 'string') {
                    invalid++;
                    return;
                }

                var url = normalizeUrl(raw.url);
                if (!parseRepo(url)) {
                    invalid++;
                    return;
                }

                var key = repoKey(url);
                var exists = repoList.some(function (item) {
                    return repoKey(item.url) === key;
                });

                if (exists) {
                    skipped++;
                    return;
                }

                repoList.push({
                    url: url,
                    localVersion: typeof raw.localVersion === 'string'
                        ? raw.localVersion.trim()
                        : '',
                    latestVersion: '',
                    publishTime: '',
                    status: '待检测',
                    error: '',
                    assets: []
                });

                added++;
            });

            saveData();
            render();

            var msg = '导入完成，新增 ' + added + ' 个';
            if (skipped) msg += '，跳过重复 ' + skipped + ' 个';
            if (invalid) msg += '，忽略无效 ' + invalid + ' 个';

            toast(msg, added ? 'success' : 'error');
        };

        reader.onerror = function () {
            toast('读取文件失败', 'error');
        };

        reader.readAsText(file, 'UTF-8');
    }

    /* ==================== 事件绑定 ==================== */

    function handleKeydown(e) {
        if (e.key !== 'Escape') return;

        if (el.confirmModal.classList.contains('active')) {
            settleConfirm(false);
            return;
        }

        var active = document.querySelector('.modal.active');
        if (active) {
            closeModal(active);
            return;
        }

        if (!el.addPanel.hidden) {
            closeAddPanel();
        }
    }

    function bindEvents() {
        el.toggleAddBtn.addEventListener('click', function () {
            toggleAddPanel();
        });

        el.addCancel.addEventListener('click', closeAddPanel);
        el.addForm.addEventListener('submit', handleAddSubmit);

        el.checkAllBtn.addEventListener('click', checkAll);
        el.exportBtn.addEventListener('click', exportData);
        el.importFile.addEventListener('change', handleImportFile);

        el.repoList.addEventListener('click', handleListClick);

        el.editForm.addEventListener('submit', handleEditSubmit);

        // 设置
        el.openSettingsBtn.addEventListener('click', openSettings);
        el.tokenSave.addEventListener('click', handleTokenSave);
        el.tokenClear.addEventListener('click', handleTokenClear);
        el.tokenToggle.addEventListener('click', toggleTokenVisibility);
        el.tokenInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleTokenSave();
            }
        });

        document.querySelectorAll('[data-close]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var modal = btn.closest('.modal');
                if (modal) closeModal(modal);
            });
        });

        el.settingsModal.addEventListener('click', function (e) {
            if (e.target === el.settingsModal) closeModal(el.settingsModal);
        });

        el.editModal.addEventListener('click', function (e) {
            if (e.target === el.editModal) closeModal(el.editModal);
        });

        el.downloadModal.addEventListener('click', function (e) {
            if (e.target === el.downloadModal) closeModal(el.downloadModal);
        });

        el.confirmOk.addEventListener('click', function () { settleConfirm(true); });
        el.confirmCancel.addEventListener('click', function () { settleConfirm(false); });

        el.confirmModal.addEventListener('click', function (e) {
            if (e.target === el.confirmModal) settleConfirm(false);
        });

        el.fileList.addEventListener('click', function (e) {
            var copyBtn = e.target.closest('.copy-file');
            if (!copyBtn) return;
            copyAssetLink(parseInt(copyBtn.dataset.idx, 10));
        });

        el.fileList.addEventListener('change', function (e) {
            if (!e.target.classList.contains('file-check')) return;

            var all = el.fileList.querySelectorAll('.file-check');
            var checked = el.fileList.querySelectorAll('.file-check:checked');
            el.selectAll.checked = all.length > 0 && all.length === checked.length;
        });

        el.selectAll.addEventListener('change', function () {
            var checked = el.selectAll.checked;
            el.fileList.querySelectorAll('.file-check').forEach(function (cb) {
                cb.checked = checked;
            });
        });

        el.downloadSelected.addEventListener('click', batchDownload);

        document.addEventListener('keydown', handleKeydown);
    }

    /* ==================== 初始化 ==================== */

    function cacheElements() {
        el.toastWrap = document.getElementById('toast-wrap');

        el.toggleAddBtn = document.getElementById('toggle-add');
        el.checkAllBtn = document.getElementById('check-all');
        el.exportBtn = document.getElementById('export-btn');
        el.importFile = document.getElementById('import-file');

        el.openSettingsBtn = document.getElementById('open-settings');
        el.tokenDot = document.getElementById('token-dot');
        el.limitHint = document.getElementById('limit-hint');

        el.addPanel = document.getElementById('add-panel');
        el.addForm = document.getElementById('add-form');
        el.addUrl = document.getElementById('add-url');
        el.addVer = document.getElementById('add-ver');
        el.addCancel = document.getElementById('add-cancel');

        el.stats = document.getElementById('list-stats');
        el.repoList = document.getElementById('repo-list');

        el.settingsModal = document.getElementById('settings-modal');
        el.tokenInput = document.getElementById('token-input');
        el.tokenToggle = document.getElementById('token-toggle');
        el.tokenSave = document.getElementById('token-save');
        el.tokenClear = document.getElementById('token-clear');

        el.editModal = document.getElementById('edit-modal');
        el.editForm = document.getElementById('edit-form');
        el.editUrl = document.getElementById('edit-url');
        el.editVer = document.getElementById('edit-ver');

        el.confirmModal = document.getElementById('confirm-modal');
        el.confirmTitle = document.getElementById('confirm-title');
        el.confirmMsg = document.getElementById('confirm-message');
        el.confirmOk = document.getElementById('confirm-ok');
        el.confirmCancel = document.getElementById('confirm-cancel');

        el.downloadModal = document.getElementById('download-modal');
        el.downloadSub = document.getElementById('download-sub');
        el.selectAll = document.getElementById('select-all-files');
        el.fileList = document.getElementById('file-list');
        el.downloadSelected = document.getElementById('download-selected');
    }

    function init() {
        cacheElements();
        loadToken();
        repoList = loadData();
        bindEvents();
        render();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
