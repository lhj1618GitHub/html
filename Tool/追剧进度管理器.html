<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>追剧记录</title>
<style>
    :root{
        --bg:#0f1115;
        --card:#181b21;
        --card-2:#22262f;
        --line:#2a2f38;
        --text:#e8ecf2;
        --dim:#8b94a3;
        --accent:#3d8bff;
        --accent-2:#7d8cff;
        --danger:#ff5c6c;
        --ok:#2ed573;
        --radius:12px;
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html{-webkit-text-size-adjust:100%;}

    body{
        font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        background:var(--bg);
        background-image:radial-gradient(720px 400px at 50% -10%,#1b2433 0%,transparent 70%);
        background-repeat:no-repeat;
        color:var(--text);
        font-size:15px;
        line-height:1.5;
        min-height:100vh;
        padding:22px 16px 50px;
    }

    .wrap{max-width:640px;margin:0 auto;}

    /* 头部 */
    header{
        display:flex;
        align-items:baseline;
        justify-content:space-between;
        gap:12px;
        margin-bottom:18px;
    }

    h1{
        font-size:1.35rem;
        font-weight:700;
        letter-spacing:.02em;
        background:linear-gradient(135deg,#7cbcff,#4a9cff 50%,#9b8cff);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
    }

    .stat{font-size:.78rem;color:var(--dim);white-space:nowrap;}

    /* 工具栏 */
    .toolbar{display:flex;gap:9px;margin-bottom:16px;}

    .search{flex:1;min-width:0;}

    input[type="text"],
    input[type="number"]{
        width:100%;
        padding:10px 13px;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--card);
        color:var(--text);
        font:inherit;
        font-size:.9rem;
        transition:border-color .18s,box-shadow .18s;
    }

    input::placeholder{color:#5f6875;}

    input[type="text"]:focus,
    input[type="number"]:focus{
        outline:none;
        border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(61,139,255,.16);
    }

    input[type="number"]{-moz-appearance:textfield;}
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

    /* 按钮 */
    .btn{
        padding:10px 15px;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--card);
        color:var(--text);
        font:inherit;
        font-size:.88rem;
        font-weight:500;
        white-space:nowrap;
        cursor:pointer;
        transition:background .16s,border-color .16s,transform .1s;
    }

    .btn:hover{background:var(--card-2);border-color:#39404c;}
    .btn:active{transform:scale(.97);}

    .btn.primary{
        background:var(--accent);
        border-color:var(--accent);
        color:#fff;
    }
    .btn.primary:hover{background:#5a9dff;border-color:#5a9dff;}

    .btn.danger{
        background:var(--danger);
        border-color:var(--danger);
        color:#fff;
    }
    .btn.danger:hover{background:#e94b5b;border-color:#e94b5b;}

    /* 列表 */
    .list{display:flex;flex-direction:column;gap:10px;}

    .item{
        display:flex;
        align-items:center;
        gap:14px;
        padding:14px 16px;
        background:var(--card);
        border:1px solid var(--line);
        border-radius:var(--radius);
        transition:border-color .18s;
    }

    .item:hover{border-color:#39404c;}

    .info{flex:1;min-width:0;}

    .name{
        display:flex;
        align-items:center;
        flex-wrap:wrap;
        gap:8px;
        font-size:.98rem;
        font-weight:600;
        overflow-wrap:anywhere;
    }

    .tag{
        flex:none;
        padding:1px 8px;
        border:1px solid rgba(46,213,115,.35);
        border-radius:999px;
        background:rgba(46,213,115,.1);
        color:var(--ok);
        font-size:.66rem;
        font-weight:600;
    }

    .track{
        height:6px;
        margin-top:9px;
        border-radius:99px;
        background:var(--card-2);
        overflow:hidden;
    }

    .track span{
        display:block;
        height:100%;
        border-radius:99px;
        background:linear-gradient(90deg,var(--accent),var(--accent-2));
        transition:width .3s ease;
    }

    .item.done .track span{background:linear-gradient(90deg,var(--ok),#26c06a);}

    .meta{
        margin-top:7px;
        font-size:.76rem;
        color:var(--dim);
        font-variant-numeric:tabular-nums;
    }

    .acts{display:flex;gap:6px;flex:none;}

    .mini{
        padding:7px 11px;
        border:1px solid var(--line);
        border-radius:8px;
        background:var(--card-2);
        color:var(--text);
        font:inherit;
        font-size:.8rem;
        cursor:pointer;
        transition:background .16s,border-color .16s,transform .1s;
    }

    .mini:hover:not(:disabled){background:#2d323c;border-color:#3d4450;}
    .mini:active:not(:disabled){transform:scale(.95);}
    .mini:disabled{opacity:.35;cursor:not-allowed;}
    .mini.del{color:var(--danger);border-color:rgba(255,92,108,.3);}
    .mini.del:hover{background:rgba(255,92,108,.12);border-color:var(--danger);}

    /* 空状态 */
    .empty{padding:64px 20px;text-align:center;color:var(--dim);}
    .empty .emoji{font-size:2.6rem;line-height:1;margin-bottom:12px;opacity:.7;}
    .empty p{font-size:.9rem;}

    /* 底部 */
    .foot{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        margin-top:26px;
        font-size:.8rem;
        color:var(--dim);
    }

    .link-btn{
        padding:4px 2px;
        border:none;
        background:none;
        color:var(--dim);
        font:inherit;
        font-size:.8rem;
        cursor:pointer;
        transition:color .16s;
    }

    .link-btn:hover{color:var(--accent);}
    .dot{opacity:.5;}

    /* 弹窗 */
    .mask{
        position:fixed;
        inset:0;
        z-index:60;
        display:none;
        align-items:center;
        justify-content:center;
        padding:16px;
        background:rgba(5,7,10,.7);
        backdrop-filter:blur(3px);
        -webkit-backdrop-filter:blur(3px);
    }

    .mask.on{display:flex;}

    .dialog{
        width:100%;
        max-width:400px;
        padding:20px;
        background:var(--card);
        border:1px solid var(--line);
        border-radius:16px;
        box-shadow:0 22px 50px rgba(0,0,0,.5);
        animation:pop .18s ease;
    }

    @keyframes pop{
        from{opacity:0;transform:translateY(12px) scale(.98);}
        to{opacity:1;transform:none;}
    }

    .dialog h2{font-size:1.05rem;font-weight:600;margin-bottom:16px;}

    .dialog label{
        display:block;
        margin-bottom:14px;
        font-size:.82rem;
        color:var(--dim);
    }

    .dialog label input{margin-top:6px;}

    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

    .c-msg{
        margin-bottom:20px;
        color:var(--dim);
        font-size:.88rem;
        line-height:1.7;
        overflow-wrap:anywhere;
    }

    .dlg-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:4px;}

    /* Toast */
    #toast{
        position:fixed;
        left:50%;
        bottom:28px;
        z-index:100;
        max-width:calc(100vw - 40px);
        padding:10px 18px;
        border:1px solid var(--line);
        border-radius:999px;
        background:#2b303a;
        color:var(--text);
        font-size:.84rem;
        text-align:center;
        opacity:0;
        transform:translate(-50%,10px);
        transition:opacity .22s,transform .22s;
        pointer-events:none;
    }

    #toast.on{opacity:1;transform:translate(-50%,0);}

    /* 手机 */
    @media (max-width:520px){
        body{padding:16px 12px 40px;}
        h1{font-size:1.2rem;}

        .item{flex-direction:column;align-items:stretch;gap:12px;}
        .acts .mini{flex:1;padding:9px 6px;}
        .two{grid-template-columns:1fr;gap:0;}
        .dlg-foot .btn{flex:1;}
    }

    @media (prefers-reduced-motion:reduce){
        *{transition:none !important;animation:none !important;}
    }
</style>
</head>
<body>

<div class="wrap">
    <header>
        <h1>追剧记录</h1>
        <span class="stat" id="stat"></span>
    </header>

    <div class="toolbar">
        <div class="search">
            <input type="text" id="search" placeholder="搜索剧集…" autocomplete="off" aria-label="搜索剧集">
        </div>
        <button class="btn primary" id="add-btn">＋ 添加</button>
    </div>

    <div class="list" id="list"></div>

    <div class="foot">
        <button class="link-btn" id="export-btn">导出备份</button>
        <span class="dot">·</span>
        <label class="link-btn" for="import-file">导入备份</label>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
</div>

<!-- 添加 / 编辑 -->
<div class="mask" id="mask">
    <div class="dialog">
        <h2 id="d-title">添加剧集</h2>
        <form id="form" novalidate>
            <label>剧集名称
                <input type="text" id="f-name" maxlength="60" placeholder="例如：黑镜 第一季">
            </label>
            <div class="two">
                <label>当前集数
                    <input type="number" id="f-cur" min="0" step="1" value="0" inputmode="numeric">
                </label>
                <label>总集数（可留空）
                    <input type="number" id="f-total" min="1" step="1" inputmode="numeric" placeholder="未知">
                </label>
            </div>
            <div class="dlg-foot">
                <button type="button" class="btn" id="d-cancel">取消</button>
                <button type="submit" class="btn primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 确认框 -->
<div class="mask" id="confirm-mask">
    <div class="dialog">
        <h2 id="c-title">提示</h2>
        <p class="c-msg" id="c-msg"></p>
        <div class="dlg-foot">
            <button type="button" class="btn" id="c-cancel">取消</button>
            <button type="button" class="btn danger" id="c-ok">确定</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
(function () {
    'use strict';

    const KEY = 'tvShows.records';

    let shows = [];        // 全部记录
    let term = '';         // 搜索词
    let editingId = null;  // 正在编辑的 id
    let confirmResolve = null;

    const $ = function (id) { return document.getElementById(id); };

    /* ============ 小工具 ============ */

    function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function esc(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    let toastTimer = null;
    function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2000);
    }

    /* ============ 数据 ============ */

    function normalize(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const name = String(raw.name == null ? '' : raw.name).trim();
        if (!name) return null;

        let total = Math.floor(Number(raw.total != null ? raw.total : raw.totalEpisodes));
        if (!Number.isFinite(total) || total <= 0) total = 0;

        let current = Math.floor(Number(raw.current != null ? raw.current : raw.currentEpisode));
        if (!Number.isFinite(current) || current < 0) current = 0;
        if (total && current > total) current = total;

        return { id: uid(), name: name, current: current, total: total };
    }

    function load() {
        try {
            const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
            shows = Array.isArray(raw) ? raw.map(normalize).filter(Boolean) : [];
        } catch (e) {
            shows = [];
        }
    }

    function save() {
        try {
            localStorage.setItem(KEY, JSON.stringify(shows));
        } catch (e) {
            toast('保存失败，本地存储可能已满');
        }
    }

    /* ============ 渲染 ============ */

    function itemHtml(s) {
        const hasTotal = s.total > 0;
        const done = hasTotal && s.current >= s.total;
        const pct = hasTotal ? Math.min(100, Math.round(s.current / s.total * 100)) : 0;
        const meta = hasTotal ? s.current + ' / ' + s.total + ' 集' : '已看 ' + s.current + ' 集';

        return '<div class="item' + (done ? ' done' : '') + '" data-id="' + s.id + '">' +
            '<div class="info">' +
                '<div class="name">' + esc(s.name) +
                    (done ? '<span class="tag">已完结</span>' : '') +
                '</div>' +
                (hasTotal ? '<div class="track"><span style="width:' + pct + '%"></span></div>' : '') +
                '<div class="meta">' + meta + '</div>' +
            '</div>' +
            '<div class="acts">' +
                '<button type="button" class="mini" data-act="inc"' + (done ? ' disabled' : '') + '>+1</button>' +
                '<button type="button" class="mini" data-act="edit">编辑</button>' +
                '<button type="button" class="mini del" data-act="del">删除</button>' +
            '</div>' +
        '</div>';
    }

    function render() {
        const t = term.trim().toLowerCase();
        const list = t ? shows.filter(function (s) { return s.name.toLowerCase().indexOf(t) !== -1; }) : shows;
        const doneCount = shows.filter(function (s) { return s.total > 0 && s.current >= s.total; }).length;

        $('stat').textContent = shows.length
            ? '共 ' + shows.length + ' 部 · 完结 ' + doneCount
            : '';

        if (!list.length) {
            $('list').innerHTML =
                '<div class="empty">' +
                    '<div class="emoji">' + (t ? '🔍' : '📺') + '</div>' +
                    '<p>' + (t ? '没有找到匹配的剧集' : '还没有记录，点「＋ 添加」开始追剧吧') + '</p>' +
                '</div>';
            return;
        }

        $('list').innerHTML = list.map(itemHtml).join('');
    }

    /* ============ 确认框 ============ */

    function ask(title, message, okText) {
        $('c-title').textContent = title;
        $('c-msg').textContent = message;
        $('c-ok').textContent = okText || '确定';
        $('confirm-mask').classList.add('on');

        return new Promise(function (resolve) { confirmResolve = resolve; });
    }

    function closeConfirm(value) {
        $('confirm-mask').classList.remove('on');
        const r = confirmResolve;
        confirmResolve = null;
        if (r) r(value);
    }

    /* ============ 添加 / 编辑 ============ */

    function openDialog(show) {
        editingId = show ? show.id : null;
        $('d-title').textContent = show ? '编辑剧集' : '添加剧集';
        $('f-name').value = show ? show.name : '';
        $('f-cur').value = show ? show.current : 0;
        $('f-total').value = show && show.total ? show.total : '';
        $('mask').classList.add('on');
        setTimeout(function () { $('f-name').focus(); }, 50);
    }

    function closeDialog() {
        $('mask').classList.remove('on');
        editingId = null;
    }

    function submitForm(e) {
        e.preventDefault();

        const name = $('f-name').value.trim();
        if (!name) {
            toast('请输入剧集名称');
            $('f-name').focus();
            return;
        }

        const totalRaw = $('f-total').value.trim();
        let total = totalRaw === '' ? 0 : Math.floor(Number(totalRaw));
        if (!Number.isFinite(total) || total <= 0) total = 0;

        let current = Math.floor(Number($('f-cur').value));
        if (!Number.isFinite(current) || current < 0) current = 0;
        if (total && current > total) current = total;

        const dup = shows.some(function (s) {
            return s.id !== editingId && s.name.toLowerCase() === name.toLowerCase();
        });
        if (dup) {
            toast('已存在同名剧集');
            return;
        }

        const isEdit = editingId !== null;

        if (isEdit) {
            const s = shows.find(function (x) { return x.id === editingId; });
            if (s) { s.name = name; s.current = current; s.total = total; }
        } else {
            shows.unshift({ id: uid(), name: name, current: current, total: total });
        }

        save();
        render();
        closeDialog();
        toast(isEdit ? '已保存' : '已添加');
    }

    /* ============ 行内操作 ============ */

    function increment(id) {
        const s = shows.find(function (x) { return x.id === id; });
        if (!s) return;

        if (s.total && s.current >= s.total) {
            toast('已经追完啦 🎉');
            return;
        }

        s.current += 1;
        save();
        render();

        if (s.total && s.current >= s.total) {
            toast('「' + s.name + '」完结 🎉');
        }
    }

    async function remove(id) {
        const s = shows.find(function (x) { return x.id === id; });
        if (!s) return;

        const ok = await ask('删除剧集', '确定删除「' + s.name + '」吗？此操作无法撤销。', '删除');
        if (!ok) return;

        shows = shows.filter(function (x) { return x.id !== id; });
        save();
        render();
        toast('已删除');
    }

    /* ============ 导入 / 导出 ============ */

    function exportData() {
        if (!shows.length) {
            toast('还没有可导出的数据');
            return;
        }

        const blob = new Blob([JSON.stringify(shows, null, 2)], { type: 'application/json' });
        const d = new Date();
        const pad = function (n) { return String(n).padStart(2, '0'); };
        const filename = '追剧备份_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);

        toast('已导出备份');
    }

    function importFile(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (ev) {
            let data;
            try {
                data = JSON.parse(ev.target.result);
            } catch (err) {
                toast('文件解析失败，请确认是 JSON 备份');
                return;
            }

            if (!Array.isArray(data)) {
                toast('文件格式不正确');
                return;
            }

            const records = data.map(normalize).filter(Boolean);
            if (!records.length) {
                toast('没有可导入的数据');
                return;
            }

            // 合并：同名剧集保留进度较大的一条
            let added = 0;
            let updated = 0;

            records.forEach(function (item) {
                const exist = shows.find(function (s) {
                    return s.name.toLowerCase() === item.name.toLowerCase();
                });

                if (!exist) {
                    shows.push(item);
                    added++;
                } else if (item.current > exist.current) {
                    exist.current = item.current;
                    if (item.total) exist.total = item.total;
                    updated++;
                }
            });

            save();
            render();
            toast('导入完成：新增 ' + added + ' 条，更新 ' + updated + ' 条');
        };

        reader.onerror = function () { toast('读取文件失败'); };
        reader.readAsText(file);
    }

    /* ============ 事件绑定 ============ */

    function bind() {
        // 搜索
        $('search').addEventListener('input', function () {
            term = this.value;
            render();
        });

        // 添加
        $('add-btn').addEventListener('click', function () { openDialog(null); });

        // 列表委托
        $('list').addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;

            const item = btn.closest('.item');
            if (!item) return;

            const id = item.dataset.id;

            if (btn.dataset.act === 'inc') increment(id);
            else if (btn.dataset.act === 'del') remove(id);
            else if (btn.dataset.act === 'edit') {
                const s = shows.find(function (x) { return x.id === id; });
                if (s) openDialog(s);
            }
        });

        // 表单
        $('form').addEventListener('submit', submitForm);
        $('d-cancel').addEventListener('click', closeDialog);
        $('mask').addEventListener('click', function (e) {
            if (e.target === this) closeDialog();
        });

        // 确认框
        $('c-ok').addEventListener('click', function () { closeConfirm(true); });
        $('c-cancel').addEventListener('click', function () { closeConfirm(false); });
        $('confirm-mask').addEventListener('click', function (e) {
            if (e.target === this) closeConfirm(false);
        });

        // 导入导出
        $('export-btn').addEventListener('click', exportData);
        $('import-file').addEventListener('change', importFile);

        // 键盘
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;

            if ($('confirm-mask').classList.contains('on')) {
                closeConfirm(false);
            } else if ($('mask').classList.contains('on')) {
                closeDialog();
            } else if (term) {
                $('search').value = '';
                term = '';
                render();
            }
        });
    }

    /* ============ 启动 ============ */

    load();
    bind();
    render();
})();
</script>
</body>
</html>
