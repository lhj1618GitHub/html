<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>追剧记录</title>
<style>
    :root{
        --bg:#0f1115;
        --glow:#1b2433;
        --card:#181b21;
        --card-2:#22262f;
        --card-3:#2d323c;
        --line:#2a2f38;
        --line-2:#39404c;
        --text:#e8ecf2;
        --dim:#8b94a3;
        --accent:#3d8bff;
        --accent-soft:rgba(61,139,255,.16);
        --accent-2:#7d8cff;
        --danger:#ff5c6c;
        --danger-soft:rgba(255,92,108,.12);
        --ok:#2ed573;
        --ok-soft:rgba(46,213,115,.12);
        --ok-line:rgba(46,213,115,.35);
        --shadow:0 10px 30px rgba(0,0,0,.45);
        --shadow-lg:0 22px 50px rgba(0,0,0,.5);
        --mask:rgba(5,7,10,.7);
        --radius:12px;
    }

    html[data-theme="light"]{
        --bg:#f3f5fa;
        --glow:#e3ecfb;
        --card:#ffffff;
        --card-2:#eef1f7;
        --card-3:#e4e9f2;
        --line:#dde3ed;
        --line-2:#c9d2e0;
        --text:#1b2130;
        --dim:#6b7484;
        --accent:#2f7ef0;
        --accent-soft:rgba(47,126,240,.12);
        --accent-2:#7d8cff;
        --danger:#e8434f;
        --danger-soft:rgba(232,67,79,.1);
        --ok:#1fae5e;
        --ok-soft:rgba(31,174,94,.12);
        --ok-line:rgba(31,174,94,.35);
        --shadow:0 10px 30px rgba(20,30,60,.15);
        --shadow-lg:0 22px 50px rgba(20,30,60,.18);
        --mask:rgba(15,20,30,.35);
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html{-webkit-text-size-adjust:100%;}

    body{
        font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        background:var(--bg);
        background-image:radial-gradient(720px 400px at 50% -10%, var(--glow) 0%, transparent 70%);
        background-repeat:no-repeat;
        color:var(--text);
        font-size:15px;
        line-height:1.5;
        min-height:100vh;
        padding:22px 16px 50px;
        transition:background-color .25s,color .25s;
    }

    .wrap{max-width:640px;margin:0 auto;}

    /* 头部 */
    header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        margin-bottom:18px;
    }

    h1{
        font-size:1.35rem;
        font-weight:700;
        letter-spacing:.02em;
        background:linear-gradient(135deg,#7cbcff,#4a9cff 50%,#9b8cff);
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        cursor:pointer;
        user-select:none;
        -webkit-user-select:none;
        -webkit-tap-highlight-color:transparent;
    }

    .head-right{display:flex;align-items:center;gap:10px;}

    .stat{font-size:.78rem;color:var(--dim);white-space:nowrap;}

    .icon-btn{
        flex:none;
        width:36px;height:36px;
        display:flex;align-items:center;justify-content:center;
        border:1px solid var(--line);
        border-radius:10px;
        background:var(--card);
        color:var(--text);
        font-size:1rem;
        line-height:1;
        cursor:pointer;
        transition:background .16s,border-color .16s,transform .1s;
    }

    .icon-btn:hover{background:var(--card-2);border-color:var(--line-2);}
    .icon-btn:active{transform:scale(.94);}

    /* 工具栏 */
    .toolbar{display:flex;gap:9px;margin-bottom:16px;}

    .search{flex:1;min-width:0;}

    input[type="text"],
    input[type="number"]{
        width:100%;
        padding:10px 13px;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--card);
        color:var(--text);
        font:inherit;
        font-size:.9rem;
        transition:border-color .18s,box-shadow .18s;
    }

    input::placeholder{color:var(--dim);opacity:.75;}

    input[type="text"]:focus,
    input[type="number"]:focus{
        outline:none;
        border-color:var(--accent);
        box-shadow:0 0 0 3px var(--accent-soft);
    }

    input[type="number"]{-moz-appearance:textfield;}
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

    /* 按钮 */
    .btn{
        padding:10px 15px;
        border:1px solid var(--line);
        border-radius:var(--radius);
        background:var(--card);
        color:var(--text);
        font:inherit;
        font-size:.88rem;
        font-weight:500;
        white-space:nowrap;
        cursor:pointer;
        transition:background .16s,border-color .16s,color .16s,transform .1s;
    }

    .btn:hover{background:var(--card-2);border-color:var(--line-2);}
    .btn:active{transform:scale(.97);}

    .btn.primary{
        background:var(--accent);
        border-color:var(--accent);
        color:#fff;
    }
    .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);}

    .btn.on{
        background:var(--accent-soft);
        border-color:var(--accent);
        color:var(--accent);
    }

    .btn.danger{
        background:var(--danger);
        border-color:var(--danger);
        color:#fff;
    }
    .btn.danger:hover{opacity:.9;}

    /* 列表 */
    .list{display:flex;flex-direction:column;gap:10px;}

    .item{
        display:flex;
        align-items:center;
        gap:10px;
        padding:14px 16px;
        background:var(--card);
        border:1px solid var(--line);
        border-radius:var(--radius);
        transition:border-color .18s,background-color .25s,box-shadow .18s,opacity .18s;
    }

    .item:hover{border-color:var(--line-2);}

    /* 拖动手柄 */
    .handle{
        display:none;
        flex:none;
        width:24px;
        height:40px;
        align-items:center;
        justify-content:center;
        color:var(--dim);
        font-size:.9rem;
        letter-spacing:-2px;
        line-height:1;
        cursor:grab;
        touch-action:none;
        user-select:none;
        -webkit-user-select:none;
        -webkit-tap-highlight-color:transparent;
        border-radius:6px;
        transition:background .15s,color .15s;
    }

    body.manage .handle{display:flex;}
    .handle:hover{background:var(--card-2);color:var(--text);}
    .handle:active{cursor:grabbing;}

    .item.dragging{
        opacity:.9;
        border-color:var(--accent);
        box-shadow:0 0 0 1px var(--accent), var(--shadow);
        position:relative;
        z-index:2;
    }

    body.manage .item{user-select:none;-webkit-user-select:none;}

    .info{flex:1;min-width:0;}

    .name{
        display:flex;
        align-items:center;
        flex-wrap:wrap;
        gap:8px;
        font-size:.98rem;
        font-weight:600;
        overflow-wrap:anywhere;
    }

    .tag{
        flex:none;
        padding:1px 8px;
        border:1px solid var(--ok-line);
        border-radius:999px;
        background:var(--ok-soft);
        color:var(--ok);
        font-size:.66rem;
        font-weight:600;
    }

    .track{
        height:6px;
        margin-top:9px;
        border-radius:99px;
        background:var(--card-2);
        overflow:hidden;
    }

    .track span{
        display:block;
        height:100%;
        border-radius:99px;
        background:linear-gradient(90deg,var(--accent),var(--accent-2));
        transition:width .3s ease;
    }

    .item.done .track span{background:linear-gradient(90deg,var(--ok),#26c06a);}

    .meta{
        margin-top:7px;
        font-size:.76rem;
        color:var(--dim);
        font-variant-numeric:tabular-nums;
    }

    /* 操作区 */
    .acts{display:flex;align-items:center;gap:6px;flex:none;}

    .mini{
        display:none;
        align-items:center;
        justify-content:center;
        padding:7px 10px;
        border:1px solid var(--line);
        border-radius:8px;
        background:var(--card-2);
        color:var(--text);
        font:inherit;
        font-size:.78rem;
        cursor:pointer;
        transition:background .16s,border-color .16s,transform .1s;
    }

    body.manage .mini{display:inline-flex;}

    .mini:hover{background:var(--card-3);border-color:var(--line-2);}
    .mini:active{transform:scale(.95);}

    .mini.del{color:var(--danger);border-color:var(--danger-soft);}
    .mini.del:hover{background:var(--danger-soft);border-color:var(--danger);}

    /* +1 圆形按钮 */
    .plus{
        flex:none;
        width:38px;height:38px;
        display:flex;align-items:center;justify-content:center;
        border:1px solid var(--accent);
        border-radius:50%;
        background:var(--accent-soft);
        color:var(--accent);
        font:inherit;
        font-size:.84rem;
        font-weight:700;
        letter-spacing:-.02em;
        cursor:pointer;
        transition:background .16s,color .16s,transform .1s,border-color .16s;
        -webkit-tap-highlight-color:transparent;
    }

    .plus:hover:not(:disabled){
        background:var(--accent);
        border-color:var(--accent);
        color:#fff;
    }

    .plus:active:not(:disabled){transform:scale(.9);}

    .plus:disabled{
        background:var(--card-2);
        border-color:var(--line);
        color:var(--dim);
        opacity:.6;
        cursor:default;
    }

    /* 空状态 */
    .empty{padding:64px 20px;text-align:center;color:var(--dim);}
    .empty .emoji{font-size:2.6rem;line-height:1;margin-bottom:12px;opacity:.7;}
    .empty p{font-size:.9rem;}

    /* 底部导入导出 */
    .foot{
        display:none;
        align-items:center;
        justify-content:center;
        gap:8px;
        margin-top:26px;
        font-size:.8rem;
        color:var(--dim);
    }

    body.manage .foot{display:flex;}

    .link-btn{
        padding:4px 2px;
        border:none;
        background:none;
        color:var(--dim);
        font:inherit;
        font-size:.8rem;
        cursor:pointer;
        transition:color .16s;
    }

    .link-btn:hover{color:var(--accent);}
    .dot{opacity:.5;}

    /* 弹窗 */
    .mask{
        position:fixed;
        inset:0;
        z-index:60;
        display:none;
        align-items:center;
        justify-content:center;
        padding:16px;
        background:var(--mask);
        backdrop-filter:blur(3px);
        -webkit-backdrop-filter:blur(3px);
    }

    .mask.on{display:flex;}

    .dialog{
        width:100%;
        max-width:400px;
        padding:20px;
        background:var(--card);
        border:1px solid var(--line);
        border-radius:16px;
        box-shadow:var(--shadow-lg);
        animation:pop .18s ease;
    }

    @keyframes pop{
        from{opacity:0;transform:translateY(12px) scale(.98);}
        to{opacity:1;transform:none;}
    }

    .dialog h2{font-size:1.05rem;font-weight:600;margin-bottom:16px;}

    .dialog label{
        display:block;
        margin-bottom:14px;
        font-size:.82rem;
        color:var(--dim);
    }

    .dialog label input{margin-top:6px;}

    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

    .c-msg{
        margin-bottom:20px;
        color:var(--dim);
        font-size:.88rem;
        line-height:1.7;
        overflow-wrap:anywhere;
    }

    .dlg-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:4px;}

    /* Toast */
    #toast{
        position:fixed;
        left:50%;
        bottom:28px;
        z-index:100;
        max-width:calc(100vw - 40px);
        padding:10px 18px;
        border:1px solid var(--line);
        border-radius:999px;
        background:var(--card-2);
        color:var(--text);
        box-shadow:var(--shadow);
        font-size:.84rem;
        text-align:center;
        opacity:0;
        transform:translate(-50%,10px);
        transition:opacity .22s,transform .22s;
        pointer-events:none;
    }

    #toast.on{opacity:1;transform:translate(-50%,0);}

    /* 手机 */
    @media (max-width:520px){
        body{padding:16px 12px 40px;}
        h1{font-size:1.2rem;}

        .item{padding:12px 13px;gap:8px;}

        .handle{width:20px;}

        .mini{padding:6px 8px;font-size:.74rem;}

        .plus{width:34px;height:34px;font-size:.78rem;}

        .two{grid-template-columns:1fr;gap:0;}
        .dlg-foot .btn{flex:1;}
    }

    @media (prefers-reduced-motion:reduce){
        *{transition:none !important;animation:none !important;}
    }
</style>
</head>
<body>

<div class="wrap">
    <header>
        <h1 id="title">追剧记录</h1>
        <div class="head-right">
            <span class="stat" id="stat"></span>
            <button type="button" class="icon-btn" id="theme-btn" aria-label="切换日夜模式" title="切换日夜模式">🌙</button>
        </div>
    </header>

    <div class="toolbar">
        <div class="search">
            <input type="text" id="search" placeholder="搜索剧集…" autocomplete="off" aria-label="搜索剧集">
        </div>
        <button type="button" class="btn primary" id="add-btn">＋ 添加</button>
        <button type="button" class="btn" id="manage-btn" aria-pressed="false">管理</button>
    </div>

    <div class="list" id="list"></div>

    <div class="foot">
        <button type="button" class="link-btn" id="export-btn">导出备份</button>
        <span class="dot">·</span>
        <label class="link-btn" for="import-file">导入备份</label>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
</div>

<!-- 添加 / 编辑 -->
<div class="mask" id="mask">
    <div class="dialog">
        <h2 id="d-title">添加剧集</h2>
        <form id="form" novalidate>
            <label>剧集名称
                <input type="text" id="f-name" maxlength="60" placeholder="例如：黑镜 第一季">
            </label>
            <div class="two">
                <label>当前集数
                    <input type="number" id="f-cur" min="0" step="1" value="0" inputmode="numeric">
                </label>
                <label>总集数（可留空）
                    <input type="number" id="f-total" min="1" step="1" inputmode="numeric" placeholder="未知">
                </label>
            </div>
            <div class="dlg-foot">
                <button type="button" class="btn" id="d-cancel">取消</button>
                <button type="submit" class="btn primary">保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 确认框 -->
<div class="mask" id="confirm-mask">
    <div class="dialog">
        <h2 id="c-title">提示</h2>
        <p class="c-msg" id="c-msg"></p>
        <div class="dlg-foot">
            <button type="button" class="btn" id="c-cancel">取消</button>
            <button type="button" class="btn danger" id="c-ok">确定</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
(function () {
    'use strict';

    const KEY = 'tvShows.records';
    const THEME_KEY = 'tvShows.theme';
    const MANAGE_KEY = 'tvShows.manage';
    const BACKUP_FILE = '追剧进度管理.json';

    let shows = [];        // 全部记录，数组顺序即排序，id 为顺序编号
    let term = '';         // 搜索词
    let editingId = null;  // 正在编辑的记录 id
    let confirmResolve = null;
    let restoring = false;
    let manageMode = false;

    const $ = function (id) { return document.getElementById(id); };
    const listEl = document.getElementById('list');

    /* ============ 小工具 ============ */

    function esc(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    let toastTimer = null;
    function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2000);
    }

    /* ============ 主题 ============ */

    function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        $('theme-btn').textContent = theme === 'light' ? '☀️' : '🌙';
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f5fa' : '#0f1115');
        try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }

    function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
        if (saved !== 'light' && saved !== 'dark') {
            saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                ? 'light' : 'dark';
        }
        applyTheme(saved);
    }

    function toggleTheme() {
        applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
    }

    /* ============ 管理模式 ============ */

    function applyManage() {
        document.body.classList.toggle('manage', manageMode);
        const btn = $('manage-btn');
        btn.textContent = manageMode ? '完成' : '管理';
        btn.classList.toggle('on', manageMode);
        btn.setAttribute('aria-pressed', manageMode ? 'true' : 'false');
        try { localStorage.setItem(MANAGE_KEY, manageMode ? '1' : '0'); } catch (e) {}
    }

    function initManage() {
        try { manageMode = localStorage.getItem(MANAGE_KEY) === '1'; } catch (e) { manageMode = false; }
        applyManage();
    }

    function toggleManage() {
        manageMode = !manageMode;
        if (!manageMode) cancelDrag();
        applyManage();
    }

    /* ============ 数据规范化 ============ */

    function normalize(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const name = String(raw.name == null ? '' : raw.name).trim();
        if (!name) return null;

        let total = Math.floor(Number(raw.total != null ? raw.total : raw.totalEpisodes));
        if (!Number.isFinite(total) || total <= 0) total = 0;

        let current = Math.floor(Number(raw.current != null ? raw.current : raw.currentEpisode));
        if (!Number.isFinite(current) || current < 0) current = 0;
        if (total && current > total) current = total;

        // id 作为排序依据，必须是有效整数，否则置空等待重新赋值
        let id = raw.id;
        let idNum = Number(id);
        if (id === null || id === undefined || id === '' || !Number.isFinite(idNum)) {
            id = null;
        } else {
            id = String(Math.floor(idNum));
        }

        return { id: id, name: name, current: current, total: total };
    }

    /* ============ 加载 / 保存 ============ */

    function load() {
        try {
            const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
            if (!Array.isArray(raw)) { shows = []; return; }

            const items = raw.map(normalize).filter(Boolean);

            // 按记录内 id 排序（无效 id 排最后）
            items.sort(function (a, b) {
                if (a.id === null && b.id === null) return 0;
                if (a.id === null) return 1;
                if (b.id === null) return -1;
                return Number(a.id) - Number(b.id);
            });

            // 按列表顺序重新赋 id
            items.forEach(function (s, i) { s.id = String(i); });
            shows = items;
        } catch (e) {
            shows = [];
        }
    }

    function save() {
        try {
            localStorage.setItem(KEY, JSON.stringify(shows));
        } catch (e) {
            toast('保存失败，本地存储可能已满');
        }
    }

    /* ============ 渲染 ============ */

    function itemHtml(s) {
        const hasTotal = s.total > 0;
        const done = hasTotal && s.current >= s.total;
        const pct = hasTotal ? Math.min(100, Math.round(s.current / s.total * 100)) : 0;
        const meta = hasTotal ? s.current + ' / ' + s.total + ' 集' : '已看 ' + s.current + ' 集';

        return '<div class="item' + (done ? ' done' : '') + '" data-id="' + esc(s.id) + '">' +
            '<div class="handle" data-handle aria-label="拖动排序" title="拖动排序">⋮⋮</div>' +
            '<div class="info">' +
                '<div class="name">' + esc(s.name) +
                    (done ? '<span class="tag">已完结</span>' : '') +
                '</div>' +
                (hasTotal ? '<div class="track"><span style="width:' + pct + '%"></span></div>' : '') +
                '<div class="meta">' + meta + '</div>' +
            '</div>' +
            '<div class="acts">' +
                '<button type="button" class="mini" data-act="edit">编辑</button>' +
                '<button type="button" class="mini del" data-act="del">删除</button>' +
                '<button type="button" class="plus" data-act="inc"' +
                    (done ? ' disabled' : '') + '>' + (done ? '✓' : '+1') + '</button>' +
            '</div>' +
        '</div>';
    }

    function render() {
        const t = term.trim().toLowerCase();
        const list = t ? shows.filter(function (s) { return s.name.toLowerCase().indexOf(t) !== -1; }) : shows;
        const doneCount = shows.filter(function (s) { return s.total > 0 && s.current >= s.total; }).length;

        $('stat').textContent = shows.length
            ? '共 ' + shows.length + ' 部 · 完结 ' + doneCount
            : '';

        if (!list.length) {
            listEl.innerHTML =
                '<div class="empty">' +
                    '<div class="emoji">' + (t ? '🔍' : '📺') + '</div>' +
                    '<p>' + (t ? '没有找到匹配的剧集' : '还没有记录，点「＋ 添加」开始追剧吧') + '</p>' +
                '</div>';
            return;
        }

        listEl.innerHTML = list.map(itemHtml).join('');
    }

    /* ============ 拖动排序 ============ */

    let drag = null;

    function cancelDrag() {
        if (drag) {
            if (drag.el) drag.el.classList.remove('dragging');
            drag = null;
        }
    }

    function onPointerDown(e) {
        if (!manageMode) return;
        const handle = e.target.closest('[data-handle]');
        if (!handle) return;
        const item = handle.closest('.item');
        if (!item) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        e.preventDefault();

        drag = {
            el: item,
            pointerId: e.pointerId,
            startY: e.clientY,
            active: false
        };

        try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    }

    function onPointerMove(e) {
        if (!drag || e.pointerId !== drag.pointerId) return;

        const dy = e.clientY - drag.startY;

        if (!drag.active) {
            if (Math.abs(dy) < 5) return;
            drag.active = true;
            drag.el.classList.add('dragging');
        }

        if (e.cancelable) e.preventDefault();

        const y = e.clientY;
        const items = Array.prototype.slice.call(listEl.querySelectorAll('.item'));
        let swapped = false;

        for (let i = 0; i < items.length; i++) {
            const t = items[i];
            if (t === drag.el) continue;
            const r = t.getBoundingClientRect();
            if (y >= r.top && y <= r.bottom) {
                const before = y < r.top + r.height / 2;
                if (before) {
                    if (t.previousElementSibling !== drag.el) {
                        listEl.insertBefore(drag.el, t);
                        swapped = true;
                    }
                } else {
                    if (t.nextElementSibling !== drag.el) {
                        listEl.insertBefore(drag.el, t.nextSibling);
                        swapped = true;
                    }
                }
                break;
            }
        }

        if (!swapped) {
            const first = items[0];
            const last = items[items.length - 1];
            if (first && first !== drag.el && y < first.getBoundingClientRect().top) {
                listEl.insertBefore(drag.el, first);
            } else if (last && last !== drag.el && y > last.getBoundingClientRect().bottom) {
                listEl.appendChild(drag.el);
            }
        }
    }

    function onPointerUp(e) {
        if (!drag || (e && e.pointerId !== drag.pointerId)) return;

        const wasActive = drag.active;
        if (drag.el) drag.el.classList.remove('dragging');
        drag = null;

        if (wasActive) syncOrder();
    }

    /* 按当前 DOM 顺序重排数据并重新赋值 id */
    function syncOrder() {
        const listItems = Array.prototype.slice.call(listEl.querySelectorAll('.item'));
        const idMap = {};
        shows.forEach(function (s) { idMap[s.id] = s; });

        const ordered = [];
        listItems.forEach(function (el) {
            const s = idMap[el.dataset.id];
            if (s) { ordered.push(s); delete idMap[el.dataset.id]; }
        });

        // 被搜索过滤掉、未出现在 DOM 中的记录按原有顺序追加
        shows.forEach(function (s) { if (idMap[s.id]) ordered.push(s); });

        ordered.forEach(function (s, i) { s.id = String(i); });
        shows = ordered;

        save();
        render();
    }

    /* ============ 弹窗 ============ */

    function closeAllModals() {
        $('mask').classList.remove('on');
        $('confirm-mask').classList.remove('on');
        editingId = null;
        if (confirmResolve) { const r = confirmResolve; confirmResolve = null; r(false); }
    }

    function ask(title, message, okText) {
        $('c-title').textContent = title;
        $('c-msg').textContent = message;
        $('c-ok').textContent = okText || '确定';
        $('confirm-mask').classList.add('on');

        return new Promise(function (resolve) { confirmResolve = resolve; });
    }

    function closeConfirm(value) {
        $('confirm-mask').classList.remove('on');
        const r = confirmResolve;
        confirmResolve = null;
        if (r) r(value);
    }

    /* ============ 添加 / 编辑 ============ */

    function openDialog(show) {
        editingId = show ? show.id : null;
        $('d-title').textContent = show ? '编辑剧集' : '添加剧集';
        $('f-name').value = show ? show.name : '';
        $('f-cur').value = show ? show.current : 0;
        $('f-total').value = show && show.total ? show.total : '';
        $('mask').classList.add('on');
        setTimeout(function () { $('f-name').focus(); }, 50);
    }

    function closeDialog() {
        $('mask').classList.remove('on');
        editingId = null;
    }

    function submitForm(e) {
        e.preventDefault();

        const name = $('f-name').value.trim();
        if (!name) {
            toast('请输入剧集名称');
            $('f-name').focus();
            return;
        }

        const totalRaw = $('f-total').value.trim();
        let total = totalRaw === '' ? 0 : Math.floor(Number(totalRaw));
        if (!Number.isFinite(total) || total <= 0) total = 0;

        let current = Math.floor(Number($('f-cur').value));
        if (!Number.isFinite(current) || current < 0) current = 0;
        if (total && current > total) current = total;

        const dup = shows.some(function (s) {
            return s.id !== editingId && s.name.toLowerCase() === name.toLowerCase();
        });
        if (dup) {
            toast('已存在同名剧集');
            return;
        }

        const isEdit = editingId !== null;

        if (isEdit) {
            const s = shows.find(function (x) { return x.id === editingId; });
            if (s) { s.name = name; s.current = current; s.total = total; }
        } else {
            shows.unshift({ id: '', name: name, current: current, total: total });
            shows.forEach(function (s, i) { s.id = String(i); });
        }

        save();
        render();
        closeDialog();
        toast(isEdit ? '已保存' : '已添加');
    }

    /* ============ 行内操作 ============ */

    function increment(id) {
        const s = shows.find(function (x) { return x.id === id; });
        if (!s) return;

        if (s.total && s.current >= s.total) {
            toast('已经追完啦 🎉');
            return;
        }

        s.current += 1;
        save();
        render();

        if (s.total && s.current >= s.total) {
            toast('「' + s.name + '」完结 🎉');
        }
    }

    async function remove(id) {
        const s = shows.find(function (x) { return x.id === id; });
        if (!s) return;

        const ok = await ask('删除剧集', '确定删除「' + s.name + '」吗？此操作无法撤销。', '删除');
        if (!ok) return;

        shows = shows.filter(function (x) { return x.id !== id; });
        shows.forEach(function (x, i) { x.id = String(i); });
        save();
        render();
        toast('已删除');
    }

    /* ============ 合并导入 ============ */

    function mergeRecords(records) {
        let added = 0, updated = 0;

        records.forEach(function (item) {
            const exist = shows.find(function (s) {
                return s.name.toLowerCase() === item.name.toLowerCase();
            });

            if (!exist) {
                // 合并时不使用导入记录的 id，追加到末尾后统一重排
                shows.push({ id: '', name: item.name, current: item.current, total: item.total });
                added++;
            } else if (item.current > exist.current) {
                exist.current = item.current;
                if (item.total) exist.total = item.total;
                updated++;
            }
        });

        // 按当前顺序重新赋值 id
        shows.forEach(function (s, i) { s.id = String(i); });

        return { added: added, updated: updated };
    }

    /* ============ 导出 / 导入 ============ */

    function exportData() {
        if (!shows.length) {
            toast('还没有可导出的数据');
            return;
        }

        const blob = new Blob([JSON.stringify(shows, null, 2)], { type: 'application/json' });
        const d = new Date();
        const pad = function (n) { return String(n).padStart(2, '0'); };
        const filename = '追剧备份_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);

        toast('已导出备份');
    }

    function importFile(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (ev) {
            let data;
            try {
                data = JSON.parse(ev.target.result);
            } catch (err) {
                toast('文件解析失败，请确认是 JSON 备份');
                return;
            }

            if (!Array.isArray(data)) {
                toast('文件格式不正确');
                return;
            }

            const records = data.map(normalize).filter(Boolean);
            if (!records.length) {
                toast('没有可导入的数据');
                return;
            }

            const r = mergeRecords(records);
            save();
            render();
            toast('导入完成：新增 ' + r.added + ' 条，更新 ' + r.updated + ' 条');
        };

        reader.onerror = function () { toast('读取文件失败'); };
        reader.readAsText(file);
    }

    /* ============ 隐藏功能：三连击标题加载远程备份 ============ */

    async function loadRemoteBackup() {
        if (restoring) return;
        restoring = true;
        toast('正在加载备份文件…');

        try {
            const res = await fetch(encodeURI(BACKUP_FILE), { cache: 'no-store' });

            if (!res.ok) throw new Error('HTTP ' + res.status);

            const data = await res.json();

            if (!Array.isArray(data)) throw new Error('bad format');

            const records = data.map(normalize).filter(Boolean);
            if (!records.length) {
                toast('备份文件中没有有效记录');
                return;
            }

            // 与现有记录合并，合并时忽略导入 id，并保持现有顺序
            const r = mergeRecords(records);
            save();
            render();
            toast('恢复完成：新增 ' + r.added + ' 条，更新 ' + r.updated + ' 条');
        } catch (err) {
            toast('加载备份失败，请确认同目录存在 ' + BACKUP_FILE);
        } finally {
            restoring = false;
        }
    }

    function bindTitleTripleTap() {
        const title = $('title');
        let count = 0;
        let timer = null;

        title.addEventListener('click', function () {
            count++;
            clearTimeout(timer);

            if (count >= 3) {
                count = 0;
                loadRemoteBackup();
                return;
            }

            timer = setTimeout(function () { count = 0; }, 700);
        });
    }

    /* ============ 事件绑定 ============ */

    function bind() {
        // 搜索
        $('search').addEventListener('input', function () {
            term = this.value;
            render();
        });

        // 添加 / 管理 / 主题
        $('add-btn').addEventListener('click', function () { openDialog(null); });
        $('manage-btn').addEventListener('click', toggleManage);
        $('theme-btn').addEventListener('click', toggleTheme);

        // 列表操作
        listEl.addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-act]');
            if (!btn || btn.disabled) return;

            const item = btn.closest('.item');
            if (!item) return;

            const id = item.dataset.id;

            if (btn.dataset.act === 'inc') increment(id);
            else if (btn.dataset.act === 'del') remove(id);
            else if (btn.dataset.act === 'edit') {
                const s = shows.find(function (x) { return x.id === id; });
                if (s) openDialog(s);
            }
        });

        // 拖动排序
        listEl.addEventListener('pointerdown', onPointerDown);
        document.addEventListener('pointermove', onPointerMove, { passive: false });
        document.addEventListener('pointerup', onPointerUp);
        document.addEventListener('pointercancel', onPointerUp);

        // 表单
        $('form').addEventListener('submit', submitForm);
        $('d-cancel').addEventListener('click', closeDialog);
        $('mask').addEventListener('click', function (e) {
            if (e.target === this) closeDialog();
        });

        // 确认框
        $('c-ok').addEventListener('click', function () { closeConfirm(true); });
        $('c-cancel').addEventListener('click', function () { closeConfirm(false); });
        $('confirm-mask').addEventListener('click', function (e) {
            if (e.target === this) closeConfirm(false);
        });

        // 导入导出
        $('export-btn').addEventListener('click', exportData);
        $('import-file').addEventListener('change', importFile);

        // 隐藏功能
        bindTitleTripleTap();

        // 键盘
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;

            if ($('confirm-mask').classList.contains('on')) {
                closeConfirm(false);
            } else if ($('mask').classList.contains('on')) {
                closeDialog();
            } else if (term) {
                $('search').value = '';
                term = '';
                render();
            }
        });
    }

    /* ============ 启动 ============ */

    initTheme();
    initManage();
    load();
    bind();
    render();
})();
</script>
</body>
</html>
