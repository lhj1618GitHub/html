<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>GitHub 版本检测 &amp; 下载</title>
<style>
:root{
  --bg:#0f1115; --surf:#171a21; --surf2:#1e232c; --surf3:#262c37;
  --text:#e8ecf3; --dim:#8f99a8; --bd:#2a303b;
  --accent:#4a9cff; --accent-h:#6aafff;
  --ok:#2ed573; --warn:#f5b83d; --danger:#ff5568;
  --grad:linear-gradient(135deg,#7cbcff,#4a9cff 45%,#9b8cff);
  --shadow:0 20px 55px rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f4f6fa; --surf:#ffffff; --surf2:#f2f4f8; --surf3:#e7ebf1;
  --text:#1a1f29; --dim:#667080; --bd:#dde2ea;
  --accent:#2b7fe0; --accent-h:#1f6ecd;
  --ok:#18a558; --warn:#c07a08; --danger:#e0243a;
  --grad:linear-gradient(135deg,#2b7fe0,#1f6ecd 45%,#7c3aed);
  --shadow:0 20px 55px rgba(15,25,45,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;color-scheme:dark;}
html[data-theme="light"]{color-scheme:light;}
body{
  font:15px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  max-width:980px;margin:0 auto;padding:16px 14px calc(36px + env(safe-area-inset-bottom));
  transition:background .25s,color .25s;
}
button,input{font:inherit;}
button{cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:99px;}

/* ---------- 头部 ---------- */
.hdr{position:relative;text-align:center;padding:2px 0 16px;}
.hdr h1{
  font-size:1.35rem;font-weight:700;letter-spacing:.01em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
.hdr p{color:var(--dim);font-size:.76rem;margin-top:4px;}
.hdr .tips{font-size:.72rem;color:var(--dim);opacity:.85;margin-top:2px;}
.hdr .tips b{color:var(--accent);font-weight:600;}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border:1px solid var(--bd);border-radius:10px;
  background:var(--surf2);color:var(--text);transition:.18s;
}
.icon-btn:hover{background:var(--surf3);}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.theme-btn{position:absolute;top:0;right:0;}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 14px;border:1px solid var(--bd);border-radius:10px;
  background:var(--surf2);color:var(--text);font-size:.85rem;font-weight:500;
  line-height:1.2;white-space:nowrap;user-select:none;transition:.18s;
}
.btn:hover:not(:disabled){background:var(--surf3);}
.btn:active:not(:disabled){transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h);}
.btn-danger{background:transparent;border-color:rgba(224,36,58,.35);color:var(--danger);}
.btn-danger:hover:not(:disabled){background:rgba(224,36,58,.1);border-color:var(--danger);}
.btn-danger-solid{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-danger-solid:hover:not(:disabled){opacity:.88;}
.btn-ghost{background:transparent;color:var(--dim);}
.btn-ghost:hover:not(:disabled){background:var(--surf3);color:var(--text);}
.btn-xs{padding:5px 9px;font-size:.75rem;border-radius:8px;}
.btn-on{background:rgba(74,156,255,.15);border-color:rgba(74,156,255,.5);color:var(--accent);}
.btn-on:hover:not(:disabled){background:rgba(74,156,255,.22);}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}

/* ---------- 添加面板 ---------- */
.panel{
  background:var(--surf);border:1px solid var(--bd);border-radius:12px;
  padding:12px;margin-bottom:12px;
}
.panel[hidden]{display:none;}
.panel form{display:flex;flex-wrap:wrap;gap:8px;}
.panel input{
  flex:1 1 200px;min-width:0;padding:9px 11px;
  border:1px solid var(--bd);border-radius:9px;background:var(--surf2);
  color:var(--text);font-size:.88rem;transition:.18s;
}
.panel input::placeholder{color:var(--dim);opacity:.7;}
.panel input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,156,255,.15);}
.panel-actions{display:flex;gap:7px;margin-left:auto;}

/* ---------- 列表 ---------- */
.meta{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin:0 2px 7px;font-size:.74rem;color:var(--dim);flex-wrap:wrap;
}
.meta b{color:var(--text);font-weight:600;}
.meta .hot{color:var(--danger);font-weight:600;}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;}
.head,.row{
  display:grid;
  grid-template-columns:minmax(0,1.6fr) 120px minmax(0,1fr) 160px 176px;
  gap:12px;align-items:center;
}
.head{padding:8px 14px;background:var(--surf2);color:var(--dim);font-size:.72rem;letter-spacing:.04em;}
.head>div:last-child{text-align:right;}
.row{padding:10px 14px;border-top:1px solid var(--bd);transition:background .15s;}
.row:hover{background:var(--surf2);}
.row.is-new{box-shadow:inset 3px 0 0 var(--danger);}
.ml{display:none;font-size:.68rem;color:var(--dim);flex:none;white-space:nowrap;}
.c-name{display:flex;align-items:center;min-width:0;}
.repo{
  color:var(--text);font-weight:600;font-size:.92rem;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.repo:hover{color:var(--accent);text-decoration:underline;}

/* 本地版本：管理模式为可点击按钮，否则为静态文本 */
.ver{
  background:none;border:none;padding:0;font:inherit;font-size:.86rem;
  color:var(--accent);border-bottom:1px dashed rgba(74,156,255,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;min-width:0;display:block;text-align:left;
}
.ver:hover:not(:disabled){color:var(--accent-h);}
.ver:disabled{color:var(--dim);border-color:transparent;cursor:not-allowed;}
.ver-static{
  display:block;font-size:.86rem;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;min-width:0;
}
.ver-static.empty{color:var(--dim);}

.c-local{display:flex;align-items:center;gap:6px;min-width:0;}
.c-latest{display:flex;flex-direction:column;align-items:flex-start;min-width:0;}
.ver-line{display:flex;align-items:center;min-width:0;max-width:100%;}
.vtag{
  background:none;border:none;padding:0;font:inherit;
  font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--text);cursor:pointer;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:100%;min-width:0;
  border-bottom:1px dashed transparent;transition:color .15s,border-color .15s;
  -webkit-tap-highlight-color:transparent;
}
.vtag:hover{color:var(--accent);border-bottom-color:rgba(74,156,255,.5);}
.pre-tag{
  display:inline-flex;align-items:center;flex:none;
  margin-left:6px;padding:1px 6px;border-radius:99px;
  font-size:.62rem;font-weight:600;line-height:1.5;
  color:var(--warn);background:rgba(245,184,61,.12);
  border:1px solid rgba(245,184,61,.35);white-space:nowrap;
}

/* 状态列：徽章 + 发布日期同行 */
.c-status{display:flex;align-items:center;gap:6px;min-width:0;}
.pub-date{
  font-size:.68rem;color:var(--dim);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

.badge{
  display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;
  font-size:.72rem;font-weight:600;white-space:nowrap;border:1px solid transparent;
  transition:background .15s,border-color .15s;flex:none;
}
.badge.pending{color:var(--dim);background:var(--surf3);border-color:var(--bd);}
.badge.checking{color:var(--accent);background:rgba(74,156,255,.12);border-color:rgba(74,156,255,.35);}
.badge.checking::before{
  content:'';width:6px;height:6px;margin-right:5px;border-radius:50%;
  border:2px solid currentColor;border-top-color:transparent;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.badge.new{color:var(--danger);background:rgba(255,85,104,.12);border-color:rgba(255,85,104,.35);}
.badge.latest{color:var(--ok);background:rgba(46,213,115,.12);border-color:rgba(46,213,115,.35);}
.badge.error{color:var(--warn);background:rgba(245,184,61,.12);border-color:rgba(245,184,61,.35);}

/* 可点击的「有新版本」徽章：点击即同步（带确认） */
.badge.clickable{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
.badge.clickable:hover{background:rgba(255,85,104,.25);border-color:var(--danger);}
.badge.clickable:active{transform:scale(.96);}

.c-acts{display:flex;gap:5px;justify-content:flex-end;}
.empty{padding:52px 20px;text-align:center;color:var(--dim);}
.empty .e{font-size:2rem;opacity:.6;}
.empty p{font-size:.85rem;margin-top:10px;}

/* ---------- 模态框 ---------- */
.modal{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(5,7,11,.7);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.modal.active{display:flex;}
.modal-box{
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:18px;background:var(--surf2);border:1px solid var(--bd);
  border-radius:16px;box-shadow:var(--shadow);
}
.modal.active .modal-box{animation:mbox-in .22s ease;}
@keyframes mbox-in{from{opacity:.5;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
.modal-box.sm{max-width:400px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.modal-head h2{font-size:1.02rem;font-weight:600;}
.close-x{
  width:28px;height:28px;flex:none;border:none;border-radius:8px;background:transparent;
  color:var(--dim);font-size:1.2rem;line-height:1;
}
.close-x:hover{background:var(--surf3);color:var(--text);}
.modal-text{color:var(--dim);font-size:.86rem;line-height:1.7;overflow-wrap:anywhere;}
.modal-sub{color:var(--dim);font-size:.76rem;margin-bottom:8px;overflow-wrap:anywhere;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap;}
.modal-foot .grow{margin-right:auto;}

/* ---------- 表单 ---------- */
.field{margin-bottom:12px;}
.field>label{display:block;margin-bottom:5px;font-size:.78rem;color:var(--dim);}
.field input{
  width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;
  background:var(--surf);color:var(--text);font-size:.9rem;transition:.18s;
}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,156,255,.15);}
.data-actions{display:flex;gap:8px;}
.data-actions .btn{flex:1;}

/* 开关行 */
.switch-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border:1px solid var(--bd);border-radius:9px;
  background:var(--surf);cursor:pointer;
}
.switch-row .sw-label{display:block;font-size:.84rem;color:var(--text);}
.switch-row .sw-desc{display:block;font-size:.7rem;color:var(--dim);margin-top:2px;line-height:1.5;}
.switch-row input[type="checkbox"]{
  width:18px;height:18px;flex:none;margin-left:12px;
  accent-color:var(--accent);cursor:pointer;
}

/* ---------- 文件列表 ---------- */
.sel-all{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.8rem;color:var(--dim);cursor:pointer;}
.sel-all input,.file-check{width:15px;height:15px;accent-color:var(--accent);flex:none;}
.file-list{
  max-height:42vh;overflow-y:auto;margin:4px 0;
  border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);
  -webkit-overflow-scrolling:touch;
}
.file-item{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--bd);}
.file-item:last-child{border-bottom:none;}
.file-label{display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer;}
.file-name{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:.82rem;direction:rtl;text-align:left;
}
.file-name bdi{direction:ltr;}

/* ---------- Toast ---------- */
.toasts{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;width:max-content;max-width:calc(100vw - 32px);
}
.toast{
  padding:9px 16px;border-radius:99px;background:var(--surf3);border:1px solid var(--bd);
  color:var(--text);font-size:.82rem;box-shadow:0 10px 30px rgba(0,0,0,.35);
  animation:tin .25s ease;transition:opacity .25s,transform .25s;text-align:center;max-width:100%;
}
.toast.success{border-color:rgba(46,213,115,.5);}
.toast.error{border-color:rgba(255,85,104,.5);}
@keyframes tin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

body.modal-open{overflow:hidden;}

/* ---------- 响应式 ---------- */
@media (max-width:820px){
  .head{display:none;}
  /* 本地版本 / 最新版本 同行，各占一半 */
  .row{
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:
      "name status"
      "local latest"
      "acts acts";
    gap:7px 10px;padding:11px 12px;
  }
  .c-name{grid-area:name;min-width:0;}
  .c-status{
    grid-area:status;justify-self:end;align-self:center;
    display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 6px;
  }
  .c-local{grid-area:local;display:flex;align-items:center;gap:6px;min-width:0;}
  .c-latest{
    grid-area:latest;display:flex;flex-direction:row;align-items:baseline;
    justify-self:stretch;gap:6px;min-width:0;
  }
  .c-acts{
    grid-area:acts;display:flex;gap:6px;padding-top:8px;
    border-top:1px dashed var(--bd);
  }
  .c-acts:empty{display:none;}
  .c-acts .btn{flex:1;padding:7px 4px;font-size:.78rem;}
  .ml{display:inline;}
  .repo{font-size:.95rem;}

  /* 版本号占满所在半列，超长省略 */
  .c-local .ver,
  .c-local .ver-static{flex:1 1 auto;min-width:0;max-width:100%;}
  .c-latest .ver-line{flex:1 1 auto;min-width:0;max-width:100%;}
  .c-latest .vtag{flex:1 1 auto;min-width:0;max-width:100%;}
  .pub-date{font-size:.64rem;}
}
@media (max-width:600px){
  body{padding:12px 10px 30px;}
  .hdr h1{font-size:1.18rem;}
  .hdr p{font-size:.72rem;}
  .hdr .tips{font-size:.68rem;}
  .btn{padding:8px 11px;font-size:.8rem;}
  .panel input{flex-basis:100%;}
  .panel-actions{width:100%;margin-left:0;}
  .panel-actions .btn{flex:1;}
  .modal{align-items:flex-end;padding:0;}
  .modal-box{
    max-width:100%;max-height:92vh;border-radius:18px 18px 0 0;border-bottom:none;
    padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  }
  .modal-foot .btn{flex:1;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}
</style>
</head>
<body>

<header class="hdr">
  <h1 id="title">GitHub 版本检测 &amp; 下载</h1>
  <p>追踪 Release 版本 · 一键对比与下载</p>
  <p class="tips">💡 点击 <b>仓库名</b> 新窗口打开 · 点击 <b>有新版本</b> 同步 · 点击 <b>版本号</b> 下载</p>
  <button class="icon-btn theme-btn" id="theme-btn" title="切换日夜模式" aria-label="切换日夜模式"></button>
</header>

<div class="toolbar">
  <button type="button" class="btn btn-primary" id="add-btn">＋ 添加</button>
  <button type="button" class="btn" id="check-btn">检测版本</button>
  <button type="button" class="btn" id="manage-btn">管理</button>
  <button type="button" class="btn" id="settings-btn">设置</button>
</div>

<section class="panel" id="add-panel" hidden>
  <form id="add-form" novalidate>
    <input type="text" id="add-url" placeholder="GitHub 仓库链接，如 https://github.com/owner/repo" autocomplete="off">
    <input type="text" id="add-ver" placeholder="本地版本（选填）" autocomplete="off">
    <div class="panel-actions">
      <button type="button" class="btn" id="add-cancel">取消</button>
      <button type="submit" class="btn btn-primary">确认添加</button>
    </div>
  </form>
</section>

<div class="meta">
  <span id="stats"></span>
</div>

<section class="card">
  <div class="head">
    <div>项目</div><div>本地版本</div><div>最新版本</div><div>状态</div><div>操作</div>
  </div>
  <div id="repo-list"></div>
</section>

<!-- 设置 -->
<div class="modal" id="settings-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>设置</h2>
      <button type="button" class="close-x" data-close aria-label="关闭">×</button>
    </div>

    <div class="field">
      <label>版本检测</label>
      <label class="switch-row">
        <span>
          <span class="sw-label">检测预览版本（Pre-release）</span>
          <span class="sw-desc">开启后同时检测预发布版本；关闭时仅检测正式版本</span>
        </span>
        <input type="checkbox" id="pre-toggle">
      </label>
    </div>

    <div class="field" style="margin-bottom:0">
      <label>数据管理</label>
      <div class="data-actions">
        <label class="btn" for="import-file">导入记录</label>
        <input type="file" id="import-file" accept=".json,.txt,application/json" hidden>
        <button type="button" class="btn" id="export-btn">导出记录</button>
      </div>
    </div>

    <div class="modal-foot">
      <button type="button" class="btn btn-primary" data-close>完成</button>
    </div>
  </div>
</div>

<!-- 编辑 -->
<div class="modal" id="edit-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>编辑项目</h2>
      <button type="button" class="close-x" data-close aria-label="关闭">×</button>
    </div>
    <form id="edit-form" novalidate>
      <div class="field">
        <label for="edit-url">GitHub 链接</label>
        <input type="text" id="edit-url" autocomplete="off" placeholder="https://github.com/owner/repo">
      </div>
      <div class="field">
        <label for="edit-ver">本地版本（可为空）</label>
        <input type="text" id="edit-ver" autocomplete="off" placeholder="例如 v1.2.3">
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" data-close>取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 确认 -->
<div class="modal" id="confirm-modal">
  <div class="modal-box sm">
    <div class="modal-head"><h2 id="confirm-title">确认</h2></div>
    <p class="modal-text" id="confirm-msg"></p>
    <div class="modal-foot">
      <button type="button" class="btn" id="confirm-cancel">取消</button>
      <button type="button" class="btn btn-danger-solid" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<!-- 下载 -->
<div class="modal" id="download-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2>下载文件</h2>
      <button type="button" class="close-x" data-close aria-label="关闭">×</button>
    </div>
    <p class="modal-sub" id="download-sub"></p>
    <label class="sel-all"><input type="checkbox" id="select-all"><span>全选</span></label>
    <div class="file-list" id="file-list"></div>
    <div class="modal-foot">
      <button type="button" class="btn" data-close>关闭</button>
      <button type="button" class="btn btn-primary" id="download-go">下载选中文件</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(function () {
'use strict';

/* ==================== 常量 ==================== */
const SK = 'github_version_list';
const PK = 'github_include_prerelease';
const THK = 'gh_theme';
const RESTORE_FILE = 'GitHub项目版本检测&下载.json';
const CLICK_TIMES = 3;
const CLICK_WINDOW = 1500;
const DELAY = 800;
const API_HEADERS = { 'Accept': 'application/vnd.github+json' };
const VER_MAX_CHARS = 12;

const STATUS = {
  '待检测':   ['pending',  '待检测'],
  '检测中':   ['checking', '检测中…'],
  '有新版本': ['new',      '有新版本'],
  '已是最新': ['latest',   '已是最新'],
  '检测失败': ['error',    '检测失败']
};

/* 列表排序优先级：有新版本置顶，已是最新沉底 */
const SORT_RANK = {
  '有新版本': 0,
  '检测失败': 1,
  '检测中':   2,
  '待检测':   3,
  '已是最新': 4
};

const SVG_SUN  = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>';
const SVG_MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

/* ==================== 状态 ==================== */
let list = [];
let includePrerelease = false;
let checking = false;
let restoring = false;
let manageMode = false;
let editIdx = -1;
let dlIdx = -1;
let confirmResolve = null;
let clickCount = 0;
let clickTimer = null;
const el = {};

/* ==================== 工具 ==================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* 版本号截断：超过 12 个字符（按 Unicode 字符计）以省略号结尾 */
function truncateVer(s, n) {
  const max = (typeof n === 'number' && n > 0) ? n : VER_MAX_CHARS;
  const arr = Array.from(String(s == null ? '' : s));
  if (arr.length <= max) return arr.join('');
  return arr.slice(0, max).join('') + '…';
}

function normalizeUrl(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s) return '';
  return /^https?:\/\//i.test(s) ? s : 'https://' + s;
}

function parseRepo(input) {
  let s = String(input == null ? '' : input).trim();
  if (!s) return null;
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try {
    const u = new URL(s);
    if (!/(^|\.)github\.com$/i.test(u.hostname)) return null;
    const seg = u.pathname.split('/').filter(Boolean);
    if (seg.length < 2) return null;
    const owner = decodeURIComponent(seg[0]);
    const repo = decodeURIComponent(seg[1]).replace(/\.git$/i, '');
    return (owner && repo) ? { owner, repo } : null;
  } catch (e) { return null; }
}

const repoKey  = u => { const p = parseRepo(u); return p ? (p.owner + '/' + p.repo).toLowerCase() : ''; };
const repoName = u => { const p = parseRepo(u); return p ? p.owner + '/' + p.repo : '未知项目'; };
const relUrl   = u => { const p = parseRepo(u); return p ? 'https://github.com/' + p.owner + '/' + p.repo + '/releases' : ''; };
const fmtDate  = iso => (typeof iso === 'string' && iso.length >= 10) ? iso.slice(0, 10) : '';
const sleep    = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, type) {
  const n = document.createElement('div');
  n.className = 'toast' + (type ? ' ' + type : '');
  n.textContent = msg;
  el.toasts.appendChild(n);
  setTimeout(() => {
    n.style.opacity = '0';
    n.style.transform = 'translateY(8px)';
    setTimeout(() => n.remove(), 260);
  }, 2400);
}

function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}

/* 在新窗口/标签页安全打开链接（兼容 app 内 webview） */
function openInNewTab(url) {
  if (!url) return;
  const win = window.open(url, '_blank', 'noopener,noreferrer');
  if (win) {
    try { win.opener = null; } catch (e) {}
  }
}

/* ==================== 主题 ==================== */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THK, t); } catch (e) {}
  if (el.themeBtn) el.themeBtn.innerHTML = (t === 'light') ? SVG_MOON : SVG_SUN;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = (t === 'light') ? '#f4f6fa' : '#0f1115';
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THK); } catch (e) {}
  if (!saved) {
    const light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    saved = light ? 'light' : 'dark';
  }
  applyTheme(saved);
}

/* ==================== 预览版本偏好 ==================== */
function loadPrereleasePref() {
  try { includePrerelease = localStorage.getItem(PK) === '1'; }
  catch (e) { includePrerelease = false; }
  if (el.preToggle) el.preToggle.checked = includePrerelease;
}

function savePrereleasePref() {
  try { localStorage.setItem(PK, includePrerelease ? '1' : '0'); } catch (e) {}
}

/* ==================== 数据层 ==================== */
function normalizeRecord(raw) {
  const assets = Array.isArray(raw.assets)
    ? raw.assets
        .filter(a => a && typeof a.name === 'string' && typeof a.url === 'string')
        .map(a => ({ name: a.name, url: a.url }))
    : [];

  let status = '待检测';
  if (raw.status === '有新版本') status = '有新版本';
  else if (raw.status === '已是最新') status = '已是最新';
  else if (typeof raw.status === 'string' && raw.status.indexOf('失败') !== -1) status = '检测失败';

  return {
    url: normalizeUrl(raw.url),
    localVersion: typeof raw.localVersion === 'string' ? raw.localVersion.trim() : '',
    latestVersion: typeof raw.latestVersion === 'string' ? raw.latestVersion : '',
    publishTime: typeof raw.publishTime === 'string' ? raw.publishTime : '',
    prerelease: raw.prerelease === true,
    status,
    error: typeof raw.error === 'string' ? raw.error : '',
    assets
  };
}

function loadData() {
  try {
    const raw = JSON.parse(localStorage.getItem(SK) || '[]');
    if (!Array.isArray(raw)) return [];
    return raw
      .filter(it => it && typeof it === 'object' && typeof it.url === 'string' && parseRepo(it.url))
      .map(normalizeRecord);
  } catch (e) { return []; }
}

function saveData() {
  try { localStorage.setItem(SK, JSON.stringify(list)); }
  catch (e) { toast('保存失败，本地存储可能已满', 'error'); }
}

function refreshStatus(it) {
  if (!it.latestVersion) { it.status = '待检测'; return; }
  it.status = (it.localVersion && it.localVersion === it.latestVersion) ? '已是最新' : '有新版本';
}

function mergeRecords(data) {
  const res = { added: 0, skipped: 0, invalid: 0 };
  if (!Array.isArray(data)) return res;

  data.forEach(raw => {
    if (!raw || typeof raw !== 'object' || typeof raw.url !== 'string') { res.invalid++; return; }
    const url = normalizeUrl(raw.url);
    if (!parseRepo(url)) { res.invalid++; return; }

    const key = repoKey(url);
    if (list.some(it => repoKey(it.url) === key)) { res.skipped++; return; }

    const rec = normalizeRecord(raw);
    rec.url = url;
    rec.error = '';
    refreshStatus(rec);
    list.push(rec);
    res.added++;
  });

  return res;
}

function mergeMsg(prefix, r) {
  let m = prefix + '：新增 ' + r.added + ' 个';
  if (r.skipped) m += '，跳过重复 ' + r.skipped + ' 个';
  if (r.invalid) m += '，忽略无效 ' + r.invalid + ' 个';
  return m;
}

/* ==================== 隐藏功能：三连击标题恢复存档 ==================== */
function archiveUrl() {
  const base = location.href.split('#')[0].split('?')[0];
  return base.slice(0, base.lastIndexOf('/') + 1) + encodeURIComponent(RESTORE_FILE);
}

async function restoreArchive() {
  if (checking || restoring) { toast('正在处理中，请稍后再试', 'error'); return; }
  restoring = true;
  const tip = toast('正在加载仓库存档…');

  try {
    const res = await fetch(archiveUrl(), { cache: 'no-store' });
    if (!res.ok) {
      throw new Error(res.status === 404
        ? '仓库目录下未找到 ' + RESTORE_FILE
        : '请求失败（HTTP ' + res.status + '）');
    }

    let data;
    try { data = JSON.parse(await res.text()); }
    catch (e) { throw new Error('存档不是有效的 JSON'); }

    if (data && !Array.isArray(data) && typeof data === 'object') {
      data = data.repos || data.list || data.items || data.records || data.data || null;
    }
    if (!Array.isArray(data)) throw new Error('存档内容不是项目数组');

    const r = mergeRecords(data);
    saveData();
    render();
    toast(mergeMsg('存档已恢复', r), r.added ? 'success' : 'error');
  } catch (err) {
    toast('存档加载失败：' + ((err && err.message) || '未知错误'), 'error');
  } finally {
    restoring = false;
    if (tip) tip.remove();
  }
}

function onTitleClick() {
  clickCount++;
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }

  if (clickCount >= CLICK_TIMES) {
    clickCount = 0;
    restoreArchive();
    return;
  }
  clickTimer = setTimeout(() => { clickCount = 0; clickTimer = null; }, CLICK_WINDOW);
}

/* ==================== 管理模式 ==================== */
function toggleManage() {
  manageMode = !manageMode;
  el.manageBtn.classList.toggle('btn-on', manageMode);
  el.manageBtn.textContent = manageMode ? '完成' : '管理';
  render();
}

/* ==================== 渲染 ==================== */
function rowHtml(it, i) {
  const meta = STATUS[it.status] || STATUS['待检测'];
  const dis = checking ? ' disabled' : '';
  const tip = it.error ? ' title="' + esc(it.error) + '"' : '';
  const dlTip = it.assets.length
    ? '点击下载（' + it.assets.length + ' 个文件）'
    : '点击检测版本后可下载';

  /* 「有新版本」徽章可点击，点击弹确认框同步 */
  const isNew = it.status === '有新版本';
  const badgeAct = isNew ? ' data-act="sync" data-i="' + i + '"' : '';
  const badgeCls = isNew ? ' clickable' : '';
  const badgeTip = isNew ? ' title="点击同步为最新版本"' : '';

  /* 发布日期：仅在「已是最新 / 有新版本」时显示在徽章旁 */
  const showDate = (it.status === '已是最新' || it.status === '有新版本') && !!it.publishTime;
  const dateHtml = showDate
    ? '<span class="pub-date" title="发布日期">' + esc(it.publishTime) + '</span>'
    : '';

  /* 预览版本标签 */
  const preTag = it.prerelease
    ? '<span class="pre-tag" title="预发布版本（Pre-release）">预览</span>'
    : '';

  /* 本地版本：显示截断后的文本，完整版本放在 title */
  const localFull = it.localVersion || '';
  const localText = localFull ? esc(truncateVer(localFull)) : '未填写';
  const localTitle = localFull ? ' title="' + esc(localFull) + '"' : '';
  const localHtml = manageMode
    ? '<button type="button" class="ver" data-act="edit" data-i="' + i + '"' +
        ' title="点击编辑本地版本' + (localFull ? '：' + esc(localFull) : '') + '"' + dis + '>' +
        localText +
      '</button>'
    : '<span class="ver-static' + (localFull ? '' : ' empty') + '"' + localTitle + '>' + localText + '</span>';

  /* 最新版本：显示截断后的文本，完整版本放在 title */
  const latestFull = it.latestVersion || '';
  const latestText = latestFull ? esc(truncateVer(latestFull)) : '—';
  const latestTitle = (latestFull ? '完整版本：' + latestFull + ' · ' : '') + dlTip;

  /* 删除按钮仅在管理模式下出现 */
  const delBtn = manageMode
    ? '<button type="button" class="btn btn-xs btn-danger" data-act="del" data-i="' + i + '"' + dis + '>删除</button>'
    : '';

  return '<div class="row' + (isNew ? ' is-new' : '') + '">' +
    '<div class="c-name">' +
      '<a class="repo" href="' + esc(relUrl(it.url)) + '" target="_blank" rel="noopener noreferrer" title="在新窗口打开 Releases 页面">' + esc(repoName(it.url)) + '</a>' +
    '</div>' +
    '<div class="c-local">' +
      '<span class="ml">本地</span>' +
      localHtml +
    '</div>' +
    '<div class="c-latest">' +
      '<span class="ml">下载最新</span>' +
      '<span class="ver-line">' +
        '<button type="button" class="vtag" data-act="download" data-i="' + i + '" title="' + esc(latestTitle) + '">' +
          latestText +
        '</button>' +
        preTag +
      '</span>' +
    '</div>' +
    '<div class="c-status">' +
      '<span class="badge ' + meta[0] + badgeCls + '"' + tip + badgeTip + badgeAct + '>' + meta[1] + '</span>' +
      dateHtml +
    '</div>' +
    '<div class="c-acts">' + delBtn + '</div>' +
  '</div>';
}

/* 按状态优先级排序（稳定：同状态保持原有顺序） */
function sortedEntries() {
  return list
    .map((it, i) => ({ it, i }))
    .sort((a, b) => {
      const ra = SORT_RANK[a.it.status] != null ? SORT_RANK[a.it.status] : 9;
      const rb = SORT_RANK[b.it.status] != null ? SORT_RANK[b.it.status] : 9;
      return ra !== rb ? ra - rb : a.i - b.i;
    });
}

function render() {
  if (!list.length) {
    el.repoList.innerHTML = '<div class="empty"><div class="e">📦</div><p>还没有项目，点击「添加」开始追踪</p></div>';
    el.stats.textContent = '';
    return;
  }

  el.repoList.innerHTML = sortedEntries()
    .map(({ it, i }) => rowHtml(it, i))
    .join('');

  const news = list.filter(it => it.status === '有新版本').length;
  el.stats.innerHTML = '共 ' + list.length + ' 个项目' +
    (news ? ' · <span class="hot">' + news + ' 个有新版本</span>' : '');
}

/* ==================== 模态框 ==================== */
function syncLock() {
  document.body.classList.toggle('modal-open', !!document.querySelector('.modal.active'));
}

function openModal(m) { m.classList.add('active'); syncLock(); }

function closeModal(m) {
  if (!m) return;
  m.classList.remove('active');
  if (m === el.editModal) editIdx = -1;
  if (m === el.dlModal) {
    dlIdx = -1;
    el.fileList.innerHTML = '';
    el.selectAll.checked = false;
  }
  syncLock();
}

function confirmDialog(opts) {
  el.confirmTitle.textContent = opts.title || '确认';
  el.confirmMsg.textContent = opts.message || '';
  el.confirmOk.textContent = opts.okText || '确定';
  openModal(el.confirmModal);
  return new Promise(resolve => { confirmResolve = resolve; });
}

function settleConfirm(val) {
  const r = confirmResolve;
  confirmResolve = null;
  el.confirmModal.classList.remove('active');
  syncLock();
  if (r) r(val);
}

/* ==================== 添加 / 编辑 ==================== */
function closeAdd() {
  el.addPanel.hidden = true;
  el.addForm.reset();
}

function handleAdd(e) {
  e.preventDefault();
  const url = normalizeUrl(el.addUrl.value);
  if (!parseRepo(url)) { toast('请输入有效的 GitHub 仓库链接', 'error'); el.addUrl.focus(); return; }
  if (list.some(it => repoKey(it.url) === repoKey(url))) { toast('该项目已在列表中', 'error'); return; }

  list.push({
    url,
    localVersion: el.addVer.value.trim(),
    latestVersion: '',
    publishTime: '',
    prerelease: false,
    status: '待检测',
    error: '',
    assets: []
  });

  saveData();
  render();
  closeAdd();
  toast('已添加项目', 'success');
}

/* 仅在管理模式下允许编辑 */
function openEdit(i) {
  if (checking || !manageMode) return;
  const it = list[i];
  if (!it) return;
  editIdx = i;
  el.editUrl.value = it.url;
  el.editVer.value = it.localVersion;
  openModal(el.editModal);
  setTimeout(() => el.editUrl.focus(), 60);
}

function handleEdit(e) {
  e.preventDefault();
  if (editIdx < 0 || editIdx >= list.length) { closeModal(el.editModal); return; }

  const url = normalizeUrl(el.editUrl.value);
  if (!parseRepo(url)) { toast('请输入有效的 GitHub 仓库链接', 'error'); el.editUrl.focus(); return; }

  const key = repoKey(url);
  if (list.some((it, idx) => idx !== editIdx && repoKey(it.url) === key)) {
    toast('该链接已存在于其他项目中', 'error');
    return;
  }

  const it = list[editIdx];
  const changed = repoKey(it.url) !== key;
  it.url = url;
  it.localVersion = el.editVer.value.trim();

  if (changed) {
    it.latestVersion = '';
    it.publishTime = '';
    it.prerelease = false;
    it.assets = [];
    it.error = '';
    it.status = '待检测';
  } else {
    refreshStatus(it);
  }

  saveData();
  render();
  closeModal(el.editModal);
  toast('已保存', 'success');
}

/* ==================== 列表操作 ==================== */
/* 同步带确认：点击「有新版本」徽章 → 确认框 → 确认后才写入 */
function syncVersion(i) {
  if (checking) return;
  const it = list[i];
  if (!it) return;
  if (!it.latestVersion) { toast('请先检测版本', 'error'); return; }
  if (it.localVersion === it.latestVersion) { toast('当前已是最新版本'); return; }

  const targetVer = it.latestVersion;
  confirmDialog({
    title: '同步本地版本',
    message: '确定将「' + repoName(it.url) + '」的本地版本同步为 ' + targetVer + ' 吗？',
    okText: '同步'
  }).then(ok => {
    if (!ok) return;
    if (!it.latestVersion || it.localVersion === it.latestVersion) {
      toast('数据已变化，请重试', 'error');
      return;
    }
    it.localVersion = it.latestVersion;
    refreshStatus(it);
    saveData();
    render();
    toast('已同步为最新版本', 'success');
  });
}

function deleteItem(i) {
  if (checking || !manageMode) return;
  const it = list[i];
  if (!it) return;

  confirmDialog({
    title: '删除项目',
    message: '确定删除「' + repoName(it.url) + '」吗？该操作无法撤销。',
    okText: '删除'
  }).then(ok => {
    if (!ok) return;
    list.splice(i, 1);
    saveData();
    render();
    toast('已删除', 'success');
  });
}

function handleListClick(e) {
  if (checking) return;
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const i = parseInt(btn.dataset.i, 10);
  if (!(i >= 0 && i < list.length)) return;

  switch (btn.dataset.act) {
    case 'edit':
      if (!manageMode) return;
      openEdit(i);
      break;
    case 'download': openDownload(i); break;
    case 'sync':     syncVersion(i); break;
    case 'del':
      if (!manageMode) return;
      deleteItem(i);
      break;
  }
}

/* 仓库名点击 → 新窗口/标签页打开（window.open 兜底） */
function handleRepoLinkClick(e) {
  const a = e.target.closest('a.repo');
  if (!a) return;
  /* 修饰键点击保留浏览器默认行为（新标签页/新窗口） */
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;

  const url = a.getAttribute('href');
  if (!url) return;

  e.preventDefault();
  openInNewTab(url);
}

/* ==================== 版本检测 ==================== */
function setCheckBtn(text, disabled) {
  el.checkBtn.textContent = text;
  el.checkBtn.disabled = disabled;
}

async function checkAll() {
  if (checking) return;
  if (!list.length) { toast('暂无需要检测的项目', 'error'); return; }

  closeAdd();
  checking = true;
  setCheckBtn('检测中 0/' + list.length, true);
  render();

  const total = list.length;
  let done = 0, failed = 0, limited = false;

  try {
    for (let i = 0; i < total; i++) {
      const it = list[i];
      it.status = '检测中';
      it.error = '';
      render();

      try {
        const p = parseRepo(it.url);
        if (!p) throw new Error('链接解析失败');

        const base = 'https://api.github.com/repos/' + p.owner + '/' + p.repo;
        const url = includePrerelease
          ? base + '/releases?per_page=30'
          : base + '/releases/latest';

        const res = await fetch(url, { headers: API_HEADERS });

        if (!res.ok) {
          if (res.status === 404) {
            throw new Error(includePrerelease
              ? '未找到 Release'
              : '未找到 Release（可能仅有预览版本，可在设置中开启预览检测）');
          }
          if (res.status === 403 || res.status === 429) {
            limited = true;
            throw new Error('API 限流，请稍后再试（每小时 60 次）');
          }
          throw new Error('请求失败（HTTP ' + res.status + '）');
        }

        let data;
        if (includePrerelease) {
          const arr = await res.json();
          if (!Array.isArray(arr) || !arr.length) throw new Error('未找到 Release');
          data = null;
          for (let k = 0; k < arr.length; k++) {
            if (arr[k] && !arr[k].draft) { data = arr[k]; break; }
          }
          if (!data) throw new Error('未找到 Release');
        } else {
          data = await res.json();
        }

        it.latestVersion = data.tag_name || '';
        it.publishTime = fmtDate(data.published_at);
        it.prerelease = !!data.prerelease;
        it.assets = Array.isArray(data.assets)
          ? data.assets
              .map(a => ({
                name: a && a.name ? a.name : '',
                url: a && a.browser_download_url ? a.browser_download_url : ''
              }))
              .filter(a => a.name && a.url)
          : [];
        it.error = '';
        refreshStatus(it);
      } catch (err) {
        it.status = '检测失败';
        it.error = (err && err.message) || '未知错误';
        failed++;
      }

      done++;
      saveData();
      render();
      setCheckBtn('检测中 ' + done + '/' + total, true);

      if (i < total - 1) await sleep(DELAY);
    }

    if (limited) {
      toast('部分项目因 API 限流失败，请稍后再试', 'error');
    } else if (failed) {
      toast('检测完成，' + failed + ' 个失败', 'error');
    } else {
      toast('版本检测完成', 'success');
    }
  } finally {
    checking = false;
    setCheckBtn('检测版本', false);
    render();
  }
}

/* ==================== 下载 ==================== */
function openDownload(i) {
  if (checking) return;
  const it = list[i];
  if (!it) return;
  if (!it.assets || !it.assets.length) { toast('暂无可下载文件，请先检测版本', 'error'); return; }

  dlIdx = i;
  el.downloadSub.textContent = repoName(it.url) + (it.latestVersion ? ' · ' + it.latestVersion : '');
  el.fileList.innerHTML = it.assets.map((f, idx) =>
    '<div class="file-item">' +
      '<label class="file-label">' +
        '<input type="checkbox" class="file-check" value="' + idx + '">' +
        '<span class="file-name" title="' + esc(f.name) + '"><bdi>' + esc(f.name) + '</bdi></span>' +
      '</label>' +
      '<button type="button" class="btn btn-xs btn-ghost copy-file" data-idx="' + idx + '">复制</button>' +
    '</div>'
  ).join('');

  el.selectAll.checked = false;
  openModal(el.dlModal);
}

function copyAsset(idx) {
  const it = list[dlIdx];
  if (!it || !it.assets[idx]) return;
  copyText(it.assets[idx].url).then(ok => toast(ok ? '下载链接已复制' : '复制失败，请手动复制', ok ? 'success' : 'error'));
}

function batchDownload() {
  const it = list[dlIdx];
  if (!it) return;

  const boxes = Array.prototype.slice.call(el.fileList.querySelectorAll('.file-check:checked'));
  if (!boxes.length) { toast('请至少选择一个文件', 'error'); return; }

  boxes.forEach(cb => {
    const f = it.assets[parseInt(cb.value, 10)];
    if (!f) return;
    const a = document.createElement('a');
    a.href = f.url;
    a.download = f.name || '';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  toast('已开始下载 ' + boxes.length + ' 个文件');
}

/* ==================== 导入 / 导出 ==================== */
function exportData() {
  if (!list.length) { toast('暂无数据可导出', 'error'); return; }

  const data = list.map(it => ({ url: it.url, localVersion: it.localVersion || '' }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });

  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const name = 'github_repos_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
    '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  toast('已导出 ' + data.length + ' 个项目', 'success');
}

function importFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    let data;
    try { data = JSON.parse(ev.target.result); }
    catch (err) { toast('文件格式错误，无法解析 JSON', 'error'); return; }
    if (!Array.isArray(data)) { toast('文件内容不是有效的项目数组', 'error'); return; }

    const r = mergeRecords(data);
    saveData();
    render();
    toast(mergeMsg('导入完成', r), r.added ? 'success' : 'error');
  };
  reader.onerror = () => toast('读取文件失败', 'error');
  reader.readAsText(file, 'UTF-8');
}

/* ==================== 设置 ==================== */
function openSettings() {
  if (checking) return;
  if (el.preToggle) el.preToggle.checked = includePrerelease;
  openModal(el.setModal);
}

/* ==================== 事件绑定 ==================== */
function bindEvents() {
  el.title.addEventListener('click', onTitleClick);

  el.themeBtn.addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  });

  el.addBtn.addEventListener('click', () => {
    const show = el.addPanel.hidden;
    el.addPanel.hidden = !show;
    if (show) el.addUrl.focus(); else el.addForm.reset();
  });
  el.addCancel.addEventListener('click', closeAdd);
  el.addForm.addEventListener('submit', handleAdd);

  el.checkBtn.addEventListener('click', checkAll);
  el.manageBtn.addEventListener('click', toggleManage);

  /* 列表点击：仓库名新窗口打开 + 操作按钮 */
  el.repoList.addEventListener('click', handleRepoLinkClick);
  el.repoList.addEventListener('click', handleListClick);

  el.settingsBtn.addEventListener('click', openSettings);
  el.exportBtn.addEventListener('click', exportData);
  el.importFile.addEventListener('change', importFile);

  if (el.preToggle) {
    el.preToggle.addEventListener('change', () => {
      includePrerelease = el.preToggle.checked;
      savePrereleasePref();
      toast(includePrerelease ? '已开启预览版本检测' : '已关闭预览版本检测', 'success');
    });
  }

  el.editForm.addEventListener('submit', handleEdit);

  el.confirmOk.addEventListener('click', () => settleConfirm(true));
  el.confirmCancel.addEventListener('click', () => settleConfirm(false));
  el.confirmModal.addEventListener('click', e => { if (e.target === el.confirmModal) settleConfirm(false); });

  el.fileList.addEventListener('click', e => {
    const b = e.target.closest('.copy-file');
    if (b) copyAsset(parseInt(b.dataset.idx, 10));
  });
  el.fileList.addEventListener('change', e => {
    if (!e.target.classList.contains('file-check')) return;
    const all = el.fileList.querySelectorAll('.file-check');
    const checked = el.fileList.querySelectorAll('.file-check:checked');
    el.selectAll.checked = all.length > 0 && all.length === checked.length;
  });
  el.selectAll.addEventListener('change', () => {
    const on = el.selectAll.checked;
    el.fileList.querySelectorAll('.file-check').forEach(cb => { cb.checked = on; });
  });
  el.downloadGo.addEventListener('click', batchDownload);

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => closeModal(btn.closest('.modal')));
  });
  [el.setModal, el.editModal, el.dlModal].forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) closeModal(m); });
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (el.confirmModal.classList.contains('active')) { settleConfirm(false); return; }
    const act = document.querySelector('.modal.active');
    if (act) { closeModal(act); return; }
    if (!el.addPanel.hidden) closeAdd();
  });
}

/* ==================== 初始化 ==================== */
function cacheEls() {
  const map = {
    'title':'title','theme-btn':'themeBtn','add-btn':'addBtn','check-btn':'checkBtn',
    'manage-btn':'manageBtn','settings-btn':'settingsBtn',
    'add-panel':'addPanel','add-form':'addForm','add-url':'addUrl','add-ver':'addVer',
    'add-cancel':'addCancel','stats':'stats','repo-list':'repoList',
    'settings-modal':'setModal','pre-toggle':'preToggle',
    'export-btn':'exportBtn','import-file':'importFile',
    'edit-modal':'editModal','edit-form':'editForm',
    'edit-url':'editUrl','edit-ver':'editVer','confirm-modal':'confirmModal',
    'confirm-title':'confirmTitle','confirm-msg':'confirmMsg','confirm-ok':'confirmOk',
    'confirm-cancel':'confirmCancel','download-modal':'dlModal','download-sub':'downloadSub',
    'select-all':'selectAll','file-list':'fileList','download-go':'downloadGo','toasts':'toasts'
  };
  Object.keys(map).forEach(id => { el[map[id]] = document.getElementById(id); });
}

function init() {
  cacheEls();
  initTheme();
  loadPrereleasePref();
  list = loadData();
  bindEvents();
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>
