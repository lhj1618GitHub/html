<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>JSON / JSON5 格式化工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #121212;
    --panel: #1e1e1e;
    --btn-bg: #262626;
    --border: #333;
    --text: #e0e0e0;
    --dim: #8b8b8b;
    --accent: #3498db;
    --ok: #4caf50;
    --err: #ff6b6b;
    --btn-h: 30px;
  }

  :root[data-theme="light"] {
    --bg: #eef1f5;
    --panel: #ffffff;
    --btn-bg: #f3f5f8;
    --border: #d7dce3;
    --text: #1f2328;
    --dim: #6b7280;
    --accent: #2f80ed;
    --ok: #1a7f37;
    --err: #d1242f;
  }

  html, body { height: 100%; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    font-size: 13px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* ================= 顶部工具条 ================= */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }

  .tb-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1 1 auto;
    min-width: 0;
  }

  .title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: .2px;
  }

  .status {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
  }
  .status.ok  { color: var(--ok); }
  .status.err { color: var(--err); cursor: pointer; }

  .actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .group + .group {
    padding-left: 6px;
    border-left: 1px solid var(--border);
  }

  button, .file-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: var(--btn-h);
    padding: 0 10px;
    font-family: inherit;
    font-size: 12.5px;
    line-height: 1;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover, .file-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button:active, .file-btn:active { transform: translateY(1px); }
  button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .icon-btn { padding: 0 9px; font-size: 14px; }
  .file-btn input { display: none; }

  /* ================= 搜索栏 ================= */
  .searchbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .searchbar[hidden] { display: none; }

  .searchbar input {
    flex: 1 1 auto;
    min-width: 60px;
    min-height: 28px;
    padding: 4px 8px;
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .searchbar input:focus { border-color: var(--accent); }
  .searchbar input::-webkit-search-cancel-button { display: none; }

  .search-count {
    min-width: 62px;
    text-align: center;
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .searchbar button {
    min-height: 28px;
    padding: 0 8px;
  }

  /* ================= 编辑区 ================= */
  .editor-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    padding: 8px 10px;
  }

  #editor {
    flex: 1;
    width: 100%;
    resize: none;
    padding: 10px 12px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Consolas, "SF Mono", Monaco, Menlo, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.55;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
    outline: none;
    -webkit-overflow-scrolling: touch;
    touch-action: manipulation;
  }
  #editor:focus { border-color: var(--accent); }
  #editor::placeholder { color: var(--dim); }

  /* ================= 底部状态栏 ================= */
  .statusbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 3px 12px 6px;
    font-size: 11px;
    color: var(--dim);
  }

  /* ================= 移动端适配 ================= */
  @media (max-width: 760px) {
    :root { --btn-h: 36px; }

    .toolbar {
      gap: 6px;
      padding: 6px 8px;
      padding-top: max(6px, env(safe-area-inset-top));
    }

    .title { display: none; }

    .tb-info { flex: 1 1 100%; }
    .status { font-size: 12px; }

    .actions {
      flex: 1 1 100%;
      gap: 5px;
    }

    .group { gap: 5px; }
    .group + .group {
      padding-left: 0;
      border-left: none;
      margin-left: 0;
    }

    button, .file-btn {
      flex: 0 0 auto;
      padding: 0 11px;
      font-size: 13px;
      border-radius: 7px;
    }
    .icon-btn { padding: 0 11px; font-size: 15px; }

    .editor-wrap { padding: 6px 8px; }

    #editor {
      font-size: 16px;          /* 防止移动端聚焦时自动放大 */
      line-height: 1.5;
      padding: 10px;
      border-radius: 7px;
    }

    .searchbar {
      padding: 6px 8px;
      gap: 5px;
      flex-wrap: wrap;
    }
    .searchbar input {
      flex: 1 1 100%;
      min-height: 36px;
      font-size: 16px;          /* 防止聚焦缩放 */
      margin-bottom: 1px;
    }
    .search-count {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
      font-size: 11.5px;
    }
    .searchbar button {
      min-width: 38px;
      min-height: 34px;
      font-size: 13px;
    }

    .statusbar {
      padding: 2px 10px 5px;
      padding-bottom: max(5px, env(safe-area-inset-bottom));
      font-size: 10.5px;
    }
  }

  @media (max-width: 380px) {
    button, .file-btn {
      padding: 0 9px;
      font-size: 12.5px;
    }
    .icon-btn { padding: 0 9px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="toolbar">
    <div class="tb-info">
      <span class="title">JSON / JSON5</span>
      <span class="status" id="status">等待输入…</span>
    </div>

    <div class="actions">
      <div class="group">
        <label class="file-btn" title="导入本地文件">导入<input type="file" id="fileInput"></label>
        <button id="btnJson"   title="格式化为JSON">→JSON</button>
        <button id="btnJson5"  title="格式化为JSON5">→JSON5</button>
        <button id="btnToggle" title="紧凑/展开">紧⇋展</button>
      </div>
      <div class="group">
        <button id="btnCopy"     title="复制全部内容">复制</button>
        <button id="btnDownload" title="下载为文件">💾下载</button>
        <button id="btnClear"    title="清空编辑器">🧹清空</button>
      </div>
      <div class="group">
        <button id="btnSearch" class="icon-btn" title="搜索 (Ctrl+F)">🔍</button>
        <button id="btnTheme"  class="icon-btn" title="切换主题">🌙</button>
      </div>
    </div>
  </header>

  <div class="searchbar" id="searchBar" hidden>
    <input id="searchInput" type="search" enterkeyhint="search"
           placeholder="输入关键词，Enter 定位，F3 切换…">
    <span class="search-count" id="searchCount">—</span>
    <button id="prevBtn" type="button" title="上一处 (Shift+F3)">▲</button>
    <button id="nextBtn" type="button" title="下一处 (F3)">▼</button>
    <button id="closeSearch" type="button" title="关闭 (Esc)">✕</button>
  </div>

  <div class="editor-wrap">
    <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
      placeholder="粘贴或输入 JSON / JSON5 内容，实时校验语法…"></textarea>
  </div>

  <footer class="statusbar">
    <span id="cursor">行 1，列 1</span>
    <span id="meta">0 字符 · 0 行</span>
  </footer>

</div>

<script src="https://unpkg.com/json5@2/dist/index.min.js"></script>
<script>
(function () {
  'use strict';

  /* ================= 元素引用 ================= */
  var editor     = document.getElementById('editor');
  var statusEl   = document.getElementById('status');
  var cursorEl   = document.getElementById('cursor');
  var metaEl     = document.getElementById('meta');
  var themeBtn   = document.getElementById('btnTheme');
  var fileInput  = document.getElementById('fileInput');

  var searchBar   = document.getElementById('searchBar');
  var searchInput = document.getElementById('searchInput');
  var searchCount = document.getElementById('searchCount');
  var btnSearch   = document.getElementById('btnSearch');

  var checkTimer  = null;
  var statusTimer = null;
  var lastError   = null;

  /* ================= 主题 ================= */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    themeBtn.title = theme === 'dark' ? '切换到日间主题' : '切换到夜间主题';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#121212' : '#ffffff');
    try { localStorage.setItem('jt-theme', theme); } catch (e) {}
  }

  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem('jt-theme'); } catch (e) {}
    if (!saved) {
      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
        ? 'light' : 'dark';
    }
    applyTheme(saved);
  })();

  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  /* ================= 状态栏 ================= */
  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (type ? ' ' + type : '');
    statusEl.title = msg;
    clearTimeout(statusTimer);
    statusTimer = null;
  }

  function flash(msg, type) {
    setStatus(msg, type);
    statusTimer = setTimeout(function () {
      statusTimer = null;
      checkSyntax();
    }, 2000);
  }

  /* ================= 实时语法校验 ================= */
  function checkSyntax() {
    var text = editor.value;

    if (!text.trim()) {
      lastError = null;
      setStatus('等待输入…', '');
      return;
    }

    try {
      JSON5.parse(text);
      lastError = null;
      setStatus('✅ 语法有效', 'ok');
    } catch (err) {
      var raw = String((err && err.message) || err);
      var m = /at\s+(\d+):(\d+)/.exec(raw);
      var msg = raw
        .replace(/^JSON5:\s*/, '')
        .replace(/\s*at\s+\d+:\d+\s*$/, '')
        .trim();

      if (m) {
        lastError = { line: +m[1], col: +m[2] };
        setStatus('❌ 第 ' + m[1] + ' 行第 ' + m[2] + ' 列 · ' + msg, 'err');
      } else {
        lastError = null;
        setStatus('❌ ' + msg, 'err');
      }
    }
  }

  function scheduleCheck() {
    clearTimeout(checkTimer);
    var delay = editor.value.length > 500000 ? 600 : 200;
    checkTimer = setTimeout(checkSyntax, delay);
  }

  /* ================= 行列 → 字符索引 ================= */
  function posToIndex(text, line, col) {
    var idx = 0;
    for (var l = 1; l < line; l++) {
      var n = text.indexOf('\n', idx);
      if (n === -1) return text.length;
      idx = n + 1;
    }
    return Math.min(idx + col - 1, text.length);
  }

  statusEl.addEventListener('click', function () {
    if (!lastError) return;
    var idx = posToIndex(editor.value, lastError.line, lastError.col);
    editor.focus();
    editor.setSelectionRange(idx, idx);
    updateCursor();
  });

  /* ================= 底部信息 ================= */
  function updateMeta() {
    var v = editor.value;
    var lines = v ? v.split('\n').length : 0;
    metaEl.textContent = v.length.toLocaleString() + ' 字符 · ' + lines + ' 行';
  }

  function updateCursor() {
    var v = editor.value;
    var pos = editor.selectionStart || 0;
    var line = 1, lineStart = 0;
    for (var i = 0; i < pos; i++) {
      if (v.charCodeAt(i) === 10) { line++; lineStart = i + 1; }
    }
    cursorEl.textContent = '行 ' + line + '，列 ' + (pos - lineStart + 1);
  }

  function onInput() {
    updateMeta();
    updateCursor();
    scheduleCheck();
    scheduleSearchRefresh();
  }

  editor.addEventListener('input', onInput);
  editor.addEventListener('click', updateCursor);
  editor.addEventListener('keyup', updateCursor);
  editor.addEventListener('focus', updateCursor);
  editor.addEventListener('select', updateCursor);

  // Tab 缩进 / Ctrl+S 下载 / F3 搜索导航 / Esc 关闭搜索
  editor.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var start = editor.selectionStart, end = editor.selectionEnd;
      var ok = false;
      try { ok = document.execCommand('insertText', false, '  '); } catch (err) { ok = false; }
      if (!ok) {
        editor.setRangeText('  ', start, end, 'end');
        onInput();
      }
      return;
    }

    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      downloadFile();
      return;
    }

    if (e.key === 'F3') {
      e.preventDefault();
      stepMatch(e.shiftKey ? -1 : 1);
      return;
    }

    if (e.key === 'Escape' && !searchBar.hidden) {
      closeSearch();
    }
  });

  /* ================= 格式化（原地替换） ================= */
  function applyFormat(mode) {
    var text = editor.value;

    if (!text.trim()) {
      flash('⚠️ 没有可格式化的内容', 'err');
      return;
    }

    var parsed;
    try {
      parsed = JSON5.parse(text);
    } catch (err) {
      checkSyntax();
      return;
    }

    var out, msg;
    try {
      if (mode === 'json') {
        out = JSON.stringify(parsed, null, 4);
        msg = '✅ 已格式化为标准 JSON';
      } else if (mode === 'json5') {
        out = JSON5.stringify(parsed, null, 4);
        msg = '✅ 已格式化为 JSON5';
      } else {
        var compact = text.indexOf('\n') !== -1;
        out = compact ? JSON5.stringify(parsed) : JSON5.stringify(parsed, null, 4);
        msg = compact ? '✅ 已切换为紧凑' : '✅ 已切换为展开';
      }
    } catch (err) {
      setStatus('❌ 序列化失败：' + (err && err.message), 'err');
      return;
    }

    if (out === undefined || out === null) out = 'null';

    editor.value = out;
    lastError = null;
    updateMeta();
    updateCursor();
    editor.focus();
    editor.setSelectionRange(out.length, out.length);
    flash(msg, 'ok');
  }

  document.getElementById('btnJson').addEventListener('click', function () { applyFormat('json'); });
  document.getElementById('btnJson5').addEventListener('click', function () { applyFormat('json5'); });
  document.getElementById('btnToggle').addEventListener('click', function () { applyFormat('toggle'); });

  /* ================= 复制 ================= */
  function copyOutput() {
    var text = editor.value;
    if (!text) { flash('⚠️ 没有可复制的内容', 'err'); return; }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        flash('✅ 已复制到剪贴板', 'ok');
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var sel = [editor.selectionStart, editor.selectionEnd];
    editor.focus();
    editor.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    editor.setSelectionRange(sel[0], sel[1]);
    flash(ok ? '✅ 已复制到剪贴板' : '❌ 复制失败，内容较大时请用「下载」', ok ? 'ok' : 'err');
  }

  /* ================= 下载（原保存按钮） ================= */
  function downloadFile() {
    var content = editor.value;
    if (!content.trim()) { flash('⚠️ 没有可下载的内容', 'err'); return; }

    var ext = 'json5';
    try { JSON.parse(content); ext = 'json'; } catch (e) {}

    var name = 'formatted.' + ext;
    var blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();

    setTimeout(function () {
      if (a.parentNode) document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 400);

    flash('✅ 已开始下载 ' + name, 'ok');
  }

  function clearInput() {
    editor.value = '';
    lastError = null;
    updateMeta();
    updateCursor();
    setStatus('等待输入…', '');
    editor.focus();
  }

  document.getElementById('btnCopy').addEventListener('click', copyOutput);
  document.getElementById('btnDownload').addEventListener('click', downloadFile);
  document.getElementById('btnClear').addEventListener('click', clearInput);

  /* ================= 导入本地文件 ================= */
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;

    setStatus('⏳ 正在读取 ' + file.name + ' …', '');

    var reader = new FileReader();
    reader.onload = function (e) {
      editor.value = e.target.result || '';
      fileInput.value = '';
      updateMeta();
      updateCursor();
      checkSyntax();
      scheduleSearchRefresh();
      flash('✅ 已导入：' + file.name, 'ok');
    };
    reader.onerror = function () {
      fileInput.value = '';
      setStatus('❌ 文件读取失败', 'err');
    };
    reader.readAsText(file, 'UTF-8');
  });

  /* ================= 搜索模块 ================= */
  var matches = [];
  var currentMatch = -1;
  var searchRefreshTimer = null;
  var SEARCH_LIMIT = 20000;

  function refreshMatches(resetIndex) {
    var kw = searchInput.value;
    matches = [];

    if (!kw) {
      currentMatch = -1;
      updateSearchCount();
      return;
    }

    var hay = editor.value.toLowerCase();
    var needle = kw.toLowerCase();
    var from = 0;

    while (matches.length < SEARCH_LIMIT) {
      var idx = hay.indexOf(needle, from);
      if (idx === -1) break;
      matches.push({ start: idx, end: idx + needle.length });
      from = idx + Math.max(1, needle.length);
    }

    if (resetIndex) {
      currentMatch = -1;
    } else if (currentMatch >= matches.length) {
      currentMatch = matches.length ? matches.length - 1 : -1;
    }

    updateSearchCount();
  }

  function updateSearchCount() {
    if (!searchInput.value) {
      searchCount.textContent = '—';
      return;
    }
    if (!matches.length) {
      searchCount.textContent = '0 / 0';
      return;
    }
    var pos = currentMatch >= 0 ? currentMatch + 1 : 0;
    var suffix = matches.length >= SEARCH_LIMIT ? '+' : '';
    searchCount.textContent = pos + ' / ' + matches.length + suffix;
  }

  function revealCurrent() {
    if (!matches.length) return;
    if (currentMatch < 0) currentMatch = 0;

    var m = matches[currentMatch];
    editor.focus();
    editor.setSelectionRange(m.start, m.end);
    updateCursor();
    updateSearchCount();
  }

  function stepMatch(dir) {
    clearTimeout(searchRefreshTimer);
    refreshMatches(true);

    if (!matches.length) {
      updateSearchCount();
      return;
    }

    if (currentMatch < 0) {
      currentMatch = dir > 0 ? 0 : matches.length - 1;
    } else {
      currentMatch = (currentMatch + dir + matches.length) % matches.length;
    }

    revealCurrent();
  }

  function scheduleSearchRefresh() {
    if (searchBar.hidden || !searchInput.value) return;
    clearTimeout(searchRefreshTimer);
    searchRefreshTimer = setTimeout(function () {
      refreshMatches(false);
    }, 250);
  }

  function openSearch() {
    searchBar.hidden = false;
    btnSearch.classList.add('active');
    searchInput.focus();
    searchInput.select();
    if (searchInput.value) {
      refreshMatches(true);
    } else {
      updateSearchCount();
    }
  }

  function closeSearch() {
    searchBar.hidden = true;
    btnSearch.classList.remove('active');
    clearTimeout(searchRefreshTimer);
    matches = [];
    currentMatch = -1;
    searchCount.textContent = '—';
    editor.focus();
  }

  btnSearch.addEventListener('click', function () {
    if (searchBar.hidden) openSearch();
    else closeSearch();
  });

  document.getElementById('closeSearch').addEventListener('click', closeSearch);
  document.getElementById('prevBtn').addEventListener('click', function () { stepMatch(-1); });
  document.getElementById('nextBtn').addEventListener('click', function () { stepMatch(1); });

  searchInput.addEventListener('input', function () {
    clearTimeout(searchRefreshTimer);
    searchRefreshTimer = setTimeout(function () {
      refreshMatches(true);
    }, 150);
  });

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      stepMatch(e.shiftKey ? -1 : 1);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeSearch();
    } else if (e.key === 'F3') {
      e.preventDefault();
      stepMatch(e.shiftKey ? -1 : 1);
    }
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      openSearch();
    }
  });

  /* ================= 初始化 ================= */
  updateMeta();
  updateCursor();

})();
</script>
</body>
</html>
