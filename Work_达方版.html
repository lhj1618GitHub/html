<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤加班薪资计算器-8.0.0</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft YaHei", sans-serif;
}
body {
  background-color: #000;
  color: #fff;
  padding: 15px;
  max-width: 900px;
  margin: 0 auto;
}
.tab-container {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 8px 16px;
  background: #222;
  color: #fff;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
}
.tab-btn.active {
  background: #0066cc;
  border-color: #0088ff;
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}
.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 12px;
}
.card-title {
  font-size: 16px;
  margin-bottom: 10px;
  color: #00ddff;
  border-left: 3px solid #0088ff;
  padding-left: 8px;
}
.form-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
label {
  min-width: 100px;
  font-size: 14px;
}
input, select {
  padding: 6px 8px;
  background: #222;
  color: #fff;
  border: 1px solid #444;
  border-radius: 4px;
  flex: 1;
  min-width: 140px;
}
button {
  padding: 6px 12px;
  background: #0066cc;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover {
  background: #0088ff;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 10px;
  display: block;
  overflow-x: auto;
  white-space: nowrap;
}
th, td {
  border: 1px solid #333;
  padding: 6px;
  text-align: center;
}
th {
  background: #222;
  color: #00ddff;
}
tr:nth-child(even) {
  background: #181818;
}
.stat-num {
  color: #990000;
  font-weight: bold;
}
.salary-total {
  font-size: 18px;
  color: #00ff88;
  font-weight: bold;
}
.del-btn {
  background: #cc0000;
}
.tip {
  color: #0f0;
  margin: 8px 0;
  font-weight: bold;
  height: 20px;
}
.config-btn {
  background: #6600cc;
}
.back-btn {
  background: #28a745;
}
.close-btn {
  background: #666;
}
.title-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}
.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.month-select-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
}
.month-select-row select {
  width: fit-content;
  min-width: 120px;
}
.empty-tip {
  color: #888;
  text-align: center;
  padding: 20px;
}
@media (max-width: 600px) {
  .form-row {
    flex-direction: column;
    align-items: flex-start;
  }
  label {
    min-width: auto;
  }
  input, select {
    width: 100%;
  }
  .title-row {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>
<body>

<div id="tabBar" class="tab-container">
  <button class="tab-btn active" data-tab="record">每日出勤登记</button>
  <button class="tab-btn" data-tab="stats">月度统计</button>
</div>

<!-- 每日出勤登记 -->
<div id="record" class="tab-content active">
  <div class="card">
    <div class="card-title">当日出勤信息录入</div>
    <div class="form-row">
      <label>日期</label>
      <input type="date" id="recordDate" required>
    </div>
    <div class="form-row">
      <label>出勤状态</label>
      <select id="workStatus" onchange="toggleLeaveHours()">
        <option value="正常">正常出勤</option>
        <option value="请假">请假</option>
        <option value="调休">调休</option>
        <option value="放假">放假</option>
      </select>
    </div>
    <div class="form-row" id="leaveHoursRow">
      <label>当日时长(小时)</label>
      <input type="number" id="leaveHours" min="0" step="0.5" value="8">
    </div>
    <div class="form-row">
      <label>班次类型</label>
      <select id="shiftType">
        <option value="白班">白班</option>
        <option value="夜班">夜班</option>
      </select>
    </div>
    <div class="form-row">
      <label>加班时长(小时)</label>
      <input type="number" id="overtimeHours" min="0" step="0.5" value="2.5">
    </div>
    <div class="form-row">
      <label>加班类型</label>
      <select id="overtimeType">
        <option value="1.5">工作日(1.5倍)</option>
        <option value="2">休息日(2倍)</option>
        <option value="3">法定假日(3倍)</option>
      </select>
    </div>
    <button onclick="saveRecord()" style="margin-top:10px;">保存当日记录</button>
    <div id="saveTip" class="tip"></div>
  </div>
</div>

<!-- 月度统计（内含薪资计算） -->
<div id="stats" class="tab-content">
  <!-- 出勤汇总 -->
  <div class="card" id="summaryCard">
    <div class="title-wrap">
      <div class="title-row">
        <div class="card-title">出勤/加班汇总(上月26日-本月25日)</div>
      </div>
      <div class="month-select-row">
        <select id="statMonth" onchange="onMonthChange('stat')"></select>
        <button class="config-btn" id="toggleSalaryBtn" onclick="toggleSalaryPanel()">薪资计算</button>
      </div>
    </div>
    <div id="monthStats"></div>
  </div>

  <!-- 薪资计算面板（默认隐藏） -->
  <div id="salaryPanel" class="card" style="display:none;">
    <div class="title-wrap">
      <div class="title-row">
        <div class="card-title">薪资明细(上月26日-本月25日)</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="config-btn" onclick="showConfig()">薪资配置</button>
          <button class="back-btn" onclick="closeSalaryPanel()">← 返回</button>
        </div>
      </div>
    </div>
    <div id="salaryResult"></div>
  </div>

  <!-- 薪资配置面板（默认隐藏） -->
  <div id="salarySettingPanel" class="card" style="display:none;">
    <div class="card-title">薪资基础设置</div>
    <div class="form-row">
      <label>月基本工资</label>
      <input type="number" id="baseSalary" min="0" value="0" oninput="autoCalcHourSalary()">
    </div>
    <div class="form-row">
      <label>月综合津贴</label>
      <input type="number" id="subsidy" min="0" value="0">
    </div>
    <div class="form-row">
      <label>技术加给</label>
      <input type="number" id="bonus" min="0" value="0">
    </div>
    <div class="form-row">
      <label>全勤奖金</label>
      <input type="number" id="fullAttendBonus" min="0" value="0">
    </div>
    <div class="form-row">
      <label>小时工资(自动)</label>
      <input type="number" id="hourSalary" readonly value="0">
    </div>
    <div class="form-row">
      <label>夜班每日补贴</label>
      <input type="number" id="nightSubsidy" min="0" value="0">
    </div>
    <div class="card-title" style="margin-top:12px;">五险一金扣费</div>
    <div class="form-row"><label>养老保险</label><input type="number" id="endowment" value="0"></div>
    <div class="form-row"><label>医疗保险</label><input type="number" id="medical" value="0"></div>
    <div class="form-row"><label>失业保险</label><input type="number" id="unemployment" value="0"></div>
    <div class="form-row"><label>工伤保险</label><input type="number" id="injury" value="0"></div>
    <div class="form-row"><label>生育保险</label><input type="number" id="maternity" value="0"></div>
    <div class="form-row"><label>住房公积金</label><input type="number" id="fund" value="0"></div>
    <div class="card-title" style="margin-top:12px;">其他扣费项目</div>
    <div class="form-row"><label>餐费扣除</label><input type="number" id="meal" value="0"></div>
    <div class="form-row"><label>所得税</label><input type="number" id="deduct" value="0"></div>
    <button onclick="saveSetting()" style="margin-top:10px;">保存配置</button>
    <button class="back-btn" onclick="closeSettingPanel()" style="margin-left:8px;">← 返回薪资计算</button>
    <div id="setTip" class="tip"></div>
  </div>

  <!-- 记录列表（根据面板状态隐藏/显示） -->
  <div class="card" id="recordListCard">
    <div class="card-title">周期出勤记录列表（点击行可编辑）</div>
    <div id="recordList"></div>
  </div>
</div>

<script>
const STANDARD_DAYS = 21.75;
const STANDARD_HOURS_PER_DAY = 8;

let data = {
  records: [],
  setting: {
    baseSalary: 0, subsidy: 0, bonus: 0, fullAttendBonus: 0, hourSalary: 0,
    nightSubsidy: 0, endowment: 0, medical: 0, unemployment: 0, injury: 0,
    maternity: 0, fund: 0, meal: 0, deduct: 0
  }
};

// Tab 切换
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const tabId = this.getAttribute('data-tab');
    switchTab(tabId, this);
  });
});

function switchTab(id, btnElement) {
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btnElement.classList.add("active");
  renderAll();
}

function getCycleRange(monthStr) {
  const [curY, curM] = monthStr.split('-').map(Number);
  let startY = curY;
  let startM = curM - 1;
  if (startM === 0) {
    startY = curY - 1;
    startM = 12;
  }
  const start = new Date(startY, startM - 1, 26);
  const end = new Date(curY, curM - 1, 26);
  return { start, end };
}

function initMonthSelects() {
  const statMonth = document.getElementById('statMonth');
  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth() + 1;
  const curMonthStr = `${curYear}-${String(curMonth).padStart(2, '0')}`;
  
  statMonth.innerHTML = '';
  for (let y = curYear; y >= curYear - 5; y--) {
    const maxM = (y === curYear) ? curMonth : 12;  // 当年只到当前月
    for (let m = maxM; m >= 1; m--) {
      const monthStr = `${y}-${String(m).padStart(2, '0')}`;
      const opt = document.createElement('option');
      opt.value = monthStr;
      opt.textContent = `${y}年${m}月`;
      statMonth.appendChild(opt);
    }
  }
  statMonth.value = curMonthStr;
}

function getSelectMonth() {
  return document.getElementById("statMonth").value;
}

function getMonthRecords() {
  const month = getSelectMonth();
  if (!month) return data.records;
  const { start, end } = getCycleRange(month);
  return data.records.filter(r => {
    const d = new Date(r.date);
    return d >= start && d < end;
  });
}

function showTip(msg) {
  const el = document.getElementById("saveTip");
  el.innerText = msg;
  setTimeout(() => el.innerText = "", 3000);
}

function showSetTip(msg) {
  const el = document.getElementById("setTip");
  el.innerText = msg;
  setTimeout(() => el.innerText = "", 3000);
}

// 控制各区域显示/隐藏
function updateVisibility() {
  const salaryPanel = document.getElementById("salaryPanel");
  const settingPanel = document.getElementById("salarySettingPanel");
  const summaryCard = document.getElementById("summaryCard");
  const recordListCard = document.getElementById("recordListCard");

  const inSalary = salaryPanel.style.display === "block";
  const inSetting = settingPanel.style.display === "block";

  if (inSalary || inSetting) {
    summaryCard.style.display = "none";
    recordListCard.style.display = "none";
  } else {
    summaryCard.style.display = "block";
    recordListCard.style.display = "block";
  }
}

function updateToggleBtnText() {
  const btn = document.getElementById("toggleSalaryBtn");
  const salaryPanel = document.getElementById("salaryPanel");
  btn.textContent = (salaryPanel.style.display === "block") ? "出勤列表" : "薪资计算";
}

function toggleSalaryPanel() {
  const panel = document.getElementById("salaryPanel");
  const settingPanel = document.getElementById("salarySettingPanel");
  if (panel.style.display === "none") {
    panel.style.display = "block";
    settingPanel.style.display = "none";
    renderSalary();
  } else {
    panel.style.display = "none";
  }
  updateVisibility();
  updateToggleBtnText();
}

function closeSalaryPanel() {
  document.getElementById("salaryPanel").style.display = "none";
  updateVisibility();
  updateToggleBtnText();
}

function showConfig() {
  document.getElementById("salarySettingPanel").style.display = "block";
  document.getElementById("salaryPanel").style.display = "none";
  loadSettingToForm();
  updateVisibility();
  updateToggleBtnText();
}

function closeSettingPanel() {
  document.getElementById("salarySettingPanel").style.display = "none";
  document.getElementById("salaryPanel").style.display = "block";
  renderSalary();
  updateVisibility();
  updateToggleBtnText();
}

function loadSettingToForm() {
  const s = data.setting;
  Object.keys(s).forEach(key => {
    const el = document.getElementById(key);
    if (el) el.value = s[key];
  });
}

function toggleLeaveHours() {
  document.getElementById("leaveHours").value = 8;
}

function loadData() {
  const d = localStorage.getItem("attendanceData");
  if (d) {
    try {
      data = JSON.parse(d);
    } catch (e) {
      console.error("数据解析失败", e);
    }
  }
  renderAll();
}

function saveData() {
  localStorage.setItem("attendanceData", JSON.stringify(data));
}

function autoCalcHourSalary() {
  const base = parseFloat(document.getElementById("baseSalary").value) || 0;
  const hour = base / (STANDARD_DAYS * STANDARD_HOURS_PER_DAY);
  document.getElementById("hourSalary").value = hour.toFixed(3);
}

function saveRecord() {
  const date = document.getElementById("recordDate").value;
  const status = document.getElementById("workStatus").value;
  const leaveHours = parseFloat(document.getElementById("leaveHours").value) || 0;
  const shift = document.getElementById("shiftType").value;
  const overtimeHours = parseFloat(document.getElementById("overtimeHours").value) || 0;
  const overtimeType = parseFloat(document.getElementById("overtimeType").value);

  if (!date) { showTip("❌ 请选择日期"); return; }

  data.records = data.records.filter(r => r.date !== date);
  data.records.push({ date, status, leaveHours, shift, overtimeHours, overtimeType });
  saveData();
  renderAll();
  showTip("✅ 保存成功！");
}

function editRecord(date) {
  const record = data.records.find(r => r.date === date);
  if (!record) return;
  document.getElementById("recordDate").value = record.date;
  document.getElementById("workStatus").value = record.status;
  document.getElementById("leaveHours").value = record.leaveHours;
  document.getElementById("shiftType").value = record.shift;
  document.getElementById("overtimeHours").value = record.overtimeHours;
  document.getElementById("overtimeType").value = record.overtimeType;
  document.querySelectorAll('.tab-btn')[0].click();
  showTip("✏️ 已加载记录，修改后保存即可");
}

function deleteRecord(date) {
  if (!confirm("确定删除该记录？")) return;
  data.records = data.records.filter(r => r.date !== date);
  saveData();
  renderAll();
  showTip("🗑️ 删除成功");
}

function onMonthChange(source) {
  renderAll();
}

function renderAll() {
  renderList();
  renderStats();
  if (document.getElementById("salaryPanel").style.display !== "none") {
    renderSalary();
  }
  updateToggleBtnText();
}

function renderList() {
  const list = document.getElementById("recordList");
  const arr = getMonthRecords().sort((a, b) => new Date(a.date) - new Date(b.date));
  if (arr.length === 0) {
    list.innerHTML = '<p class="empty-tip">暂无当前周期记录</p>';
    return;
  }
  let html = `<table>
    <tr><th>日期</th><th>状态</th><th>时长</th><th>班次</th><th>加班详情</th><th>操作</th></tr>`;
  arr.forEach(r => {
    const leaveText = r.leaveHours + "h";
    const overtimeText = r.overtimeHours > 0 ? `${r.overtimeHours}h(${r.overtimeType}倍)` : "-";
    html += `<tr style="cursor:pointer;" onclick="editRecord('${r.date}')">
      <td>${r.date}</td>
      <td>${r.status}</td>
      <td>${leaveText}</td>
      <td>${r.shift}</td>
      <td>${overtimeText}</td>
      <td><button class="del-btn" onclick="event.stopPropagation();deleteRecord('${r.date}')">删除</button></td>
    </tr>`;
  });
  html += "</table>";
  list.innerHTML = html;
}

function renderStats() {
  const r = getMonthRecords();
  let normal = 0, leave = 0, rest = 0, holiday = 0, night = 0;
  let ot15 = 0, ot2 = 0, ot3 = 0, totalOt = 0;
  
  r.forEach(i => {
    if (i.status === "正常") normal++;
    if (i.status === "请假") leave++;
    if (i.status === "调休") rest++;
    if (i.status === "放假") holiday++;
    if (i.shift === "夜班") night++;
    totalOt += i.overtimeHours;
    if (i.overtimeType === 1.5) ot15 += i.overtimeHours;
    if (i.overtimeType === 2) ot2 += i.overtimeHours;
    if (i.overtimeType === 3) ot3 += i.overtimeHours;
  });

  document.getElementById("monthStats").innerHTML = `
    <p>正常出勤：${normal} 天 ，夜班：${night} 天</p>
    <p>请假：${leave}次，调休：${rest}次，放假：${holiday}次</p>
    <p>&nbsp;&nbsp;工作日&nbsp;1.5 倍加班：${ot15.toFixed(1)}h</p>
    <p>&nbsp;&nbsp;休息日&nbsp;&nbsp;&nbsp;2&nbsp;&nbsp;倍加班：${ot2.toFixed(1)}h</p>
    <p>&nbsp;&nbsp;节假日&nbsp;&nbsp;&nbsp;3&nbsp;&nbsp;倍加班：${ot3.toFixed(1)}h</p>
    <p>总加班时长：${totalOt.toFixed(1)}H</p>`;
}

function saveSetting() {
  const ids = ['baseSalary','subsidy','bonus','fullAttendBonus','hourSalary',
    'nightSubsidy','endowment','medical','unemployment','injury','maternity','fund','meal','deduct'];
  ids.forEach(id => {
    data.setting[id] = parseFloat(document.getElementById(id).value) || 0;
  });
  saveData();
  renderSalary();
  showSetTip("✅ 配置保存成功");
}

function renderSalary() {
  const s = data.setting;
  const r = getMonthRecords();
  const h = s.hourSalary;
  
  const hasLeave = r.some(item => item.status === "请假");
  const fullBonus = hasLeave ? 0 : s.fullAttendBonus;
  
  const nightDays = r.filter(x => x.shift === "夜班").length;
  const nightPay = nightDays * s.nightSubsidy;
  
  let ot15 = 0, ot2 = 0, ot3 = 0;
  r.forEach(i => {
    if (i.overtimeHours > 0) {
      if (i.overtimeType === 1.5) ot15 += i.overtimeHours;
      if (i.overtimeType === 2) ot2 += i.overtimeHours;
      if (i.overtimeType === 3) ot3 += i.overtimeHours;
    }
  });
  
  const ot15Pay = ot15 * h * 1.5;
  const ot2Pay = ot2 * h * 2;
  const ot3Pay = ot3 * h * 3;
  const totalOtPay = ot15Pay + ot2Pay + ot3Pay;
  
  let totalLeaveHours = 0;
  r.forEach(i => {
    if (i.status === "请假" && i.leaveHours > 0) totalLeaveHours += i.leaveHours;
  });
  const leaveDeduct = totalLeaveHours * h;
  
  const baseTotal = s.baseSalary + s.subsidy + s.bonus + fullBonus + nightPay;
  const preTotal = baseTotal + totalOtPay - leaveDeduct;
  const socialTotal = s.endowment + s.medical + s.unemployment + s.injury + s.maternity + s.fund;
  const totalDeduct = socialTotal + s.meal + s.deduct;
  const net = preTotal - totalDeduct;

  document.getElementById("salaryResult").innerHTML = `
    <hr style="margin:6px 0;border-color:#333;">
    <p>• 基本工资：${s.baseSalary.toFixed(2)} 元</p>
    <p>• 综合津贴：${s.subsidy.toFixed(2)} 元</p>
    <p>• 技术加给：${s.bonus.toFixed(2)} 元</p>
    <p>• 全勤奖金：${fullBonus.toFixed(2)} 元</p>
    <p>• 夜班补贴：${nightPay.toFixed(2)} 元</p>
    <p style="color:#daa520;">基础薪资合计：${baseTotal.toFixed(2)} 元</p>
    <hr style="margin:6px 0;border-color:#333;">
    <p>• 1.5倍加班：${ot15Pay.toFixed(2)} 元</p>
    <p>• 2倍加班：${ot2Pay.toFixed(2)} 元</p>
    <p>• 3倍加班：${ot3Pay.toFixed(2)} 元</p>
    <p style="color:#daa520;">加班费合计：${totalOtPay.toFixed(2)} 元</p>
    <hr style="margin:6px 0;border-color:#333;">
    <p style="color:#ffcc00;font-weight:bold;">税前总收入：${preTotal.toFixed(2)} 元</p>
    <hr style="margin:6px 0;border-color:#333;">
    <p>• 请假扣款：${leaveDeduct.toFixed(2)} 元(${totalLeaveHours}h)</p>
    <p>• 社保合计：${socialTotal.toFixed(2)} 元</p>
    <p>• 所得税：${s.deduct.toFixed(2)} 元</p>
    <p>• 餐费：${s.meal.toFixed(2)} 元</p>
    <p style="color:#990000;font-weight:bold;">总扣费合计：${(leaveDeduct+socialTotal+s.meal+s.deduct).toFixed(2)} 元</p>
    <hr style="margin:6px 0;border-color:#333;">
    <p class="salary-total">实发工资：${net.toFixed(2)} 元</p>`;
}

window.onload = function() {
  loadData();
  initMonthSelects();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById("recordDate").setAttribute("max", today);
  document.getElementById("recordDate").value = today;
  autoCalcHourSalary();
  toggleLeaveHours();
  updateVisibility();
  updateToggleBtnText();
};
</script>
