<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人实用工具集</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        * { box-sizing: border-box; }

        :root {
            --bg: #f3f4f6;
            --text: #1f2937;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --divider: #eeeeee;
            --hover: #2563eb;
            --btn-bg: #ffffff;
            --btn-border: #d1d5db;
            --btn-shadow: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #e5e7eb;
            --card-bg: #1e293b;
            --border: #334155;
            --divider: #334155;
            --hover: #60a5fa;
            --btn-bg: #1e293b;
            --btn-border: #475569;
            --btn-shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 16px;
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 20px;
            text-align: center;
        }

        ol.tool-list {
            list-style: decimal;
            padding-left: 1.6em;
            margin: 0;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-right: 1.6em;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        ol.tool-list li {
            padding: 12px 4px;
            border-bottom: 1px solid var(--divider);
        }

        ol.tool-list li:last-child {
            border-bottom: none;
        }

        ol.tool-list li a {
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
        }

        ol.tool-list li a:hover {
            color: var(--hover);
            text-decoration: underline;
        }

        /* ===== 日/夜主题切换按钮 ===== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--btn-border);
            border-radius: 999px;
            background: var(--btn-bg);
            color: var(--text);
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--btn-shadow);
            transition: background-color 0.3s ease, color 0.3s ease,
                        border-color 0.3s ease, transform 0.15s ease;
        }

        .theme-toggle:hover { transform: translateY(-1px); }
        .theme-toggle:active { transform: translateY(0); }
        .theme-toggle svg { width: 22px; height: 22px; display: block; }

        /* 浅色下显示月亮（点击切到夜间），深色下显示太阳（点击切到日间） */
        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle" type="button"
            aria-label="切换日/夜主题" title="切换日/夜主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
    </button>

    <div class="wrap">
        <h1>个人实用工具集</h1>
        <ol class="tool-list">
            <li><a href="https://lhj1618github.github.io/html/LiTT.html" target="_blank">李跳跳自定义规则工具</a></li>
            <li><a href="https://lhj1618github.github.io/html/李跳跳进阶指南.html" target="_blank">李跳跳进阶指南</a></li>
            <li><a href="https://lhj1618github.github.io/html/json5.html" target="_blank">JSON5 格式化查错</a></li>
            <li><a href="https://lhj1618github.github.io/html/文本编辑器.html" target="_blank">本地文本编辑器</a></li>
            <li><a href="https://lhj1618github.github.io/html/memo-记录.html" target="_blank">本地记录存档系统</a></li>
            <li><a href="https://lhj1618github.github.io/html/追剧进度管理器.html" target="_blank">追剧进度管理器</a></li>
            <li><a href="https://lhj1618github.github.io/html/GKD订阅文件工具.html" target="_blank">GKD订阅文件工具</a></li>
            <li><a href="https://lhj1618github.github.io/html/出勤和薪资计算.html" target="_blank">出勤和薪资计算</a></li>
            <li><a href="https://lhj1618github.github.io/html/GitHub项目版本检测&下载工具.html" target="_blank">GitHub项目版本检测&下载工具</a></li>
            <li><a href="https://lhj1618github.github.io/html/Car-车辆加油和消费记录.html" target="_blank">Car-车辆加油和消费记录</a></li>
        </ol>
    </div>

    <script>
        (function () {
            var html = document.documentElement;
            var btn = document.getElementById('themeToggle');
            var KEY = 'theme';

            function systemTheme() {
                return window.matchMedia &&
                       window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function applyTheme(theme) {
                if (theme === 'dark') html.setAttribute('data-theme', 'dark');
                else html.removeAttribute('data-theme');
            }

            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) {}
            applyTheme(saved === 'dark' || saved === 'light' ? saved : systemTheme());

            if (btn) {
                btn.addEventListener('click', function () {
                    var cur = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                    var next = cur === 'dark' ? 'light' : 'dark';
                    applyTheme(next);
                    try { localStorage.setItem(KEY, next); } catch (e) {}
                });
            }

            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
                    var stored = null;
                    try { stored = localStorage.getItem(KEY); } catch (err) {}
                    if (stored !== 'dark' && stored !== 'light') applyTheme(e.matches ? 'dark' : 'light');
                });
            }
        })();
    </script>
</body>
</html>
