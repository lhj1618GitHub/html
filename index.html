<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人实用工具集</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        * { box-sizing: border-box; }

        :root {
            --bg: #f4f5f7;
            --text: #1f2430;
            --muted: #9aa2b1;
            --card-bg: #ffffff;
            --border: #e6e8ee;
            --divider: #f0f1f5;
            --accent: #2563eb;
            --item-hover: #f3f7ff;
            --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 10px 28px -12px rgba(16, 24, 40, .18);
            --btn-bg: #ffffff;
            --btn-border: #e2e5eb;
            --btn-shadow: rgba(16, 24, 40, .10);
        }

        [data-theme="dark"] {
            --bg: #0b1220;
            --text: #e6eaf2;
            --muted: #6b7a91;
            --card-bg: #131b29;
            --border: #222d3f;
            --divider: #1d2634;
            --accent: #60a5fa;
            --item-hover: #1a2436;
            --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px -12px rgba(0, 0, 0, .6);
            --btn-bg: #131b29;
            --btn-border: #2a3648;
            --btn-shadow: rgba(0, 0, 0, .5);
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 56px 16px 64px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            transition: background-color .3s ease, color .3s ease;
        }

        .wrap {
            max-width: 620px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: .02em;
            text-align: center;
            margin: 0 0 22px;
        }

        /* ===== 工具列表 ===== */
        ol.tool-list {
            list-style: none;
            counter-reset: tool;
            margin: 0;
            padding: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            transition: background-color .3s ease, border-color .3s ease, box-shadow .3s ease;
        }

        ol.tool-list li {
            counter-increment: tool;
        }

        ol.tool-list li + li {
            border-top: 1px solid var(--divider);
        }

        ol.tool-list li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            color: var(--text);
            font-size: 14.5px;
            line-height: 1.45;
            text-decoration: none;
            transition: background-color .18s ease, color .18s ease;
        }

        /* 序号 */
        ol.tool-list li a::before {
            content: counter(tool);
            flex: 0 0 20px;
            text-align: right;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            transition: color .18s ease;
        }

        /* 右侧箭头 */
        ol.tool-list li a::after {
            content: "";
            flex: 0 0 auto;
            width: 6px;
            height: 6px;
            margin-left: 4px;
            border-top: 1.5px solid currentColor;
            border-right: 1.5px solid currentColor;
            transform: rotate(45deg);
            color: var(--muted);
            opacity: .5;
            transition: opacity .18s ease, color .18s ease;
        }

        ol.tool-list li a:hover {
            background: var(--item-hover);
            color: var(--accent);
        }

        ol.tool-list li a:hover::before,
        ol.tool-list li a:hover::after {
            color: var(--accent);
            opacity: 1;
        }

        /* ===== 日/夜主题切换按钮 ===== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--btn-border);
            border-radius: 999px;
            background: var(--btn-bg);
            color: var(--text);
            cursor: pointer;
            box-shadow: 0 2px 8px var(--btn-shadow);
            transition: background-color .3s ease, color .3s ease,
                        border-color .3s ease, transform .15s ease;
        }

        .theme-toggle:hover { transform: translateY(-1px); }
        .theme-toggle:active { transform: translateY(0); }
        .theme-toggle svg { width: 19px; height: 19px; display: block; }

        /* 浅色下显示月亮（点击切到夜间），深色下显示太阳（点击切到日间） */
        .theme-toggle .icon-sun { display: none; }
        .theme-toggle .icon-moon { display: block; }
        [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
        [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

        @media (max-width: 480px) {
            body { padding: 44px 12px 48px; }
            h1 { font-size: 18px; margin-bottom: 18px; }
            ol.tool-list li a { font-size: 14px; padding: 11px 10px; gap: 10px; }
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle" type="button"
            aria-label="切换日/夜主题" title="切换日/夜主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
    </button>

    <div class="wrap">
        <h1>个人实用工具集</h1>
        <ol class="tool-list">
            <li><a href="https://github.com/lhj1618GitHub/Android-play" target="_blank" rel="noopener">Android端日常玩机-Github</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/书签有效性检测.html" target="_blank" rel="noopener">浏览器书签有效性检测</a></li>
            <li><a href="https://gitee.com/lhj1618/js" target="_blank" rel="noopener">浏览器日常脚本</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/LiTT.html" target="_blank" rel="noopener">李跳跳自定义规则工具</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/李跳跳进阶指南.html" target="_blank" rel="noopener">李跳跳进阶指南</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/json5.html" target="_blank" rel="noopener">JSON5 格式化查错</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/GKD-TOOL.html" target="_blank" rel="noopener">GKD订阅文件可视化工具</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/GitHub项目版本检测&下载工具.html" target="_blank" rel="noopener">GitHub项目版本检测和下载</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/文本编辑器.html" target="_blank" rel="noopener">本地文件编辑器</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/memo-记录.html" target="_blank" rel="noopener">本地记录存档-时段版</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/追剧进度管理器.html" target="_blank" rel="noopener">追剧进度管理器</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/出勤和薪资计算.html" target="_blank" rel="noopener">出勤和薪资计算统计</a></li>
            <li><a href="https://lhj1618github.github.io/html/Tool/Car-车辆加油和消费记录.html" target="_blank" rel="noopener">Car-车辆加油和消费记录</a></li>
        </ol>
    </div>

    <script>
        (function () {
            var html = document.documentElement;
            var btn = document.getElementById('themeToggle');
            var KEY = 'theme';

            function systemTheme() {
                return window.matchMedia &&
                       window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function applyTheme(theme) {
                if (theme === 'dark') html.setAttribute('data-theme', 'dark');
                else html.removeAttribute('data-theme');
            }

            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) {}
            applyTheme(saved === 'dark' || saved === 'light' ? saved : systemTheme());

            if (btn) {
                btn.addEventListener('click', function () {
                    var cur = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                    var next = cur === 'dark' ? 'light' : 'dark';
                    applyTheme(next);
                    try { localStorage.setItem(KEY, next); } catch (e) {}
                });
            }

            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
                    var stored = null;
                    try { stored = localStorage.getItem(KEY); } catch (err) {}
                    if (stored !== 'dark' && stored !== 'light') applyTheme(e.matches ? 'dark' : 'light');
                });
            }
        })();
    </script>
</body>
</html>
